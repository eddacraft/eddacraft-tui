# cargo-about config. Allowlist MUST stay in sync with deny.toml [licenses].

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]

# Private crates we ship as part of Anvil; omit them from attribution.
# All anvil-* workspace members carry `license = "LicenseRef-Proprietary"`
# and are not published to any registry (publish = false), so ignore = true
# excludes them from the third-party notices.
private = { ignore = true }

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
