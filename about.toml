# cargo-about config for third-party attribution.
#
# `accepted` mirrors deny.toml [licenses].allow for third-party crates;
# LicenseRef-Proprietary is intentionally omitted here because the
# private = { ignore = true } filter below excludes our internal
# LicenseRef-Proprietary crates from the generated notices.
# Keep this list in sync with deny.toml when adding/removing third-party
# licences.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    # Accepted for the `ring` crate only — activated via the `ring` workaround
    # below. ring is not currently a runtime dep (rustls defaults to aws-lc-rs
    # in this workspace), but it's in Cargo.lock behind optional feature flags
    # in quinn-proto and rustls-webpki. This is defensive: if we ever flip
    # rustls's crypto backend to ring, cargo-about will attribute it correctly
    # rather than silently dropping it.
    "OpenSSL",
]

# Built-in cargo-about workarounds for crates with complicated licences.
# The `ring` workaround resolves the `ISC AND OpenSSL AND MIT` licence
# expression by attributing the correct licence files. Paired with the
# `OpenSSL` entry in `accepted` above; both are defensive against a future
# crypto-backend switch to ring.
workarounds = ["ring"]

# Private crates we ship as part of Anvil; omit them from attribution.
# All anvil-* workspace members carry `license = "LicenseRef-Proprietary"`
# and are not published to any registry (publish = false), so ignore = true
# excludes them from the third-party notices.
private = { ignore = true }

# Dev-dependencies are not linked into the shipping `anvil` binary, so they
# are excluded from attribution (e.g. insta, criterion, wiremock, temp-env).
# Build-dependencies are similarly unshipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
