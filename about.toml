# cargo-about config for third-party attribution.
#
# The `accepted` array is generated from `licences.toml` by
# tools/starters/acknowledgements/expand-licences.sh (ATTRIB-006).
# Edit `licences.toml`, not this file, when adding or removing entries.
# CI runs the expander in --check mode to catch drift.

accepted = [
  # BEGIN AUTO-GENERATED FROM licences.toml — accepted
  # Generated from licences.toml — do not edit between the BEGIN/END markers.
  # Update licences.toml and rerun tools/starters/acknowledgements/expand-licences.sh.
  #
  # Source: licences.toml ([[licences]] entries where about = true)
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  # ATTRIB-015. npm Inc relicensed `minimatch` (and a small family of related 
  # glob packages) under BlueOak-1.0.0 — OSI-approved, OSI permissive. 
  # Pulled in transitively by every Node devtool that walks paths.
  "BlueOak-1.0.0",
  # ATTRIB-015. Microsoft `tslib` (TypeScript runtime helpers) ships under the 
  # Zero-clause BSD licence — equivalent to public domain dedication.
  "0BSD",
  # ATTRIB-015. Python Software Foundation licence. `argparse@2.0.x` (JS port 
  # of Python's argparse) ships under it as a courtesy nod to the original; 
  # OSI-approved permissive.
  "Python-2.0",
  # ATTRIB-015. Creative Commons Attribution 3.0 — used for non-code data 
  # files (SPDX exception lists in `spdx-exceptions`, also surfaced via the 
  # compound `MIT AND CC-BY-3.0` expression on `spdx-license-ids`). 
  # license-checker itself pulls these in transitively; the attribution tool 
  # ends up attributing its own data layer.
  "CC-BY-3.0",
  # Accepted for the `ring` crate only — activated via the `ring` workaround 
  # in about.toml. ring is not currently a runtime dep (rustls defaults to 
  # aws-lc-rs in this workspace), but it's in Cargo.lock behind optional 
  # feature flags in quinn-proto and rustls-webpki. This is defensive: if we 
  # ever flip rustls's crypto backend to ring, cargo-about will attribute it 
  # correctly rather than silently dropping it.
  "OpenSSL",
  # END AUTO-GENERATED FROM licences.toml — accepted
]

# Built-in cargo-about workarounds for crates with complicated licences.
# The `ring` workaround resolves the `ISC AND OpenSSL AND MIT` licence
# expression by attributing the correct licence files. Paired with the
# `OpenSSL` entry in `accepted` above; both are defensive against a future
# crypto-backend switch to ring.
workarounds = ["ring"]

# Private crates we ship as part of Anvil; omit them from attribution.
# All anvil-* workspace members carry `license = "LicenseRef-Proprietary"`
# and are not published to any registry (publish = false), so ignore = true
# excludes them from the third-party notices.
private = { ignore = true }

# Dev-dependencies are not linked into the shipping `anvil` binary, so they
# are excluded from attribution (e.g. insta, criterion, wiremock, temp-env).
# Build-dependencies are similarly unshipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true

targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
