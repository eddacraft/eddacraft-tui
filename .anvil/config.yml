policies:
  org:
    source: 'git@github.com:eddacraft/anvil-policies.git'
    ref: 'v1.0.0'
  team:
    - name: 'secret-scan'
      reason: 'Secrets in source control are the #1 cause of security breaches.'
      owner: '@security-team'
      enforcement: block
    - name: 'coverage_min'
      reason: 'Maintain test coverage to catch regressions early.'
      owner: '@platform-team'
      enforcement: warn
    - name: 'change_scope'
      reason: 'Large changes are harder to review and more likely to introduce bugs.'
      owner: '@platform-team'
      enforcement: warn
    - name: 'security_baseline'
      reason: 'Security-sensitive files need additional review.'
      owner: '@security-team'
      enforcement: block
    - name: 'no-direct-db-queries'
      reason: 'Use the data layer. Direct queries bypass audit logging.'
      owner: '@data-team'
      enforcement: warn
      effective: '2026-03-01'
  starter_profile: monorepo
announcements:
  - message: 'Policy documentation now available via `anvil policy doc`'
    level: info
    expires: '2026-04-01'
