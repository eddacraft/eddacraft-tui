# Anvil's third-party-attribution config. Drives
# tools/starters/acknowledgements/generate-acknowledgements.sh.
#
# Schema reference: tools/starters/acknowledgements/README.md
# Module: plans/archive/modules/attribution-pipeline-v3.aps.md
#
# This config and its consumer files (about.toml, about.hbs, deny.toml,
# licences.toml, licences.*-allow.txt) live in `attribution/`. Paths
# below resolve relative to this file's directory, so root-level targets
# (ACKNOWLEDGEMENTS.md, crate/package manifests) are reached via `../`.

[project]
target_path = "../ACKNOWLEDGEMENTS.md"
fixit_command = "tools/starters/acknowledgements/generate-acknowledgements.sh --config attribution/attribution.toml"

# ATTRIB-008 dispatcher schema. ATTRIB-015 migrated from the flat
# `[rust]` back-compat shim to the canonical `[[blocks]]` form when
# the second block (`node-devtools`) landed.

[[blocks]]
name = "rust"
ecosystem = "rust"
# Scoped to crates/anvil-cli so cargo-about walks only the shipping
# `anvil` binary's runtime dependency graph. Dev-deps (insta, criterion,
# wiremock, ...) are not linked into the shipped binary and are excluded
# from attribution.
manifest_path = "../crates/anvil-cli/Cargo.toml"
template_path = "about.hbs"
config_path = "about.toml"

[[blocks]]
name = "node-devtools"
ecosystem = "node"
# ATTRIB-015. Curated devtools manifest at tools/dev/package.json
# declaring 8 build/test/lint tools (nx, husky, oxlint, oxfmt, vitest,
# @playwright/test, typescript, markdownlint-cli). Per the spec's
# open-question decision (line 358-363), root package.json with
# prod_only=false produced 2034 transitive packages including
# proprietary Nx Powerpack + Copilot CLI; the curated minimum gives
# 231 packages with no proprietary noise. Key dev deps and tools
# beyond this curated minimum live in the hand-curated `## Thanks`
# section of ACKNOWLEDGEMENTS.md.
manifest_path = "../tools/dev/package.json"
node_allow_path = "licences.node-allow.txt"
prod_only = false
