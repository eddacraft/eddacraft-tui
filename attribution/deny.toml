# cargo-deny policy for the Anvil Rust workspace.
#
# See `about.toml` — both files hand-keep the licence allowlist;
# keep them in sync when adding/removing licences.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# To temporarily unblock CI while a fix is being worked on, add an entry:
#   { id = "RUSTSEC-YYYY-NNNN", reason = "tracked in <issue URL>, fix expected by <date>" }
# Prefer bumping the affected dep over ignoring; use this as a time-boxed
# escape hatch, not a permanent bypass.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The `allow` array is generated from `licences.toml` by
# tools/starters/acknowledgements/expand-licences.sh (ATTRIB-006).
# Edit `licences.toml`, not this file, when adding or removing entries.
allow = [
  # BEGIN AUTO-GENERATED FROM licences.toml — allow
  # Generated from licences.toml — do not edit between the BEGIN/END markers.
  # Update licences.toml and rerun tools/starters/acknowledgements/expand-licences.sh.
  #
  # Source: licences.toml ([[licences]] entries where deny = true)
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  # ATTRIB-015. npm Inc relicensed `minimatch` (and a small family of related
  # glob packages) under BlueOak-1.0.0 — OSI-approved, OSI permissive. Pulled
  # in transitively by every Node devtool that walks paths.
  "BlueOak-1.0.0",
  # ATTRIB-015. Microsoft `tslib` (TypeScript runtime helpers) ships under the
  # Zero-clause BSD licence — equivalent to public domain dedication.
  "0BSD",
  # ATTRIB-015. Python Software Foundation licence. `argparse@2.0.x` (JS port
  # of Python's argparse) ships under it as a courtesy nod to the original;
  # OSI-approved permissive.
  "Python-2.0",
  # ATTRIB-015. Creative Commons Attribution 3.0 — used for non-code data files
  # (SPDX exception lists in `spdx-exceptions`, also surfaced via the compound
  # `MIT AND CC-BY-3.0` expression on `spdx-license-ids`). license-checker
  # itself pulls these in transitively; the attribution tool ends up
  # attributing its own data layer.
  "CC-BY-3.0",
  # Anvil's internal crates carry `license = "LicenseRef-Proprietary"`;
  # about.toml's private.ignore filters them out of the generated attribution,
  # so this entry never needs to appear in about.toml.accepted.
  "LicenseRef-Proprietary",
  # END AUTO-GENERATED FROM licences.toml — allow
]
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
  # Hakari's aggregation can create multiple versions intentionally;
  # the hack crate itself must not be flagged.
  { name = "workspace-hack" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
