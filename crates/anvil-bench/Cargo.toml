[package]
name = "anvil-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stress test harness for anvil-kernel — repo generation, memory measurement, scenario runners"
publish = false

[dependencies]
anvil-kernel = { path = "../anvil-kernel", package = "eddacraft-anvil-kernel" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-graph-cache = { path = "../anvil-graph-cache", package = "eddacraft-anvil-graph-cache" }
anvil-gctx-types = { path = "../anvil-gctx-types", package = "eddacraft-anvil-gctx-types" }
serde = { workspace = true }
serde_json = { workspace = true }
petgraph = { workspace = true }
tempfile.workspace = true
rand = "0.10"
workspace-hack.workspace = true

# Unix-only: kill a spawned process *group* so the long-running children a
# benched process spawns (e.g. watch's per-save `anvil check`) don't outlive
# the bench and leak (inotify handles, CPU). Safe `killpg` wrapper.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
rayon = { workspace = true }
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
criterion = { workspace = true }
ignore = "0.4"

[[bench]]
name = "stress"
harness = false

[[bench]]
name = "antipattern_scan"
harness = false

[[bench]]
name = "secret_scan_parallel"
harness = false

[[bench]]
name = "watch_resource_budget"
harness = false

# RLB-004: MCP server CPU/RSS budget under sustained tools/call load.
[[bench]]
name = "mcp_resource_budget"
harness = false

# RLB-005: watch + intercept + MCP together, aggregate process-tree CPU/RSS.
[[bench]]
name = "concurrent_processes"
harness = false

# SCAN-005: sequential WalkBuilder vs WalkParallel for the discovery walk phase.
[[bench]]
name = "walk_discovery"
harness = false

[lints]
workspace = true
