# Nightly L5 audit (MLP-015).
#
# Re-scans `main` for commits that bypassed earlier protection layers
# (admin overrides, force-push manipulation, hook-failure recovery).
# Emits drift metrics; opens an issue when drift exceeds the configured
# threshold.
#
# Active by default per ADR-037 §D-9. Comment out the `schedule` block
# to disable.
name: anvil-audit

on:
  schedule:
    # 03:17 UTC nightly. Odd minute spreads load across the cron tier.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to audit (default main)'
        required: false
        default: 'main'
      threshold:
        description: 'Drift findings threshold for degraded mode'
        required: false
        default: '5'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Install anvil
        run: |
          curl -fsSL https://raw.githubusercontent.com/eddacraft/anvil/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run L5 audit
        id: audit
        run: |
          anvil audit-chain \
            --threshold "${{ github.event.inputs.threshold || '5' }}" \
            --json \
            > audit-report.json
          cat audit-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-audit-report
          path: audit-report.json
          retention-days: 30
