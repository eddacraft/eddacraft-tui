# Nightly L5 audit (MLP-015).
#
# Re-scans `main` for commits that bypassed earlier protection layers
# (admin overrides, force-push manipulation, hook-failure recovery).
# Emits drift metrics; exits non-zero when drift meets or exceeds the
# configured threshold so the cron run surfaces as a failed workflow
# (open-an-issue automation is a documented follow-up, not part of
# this template).
#
# Active by default per ADR-037 §D-9. Comment out the `schedule` block
# to disable.
name: anvil-audit

on:
  schedule:
    # 03:17 UTC nightly. Odd minute spreads load across the cron tier.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to audit (default main)'
        required: false
        default: 'main'
      threshold:
        description: 'Drift findings threshold for degraded mode'
        required: false
        default: '5'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      # The official install path lands with MLP-010 (the
      # `eddacraft/anvil-action` Marketplace action) — replace this
      # step with `uses: eddacraft/anvil-action@v1` once that ships.
      # Until then this is a deliberate **placeholder**: the
      # `curl … | sh` pattern is supply-chain-sensitive, so operators
      # adopting this template before MLP-010 should pin to a release
      # asset by SHA-256 or install from a vendored binary.
      - name: Install anvil (placeholder — replace with eddacraft/anvil-action@v1)
        run: |
          curl -fsSL https://raw.githubusercontent.com/eddacraft/anvil/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run L5 audit
        id: audit
        # Bind workflow_dispatch inputs via env so values never land in
        # shell source (GitHub expands ${{ }} before bash parses the script).
        env:
          AUDIT_BRANCH: ${{ github.event.inputs.branch || 'main' }}
          AUDIT_THRESHOLD: ${{ github.event.inputs.threshold || '5' }}
        run: |
          set -euo pipefail
          branch="${AUDIT_BRANCH:-main}"
          threshold="${AUDIT_THRESHOLD:-5}"

          # Allow common git ref characters only; reject shell metacharacters.
          if [[ ! "$branch" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::branch must be a simple git ref (letters, digits, . _ / -)"
            exit 1
          fi
          # 10# forces base-10 so leading zeros (e.g. 08) are not octal.
          if [[ ! "$threshold" =~ ^[0-9]+$ ]] || (( 10#$threshold > 10000 )); then
            echo "::error::threshold must be an integer from 0 to 10000"
            exit 1
          fi

          anvil audit-chain \
            --branch "$branch" \
            --threshold "$threshold" \
            --json \
            > audit-report.json
          cat audit-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-audit-report
          path: audit-report.json
          retention-days: 30
