[package]
name = "anvil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anvil CLI — structural governance for AI-assisted development"
repository = "https://github.com/EddaCraft/anvil"

[package.metadata.dist]
dist = true

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
anvil-tui = { path = "../anvil-tui" }
anvil-kernel = { path = "../anvil-kernel" }
anvil-kernel-types = { path = "../anvil-kernel-types" }
anvil-policy = { path = "../anvil-policy" }
anvil-architecture = { path = "../anvil-architecture" }
anvil-checks = { path = "../anvil-checks" }
eddacraft-tui = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
tempfile = "3"
walkdir = { workspace = true }
regex = { workspace = true }
sha2 = "0.11"
hex = "0.4"
ctrlc = "3"

[dev-dependencies]
temp-env = "0.3"
wiremock = "0.6"

[lints]
workspace = true
