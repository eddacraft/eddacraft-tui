[package]
name = "eddacraft-anvil"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil CLI — structural governance for AI-assisted development"
repository = "https://github.com/eddacraft/anvil"

[package.metadata.dist]
dist = true

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
animate = { workspace = true }
anvil-tui = { path = "../anvil-tui", package = "eddacraft-anvil-tui" }
anvil-kernel = { path = "../anvil-kernel", package = "eddacraft-anvil-kernel" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-policy = { path = "../anvil-policy", package = "eddacraft-anvil-policy" }
anvil-architecture = { path = "../anvil-architecture", package = "eddacraft-anvil-architecture" }
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
anvil-intercept = { path = "../anvil-intercept", package = "eddacraft-anvil-intercept" }
anvil-intercept-rules = { path = "../anvil-intercept-rules", package = "eddacraft-anvil-intercept-rules" }
anvil-observability = { path = "../anvil-observability", package = "eddacraft-anvil-observability" }
eddacraft-tui = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tempfile = "3"
walkdir = { workspace = true }
ignore = "0.4"
rayon = { workspace = true }
num_cpus = { workspace = true }
regex = { workspace = true }
sha2 = "0.11"
hex = "0.4"
ctrlc = "3"
tracing = { workspace = true }
axoupdater = { version = "0.10", features = ["blocking"] }
workspace-hack.workspace = true

[dev-dependencies]
temp-env = "0.3"
wiremock = "0.6"

[lints]
workspace = true
