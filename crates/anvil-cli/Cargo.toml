[package]
name = "eddacraft-anvil"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil CLI — structural governance for AI-assisted development"
repository = "https://github.com/eddacraft/anvil"

[package.metadata.dist]
dist = true

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
animate = { workspace = true }
anvil-tui = { path = "../anvil-tui", package = "eddacraft-anvil-tui" }
anvil-kernel = { path = "../anvil-kernel", package = "eddacraft-anvil-kernel" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-rayon-init = { path = "../anvil-rayon-init", package = "eddacraft-anvil-rayon-init" }
anvil-policy = { path = "../anvil-policy", package = "eddacraft-anvil-policy" }
anvil-policy-engine = { path = "../anvil-policy-engine", package = "eddacraft-anvil-policy-engine" }
anvil-architecture = { path = "../anvil-architecture", package = "eddacraft-anvil-architecture" }
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
# ADR-071 / RSTLAN-003: gate-time AST anti-pattern tier. A terminal command-path
# crate (tree-sitter + tree-sitter-rust) the resident daemon must NOT link; only
# `anvil-cli` and test crates may depend on it. The `daemon_dep_boundary` guard
# verifies the daemon's tree carries neither it nor tree-sitter.
anvil-checks-ast = { path = "../anvil-checks-ast", package = "eddacraft-anvil-checks-ast" }
anvil-intercept = { path = "../anvil-intercept", package = "eddacraft-anvil-intercept" }
anvil-intercept-proto = { path = "../anvil-intercept-proto", package = "eddacraft-anvil-intercept-proto" }
# KDS-001 / PORT-011 / ADR-064: daemon-backed Kindling observation sink. The
# networking client (hyper/tokio over a UDS) lives ONLY in this app-layer crate
# — never in `anvil-intercept` — so the resident daemon's dependency tree stays
# free of an HTTP/transport dep (the `daemon_dep_boundary` guard enforces this).
# The `spool` feature adds `SpooledClient` for durable at-least-once emit when
# the daemon is unreachable; there is no standalone `kindling-spool` crate.
kindling-client = { version = "0.2", features = ["spool"] }
# GCTX-010 / ADR-084: sealed graph-free egress DTOs for the `anvil_search_symbols`
# MCP tool. The CLI links ONLY `-types` (never `-egress`/graph-cache), so the MCP
# surface is structurally incapable of emitting a graph internal (CE-5).
anvil-gctx-types = { path = "../anvil-gctx-types", package = "eddacraft-anvil-gctx-types" }
anvil-intercept-rules = { path = "../anvil-intercept-rules", package = "eddacraft-anvil-intercept-rules" }
anvil-observability = { path = "../anvil-observability", package = "eddacraft-anvil-observability" }
anvil-witness = { path = "../anvil-witness", package = "eddacraft-anvil-witness" }
anvil-rules = { path = "../anvil-rules", package = "eddacraft-anvil-rules" }
anvil-baseline = { path = "../anvil-baseline", package = "eddacraft-anvil-baseline" }
anvil-capsule = { path = "../anvil-capsule", package = "eddacraft-anvil-capsule" }
anvil-sarif = { path = "../anvil-sarif", package = "eddacraft-anvil-sarif" }
anvil-hook = { path = "../anvil-hook", package = "eddacraft-anvil-hook" }
anvil-l4 = { path = "../anvil-l4", package = "eddacraft-anvil-l4" }
anvil-config = { path = "../anvil-config", package = "eddacraft-anvil-config" }
eddacraft-tui = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
toml = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
anyhow = { workspace = true }
miette = { workspace = true }
dirs = { workspace = true }
tempfile.workspace = true
demand = "2.0.0"
walkdir = { workspace = true }
ignore = "0.4"
rayon = { workspace = true }
num_cpus = { workspace = true }
regex = { workspace = true }
sha2 = "0.11"
hex = { workspace = true }
ctrlc = "3"
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
axoupdater = { version = "0.10", features = ["blocking"] }
minisign-verify = "0.2"
futures-util = "0.3"
workspace-hack.workspace = true

[target.'cfg(windows)'.dependencies]
anvil-intercept-win32 = { path = "../anvil-intercept-win32", package = "eddacraft-anvil-intercept-win32" }

[dev-dependencies]
# CIB-078: schema-stability snapshot pinning the `anvil policy eval` output
# contract (docs/specs/policy-eval-output-v1.md). Test-only.
insta = { workspace = true }
temp-env = "0.3"
tempfile = "3"
wiremock = "0.6"
which = "8"
# Used only for generating signed fixtures in the signature-verification
# test suite. Pulled in solely for unit/integration tests; never compiled
# into a shipped binary.
minisign = "0.9"
# SARIFOUT-002: validate emitted SARIF against the bundled upstream 2.1.0
# schema. Test-only; the emitter itself has no schema-validation dependency.
jsonschema = "0.46"
# KDS-001 / KDS-003: spin up a real in-process Kindling daemon on a temp UDS so
# the `KindlingDaemonSink` parity + spool-replay tests exercise the live wire
# contract. Test-only — the daemon (`kindling-server`) and its store
# (`kindling-store`, for the canonical schema version) are NEVER linked into the
# shipped `anvil` binary, only the thin `kindling-client`.
kindling-server = "0.2"
kindling-store = "0.2"

[lints]
workspace = true
