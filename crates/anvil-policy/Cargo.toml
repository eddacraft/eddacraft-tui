[package]
name = "eddacraft-anvil-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil policy support — git-native exceptions store, eval-regression harness, and policy config"

[lib]
name = "anvil_policy"

[dependencies]
# PATT: the attack-scenario schema (AttackScenario, SafeBehaviour, Confidence)
# is the wire vocabulary the pack runner loads and normalises. It lives in the
# dependency-light wire-types crate, already in this binary's tree, so this adds
# no new shipped crate.
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.11"
hex = "0.4"
wait-timeout = "0.2"
tempfile.workspace = true
fs2 = "0.4"
glob = "0.3"
workspace-hack.workspace = true

[lints]
workspace = true
