[package]
name = "eddacraft-anvil-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil policy support — git-native exceptions store, eval-regression harness, and policy config"

[lib]
name = "anvil_policy"

[dependencies]
# The wire-types crate (anvil-kernel-types) carries the attack-scenario schema
# (PATT) and the adversarial probe taxonomy (ATC) that the runners load; it is
# the dependency-light wire crate already in this binary's tree, no new shipped
# crate.
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.11"
hex = "0.4"
wait-timeout = "0.2"
tempfile.workspace = true
fs2 = "0.4"
glob = "0.3"
workspace-hack.workspace = true

# Per-component O_NOFOLLOW open for exception-store loads (TOCTOU-safe
# openat ladder on Unix). Non-Unix falls back to path-string guards.
# `nix` keeps the workspace forbid(unsafe_code) lint honest.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "signal"] }

[lints]
workspace = true
