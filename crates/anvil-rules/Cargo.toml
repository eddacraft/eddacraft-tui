[package]
name = "eddacraft-anvil-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil rule-set hashing and version-floor primitives — rules_sha + required_anvil_version (MLP-012)"

[lib]
name = "anvil_rules"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
sha2 = "0.11"
hex = "0.4"
semver.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
eddacraft-anvil-config = { path = "../anvil-config" }
serde_yaml = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
