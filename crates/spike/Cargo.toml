[package]
name = "anvil-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Validation spikes for tree-sitter, notify-rs, petgraph, rataflow, and the RTAI mid-edit loop"
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "spike-treesitter"
path = "src/treesitter.rs"

[[bin]]
name = "spike-notify"
path = "src/notify.rs"

[[bin]]
name = "spike-petgraph"
path = "src/petgraph.rs"

[[bin]]
name = "spike-rtai-mid-edit"
path = "src/rtai_mid_edit.rs"

[[bin]]
name = "spike-rtai-005-lsp-vs-mcp"
path = "src/rtai_005_lsp_vs_mcp.rs"

[[bin]]
name = "spike-flow"
path = "src/flow.rs"

[dependencies]
rataflow = "0.1"
ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
anvil-graph-cache = { path = "../anvil-graph-cache", package = "eddacraft-anvil-graph-cache" }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
notify = { workspace = true }
petgraph = { workspace = true }
rustix = { version = "1", features = ["param"] }
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
serde_json = { workspace = true }
workspace-hack.workspace = true

[lints]
workspace = true
