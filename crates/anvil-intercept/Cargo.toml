[package]
name = "eddacraft-anvil-intercept"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil intercept daemon — session registry, enforcement, and IPC surface"

[lib]
name = "anvil_intercept"

[[bin]]
name = "anvil-intercept"
path = "src/main.rs"

[[bench]]
name = "ipc_roundtrip"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "midedit_roundtrip"
harness = false
required-features = ["bench-internals"]

# RLB-003: spawns the real daemon and measures its process-tree CPU/RSS.
# Drives the shipped binary over its socket — no internal APIs — so it does
# not need `bench-internals`.
[[bench]]
name = "intercept_resource_budget"
harness = false

[features]
bench-internals = []

[dependencies]
anvil-attribution = { path = "../anvil-attribution", package = "eddacraft-anvil-attribution" }
anvil-config = { path = "../anvil-config", package = "eddacraft-anvil-config" }
# DSV-005 Task 8: the save-time `validate_paths` path runs the antipattern check
# over guarded bytes via `run_antipattern_check_bytes`. anvil-checks depends only
# on `anvil-kernel-types` (regex scanner) — NOT `anvil-kernel`/tree-sitter — so
# this stays inside ADR-064's no-parser-in-the-daemon boundary (the
# `daemon_dep_boundary` guard verifies).
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
# Parser-free graph state + algorithms (ADR-064). Inherits `petgraph` only —
# does NOT pull in `anvil-kernel`/tree-sitter. Backs the daemon save-time cache.
anvil-graph-cache = { path = "../anvil-graph-cache", package = "eddacraft-anvil-graph-cache" }
# GCTX-010 / ADR-084: daemon-side identity-only egress projection. `-egress` is
# daemon-only (the projector); `-types` are the sealed graph-free DTOs.
anvil-gctx-egress = { path = "../anvil-gctx-egress", package = "eddacraft-anvil-gctx-egress" }
anvil-gctx-types = { path = "../anvil-gctx-types", package = "eddacraft-anvil-gctx-types" }
anvil-intercept-proto = { path = "../anvil-intercept-proto", package = "eddacraft-anvil-intercept-proto" }
anvil-intercept-rules = { path = "../anvil-intercept-rules", package = "eddacraft-anvil-intercept-rules" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-observability = { path = "../anvil-observability", package = "eddacraft-anvil-observability" }
anvil-rules = { path = "../anvil-rules", package = "eddacraft-anvil-rules" }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
# DSV-045 (ADR-085 Decision 5): the full-scan executor pre-filters the walk
# through `.gitignore` before counting files against the walk cap, so a fresh
# session warms a graph of *source* files (not `node_modules`/`target`). `ignore`
# is the ripgrep gitignore engine, already in the shipped tree via `anvil-kernel`
# (watch.rs), so this adds no new transitive licences. The daemon still links no
# parser (ADR-064) — `ignore` is a filesystem-walk dep, not a parser.
ignore = "0.4"
# DSV-006a (ADR-061 §4): dedicated interactive + background work pools so a
# saturated background scan cannot starve `validate_paths`. rayon is already in
# the shipped tree via `anvil-checks`, so this adds no new transitive licences.
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.11"
# MLP2-071: per-startup HMAC salt for the INTD-015 cross-session
# redaction primitive (folds in v0.6.0-beta-security-note §H2). 32
# bytes from the OS RNG, kept in memory only.
getrandom = "0.4"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack.workspace = true

# Unix-only deps for the IPC socket permission ladder. `nix` keeps us on
# safe wrappers for `stat`/`fchmod`/`mkdir` so the crate-level
# `forbid(unsafe_code)` lint stays honest. Pinned to 0.30 per INTD-002
# guidance.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
  "fs",
  "hostname",
  "process",
  "signal",
  "socket",
  "user",
] }

[target.'cfg(windows)'.dependencies]
anvil-intercept-win32 = { path = "../anvil-intercept-win32", package = "eddacraft-anvil-intercept-win32" }

[dev-dependencies]
anvil-attribution = { path = "../anvil-attribution", package = "eddacraft-anvil-attribution" }
# RLB-003: reuse the shared process-tree sampler + budget evaluator + binary
# resolver. anvil-bench already pulls the kernel via anvil-checks below, so
# this adds no new heavy build; the dependency is acyclic (anvil-bench does
# not depend on anvil-intercept).
anvil-bench = { path = "../anvil-bench", package = "anvil-bench" }
anvil-intercept-proto = { path = "../anvil-intercept-proto", package = "eddacraft-anvil-intercept-proto" }
criterion = { workspace = true }
tempfile.workspace = true
tracing-subscriber = { workspace = true }

[lints]
workspace = true
