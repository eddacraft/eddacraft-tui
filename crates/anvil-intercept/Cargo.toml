[package]
name = "eddacraft-anvil-intercept"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil intercept daemon — session registry, enforcement, and IPC surface"

[lib]
name = "anvil_intercept"

[[bin]]
name = "anvil-intercept"
path = "src/main.rs"

[[bench]]
name = "ipc_roundtrip"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "midedit_roundtrip"
harness = false
required-features = ["bench-internals"]

[features]
bench-internals = []

[dependencies]
anvil-intercept-proto = { path = "../anvil-intercept-proto", package = "eddacraft-anvil-intercept-proto" }
anvil-intercept-rules = { path = "../anvil-intercept-rules", package = "eddacraft-anvil-intercept-rules" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
workspace-hack.workspace = true

# Unix-only deps for the IPC socket permission ladder. `nix` keeps us on
# safe wrappers for `stat`/`fchmod`/`mkdir` so the crate-level
# `forbid(unsafe_code)` lint stays honest. Pinned to 0.30 per INTD-002
# guidance.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
anvil-intercept-win32 = { path = "../anvil-intercept-win32", package = "eddacraft-anvil-intercept-win32" }

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[lints]
workspace = true
