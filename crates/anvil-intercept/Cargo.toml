[package]
name = "eddacraft-anvil-intercept"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil intercept daemon — session registry, enforcement, and IPC surface"

[lib]
name = "anvil_intercept"

[[bin]]
name = "anvil-intercept"
path = "src/main.rs"

[[bench]]
name = "ipc_roundtrip"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "midedit_roundtrip"
harness = false
required-features = ["bench-internals"]

# RLB-003: spawns the real daemon and measures its process-tree CPU/RSS.
# Drives the shipped binary over its socket — no internal APIs — so it does
# not need `bench-internals`.
[[bench]]
name = "intercept_resource_budget"
harness = false

[features]
bench-internals = []

[dependencies]
anvil-attribution = { path = "../anvil-attribution", package = "eddacraft-anvil-attribution" }
anvil-config = { path = "../anvil-config", package = "eddacraft-anvil-config" }
# Parser-free graph state + algorithms (ADR-064). Inherits `petgraph` only —
# does NOT pull in `anvil-kernel`/tree-sitter. Backs the daemon save-time cache.
anvil-graph-cache = { path = "../anvil-graph-cache", package = "eddacraft-anvil-graph-cache" }
anvil-intercept-proto = { path = "../anvil-intercept-proto", package = "eddacraft-anvil-intercept-proto" }
anvil-intercept-rules = { path = "../anvil-intercept-rules", package = "eddacraft-anvil-intercept-rules" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-observability = { path = "../anvil-observability", package = "eddacraft-anvil-observability" }
anvil-rules = { path = "../anvil-rules", package = "eddacraft-anvil-rules" }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.11"
# MLP2-071: per-startup HMAC salt for the INTD-015 cross-session
# redaction primitive (folds in v0.6.0-beta-security-note §H2). 32
# bytes from the OS RNG, kept in memory only.
getrandom = "0.3"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack.workspace = true

# Unix-only deps for the IPC socket permission ladder. `nix` keeps us on
# safe wrappers for `stat`/`fchmod`/`mkdir` so the crate-level
# `forbid(unsafe_code)` lint stays honest. Pinned to 0.30 per INTD-002
# guidance.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = [
  "fs",
  "hostname",
  "process",
  "signal",
  "socket",
  "user",
] }

[target.'cfg(windows)'.dependencies]
anvil-intercept-win32 = { path = "../anvil-intercept-win32", package = "eddacraft-anvil-intercept-win32" }

[dev-dependencies]
anvil-attribution = { path = "../anvil-attribution", package = "eddacraft-anvil-attribution" }
# RLB-003: reuse the shared process-tree sampler + budget evaluator + binary
# resolver. anvil-bench already pulls the kernel via anvil-checks below, so
# this adds no new heavy build; the dependency is acyclic (anvil-bench does
# not depend on anvil-intercept).
anvil-bench = { path = "../anvil-bench", package = "anvil-bench" }
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
anvil-intercept-proto = { path = "../anvil-intercept-proto", package = "eddacraft-anvil-intercept-proto" }
criterion = { workspace = true }
tempfile.workspace = true
tracing-subscriber = { workspace = true }

[lints]
workspace = true
