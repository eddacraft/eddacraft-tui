[package]
name = "eddacraft-anvil-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil Rust kernel — watcher, parser, semantic graph, policy engine"

[lib]
name = "anvil_kernel"

[dependencies]
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-graph-cache = { path = "../anvil-graph-cache", package = "eddacraft-anvil-graph-cache" }
anvil-rayon-init = { path = "../anvil-rayon-init", package = "eddacraft-anvil-rayon-init" }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-dart = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-kotlin-ng = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-zig = { workspace = true }
# Vendored WebAssembly-text grammar (LTW2-002); isolates the grammar FFI from
# this crate's `forbid(unsafe_code)`.
anvil-grammar-wat = { path = "../anvil-grammar-wat", package = "eddacraft-anvil-grammar-wat" }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
ignore = "0.4"
globset = { workspace = true }
rayon = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
criterion = { workspace = true }
tempfile.workspace = true

[[bench]]
name = "kernel"
harness = false

[lints]
workspace = true
