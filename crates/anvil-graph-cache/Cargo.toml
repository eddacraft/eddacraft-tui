[package]
name = "eddacraft-anvil-graph-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Parser-free semantic graph state and algorithms for the Anvil daemon save-time cache (ADR-064)"

[lib]
name = "anvil_graph_cache"

# GV2-025: hot-read latency gate. `harness = false` — a plain `main()` that
# measures p50/p95/p99 and exits non-zero on a p95 budget breach, mirroring the
# repo's other ADR-031 latency gate (`anvil-intercept`'s `ipc_roundtrip`), since
# Criterion's statistical harness does not yield a clean p95 pass/fail exit code.
[[bench]]
name = "hot_read"
harness = false

# GCALL-006: gates the save-time call-lift (`update_file` + `re_resolve_calls`)
# on the ADR-031 p95 budget; same `harness = false` rationale as `hot_read`.
[[bench]]
name = "call_lift"
harness = false

[dependencies]
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
petgraph = { workspace = true }
# `serde` is part of this crate's ADR-064 §2 dependency set; its first in-crate
# consumer (snapshot/`certify` serialisation) lands in a later sub-phase-A task.
# Kept here per the ADR so the boundary is fixed once; the relocated graph data
# types it serialises already derive `serde` in `anvil-kernel-types`.
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# GV2-030 sealed-DTO snapshot codec (ADR-069 §1) — stable, versioned wire format.
postcard = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
