[package]
name = "eddacraft-anvil-capsule"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "anvil review capsule v0 — anvil.capsule.v1 manifest + verification schema (ADR-074, GITGOV)"

[lib]
name = "anvil_capsule"

[dependencies]
anvil-baseline = { path = "../anvil-baseline", package = "eddacraft-anvil-baseline" }
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
anvil-config = { path = "../anvil-config", package = "eddacraft-anvil-config" }
anvil-rules = { path = "../anvil-rules", package = "eddacraft-anvil-rules" }
anvil-witness = { path = "../anvil-witness", package = "eddacraft-anvil-witness" }
anvil-sarif = { path = "../anvil-sarif", package = "eddacraft-anvil-sarif" }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
anvil-policy = { path = "../anvil-policy", package = "eddacraft-anvil-policy" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.11"
hex = "0.4"
tempfile = { workspace = true }
workspace-hack.workspace = true

# O_NOFOLLOW open for capsule evidence reads (final-component symlink
# refusal without a lstat→open TOCTOU window). Unix-only; Windows uses
# a symlink_metadata pre-check (see verify.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { workspace = true }

[lints]
workspace = true
