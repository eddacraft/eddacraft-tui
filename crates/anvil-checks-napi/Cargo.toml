[package]
name = "eddacraft-anvil-checks-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Node-API binding for the authoritative Anvil Rust scanner"

[lib]
crate-type = ["cdylib"]

[dependencies]
anvil-checks = { path = "../anvil-checks", package = "eddacraft-anvil-checks" }
# V050F-007: tiny micro-crate that owns the half-cores rayon cap policy. Used
# at the top of `scan_artifact_json` so the editor host that loads this
# binding inherits the cap before any `scan_artifact` `par_iter` runs.
# Kept as a separate crate (rather than depending on the full kernel) to keep
# the cdylib link weight minimal — council finding: kernel-maintainer.
anvil-rayon-init = { path = "../anvil-rayon-init", package = "eddacraft-anvil-rayon-init" }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }
workspace-hack.workspace = true

[build-dependencies]
napi-build = "2"

# napi-derive expands to FFI code that is intrinsically `unsafe`. The
# workspace `forbid(unsafe_code)` lint can't be relaxed by inner attributes,
# so this crate opts out of inheriting workspace lints and re-states the rest
# of the policy directly.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
