[package]
name = "eddacraft-anvil-run"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "anvil-run: wrapped-launch ingress for the Anvil Intercept Loop (INTL)"

[lib]
name = "anvil_run"
path = "src/lib.rs"

[[bin]]
name = "anvil-run"
path = "src/main.rs"

[dependencies]
anvil-intercept-proto = { package = "eddacraft-anvil-intercept-proto", path = "../anvil-intercept-proto" }
anvil-intercept = { package = "eddacraft-anvil-intercept", path = "../anvil-intercept" }
anvil-attribution = { package = "eddacraft-anvil-attribution", path = "../anvil-attribution" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "term"] }
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
anvil-intercept-win32 = { package = "eddacraft-anvil-intercept-win32", path = "../anvil-intercept-win32" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
