[package]
name = "eddacraft-anvil-baseline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil baseline store — `anvil/baseline.json` data model + I/O + move-resistant fingerprinting (MLP-007)"

[lib]
name = "anvil_baseline"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
sha2 = "0.11"
hex = "0.4"
# MLP2-013: emit `GENESIS-BASELINED` / `GENESIS-FRESH` witness lines
# alongside `anvil/baseline.json` so later L4 verifications can
# distinguish baselined vs greenfield repos at the chain level.
anvil-witness = { path = "../anvil-witness", package = "eddacraft-anvil-witness" }
workspace-hack.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
