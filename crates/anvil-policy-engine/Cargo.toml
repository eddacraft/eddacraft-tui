[package]
name = "eddacraft-anvil-policy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil policy engine — facade over regorus (ADR-040)"

[lib]
name = "anvil_policy_engine"

[dependencies]
anyhow = { workspace = true }
# `coverage` enables get_coverage_report (POLENG-006); not in regorus defaults.
regorus = { workspace = true, features = ["coverage"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "parity"
harness = false

[lints]
workspace = true
