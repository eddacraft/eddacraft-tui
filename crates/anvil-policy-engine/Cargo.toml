[package]
name = "eddacraft-anvil-policy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil policy engine — facade over regorus (ADR-040)"

[lib]
name = "anvil_policy_engine"

[dependencies]
anyhow = { workspace = true }
# POLENG-009 determinism fence: drop regorus's `full-opa` bundle and enable only
# the pure subset, removing the impure Rego stdlib builtin groups at the source
# (`time` → time.now_ns, `uuid` → uuid.rfc4122, plus `http`/`net`/`opa-runtime`)
# along with their deps (chrono, ipnet, uuid). `arc` (from the old default)
# keeps extensions `Send`+`Sync`; `coverage` backs POLENG-006. `rvm` is
# intentionally omitted: we evaluate via the tree-walking interpreter
# (`eval_query`/`eval_rule`), and the RVM compiled path does not consult
# registered extensions, so it would bypass the `rand.intn` shadow installed in
# `Engine::new`. The remaining features are pure. The one residual impure
# builtin, `rand.intn` (std-gated, not separately feature-gated), is fenced at
# runtime there. On a regorus version bump, diff `full-opa`'s contents against
# this set so a newly-added impure builtin group can't slip in.
regorus = { workspace = true, features = [
  "arc",
  "std",
  "coverage",
  "base64",
  "base64url",
  "hex",
  "cache",
  "glob",
  "graph",
  "jsonschema",
  "regex",
  "semver",
  "urlquery",
  "yaml",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# CIB-017: warn! on abnormal engine conditions (a caught panic, a poisoned
# lock). Already in the binary's dependency tree via anvil-cli, so this adds no
# new transitive crates.
tracing = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "parity"
harness = false

[lints]
workspace = true
