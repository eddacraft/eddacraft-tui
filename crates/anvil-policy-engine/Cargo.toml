[package]
name = "eddacraft-anvil-policy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil policy engine — facade over regorus (ADR-040)"

[lib]
name = "anvil_policy_engine"

[dependencies]
anyhow = { workspace = true }
# POLENG-009 determinism fence: drop regorus's `full-opa` bundle and enable only
# the pure subset, removing the impure Rego stdlib builtin groups at the source
# (`time` → time.now_ns, `uuid` → uuid.rfc4122, plus `http`/`net`/`opa-runtime`)
# along with their deps (chrono, ipnet, uuid). `arc`+`rvm` come from the old
# default; `coverage` backs POLENG-006. The remaining features are pure. The one
# residual impure builtin, `rand.intn` (std-gated, not separately feature-gated),
# is fenced at runtime in `Engine::new` — see the determinism guard there.
regorus = { workspace = true, features = [
  "arc",
  "rvm",
  "std",
  "coverage",
  "base64",
  "base64url",
  "hex",
  "cache",
  "glob",
  "graph",
  "jsonschema",
  "regex",
  "semver",
  "urlquery",
  "yaml",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "parity"
harness = false

[lints]
workspace = true
