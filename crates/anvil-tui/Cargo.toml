[package]
name = "eddacraft-anvil-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil TUI surfaces built on eddacraft-tui — watch dashboard, gate explorer, wizard"

[lib]
name = "anvil_tui"

[dependencies]
animate-core = { workspace = true }
# json-render: anvil-tui hosts the Anvil-domain catalogue, the .anvil/ data
# context, and the spec-rendering dashboard surface (ADR-054, TUIDASH).
# big-text: the JOURNEY-008 first-success celebration banner (BigBanner).
# flow: the IMPV-001 impact view's graph rendering (TUIN-014).
eddacraft-tui = { workspace = true, features = ["big-text", "json-render", "flow"] }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
# impact view (IMPV-001): decode the warm ADR-069 graph snapshot for the
# crate-level used-import graph and per-crate internals.
anvil-graph-cache = { path = "../anvil-graph-cache", package = "eddacraft-anvil-graph-cache" }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-width = "0.2"
dunce = "1"
workspace-hack.workspace = true


# O_NOFOLLOW | O_NONBLOCK open for .anvil/ data-file reads (final-component
# symlink/FIFO refusal without a lstat→open TOCTOU window). Unix-only;
# non-Unix uses a best-effort symlink_metadata pre-check (see fileio.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = { workspace = true }
eddacraft-tui = { workspace = true, features = ["test-utils"] }
temp-env = "0.3"
tempfile.workspace = true

[[example]]
name = "demo"

[lints]
workspace = true
