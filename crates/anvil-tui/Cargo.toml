[package]
name = "eddacraft-anvil-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil TUI surfaces built on eddacraft-tui — watch dashboard, gate explorer, wizard"

[lib]
name = "anvil_tui"

[dependencies]
animate = { workspace = true }
# json-render: anvil-tui hosts the Anvil-domain catalogue, the .anvil/ data
# context, and the spec-rendering dashboard surface (ADR-054, TUIDASH).
eddacraft-tui = { workspace = true, features = ["json-render", "big-text"] }
anvil-kernel-types = { path = "../anvil-kernel-types", package = "eddacraft-anvil-kernel-types" }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-width = "0.2"
workspace-hack.workspace = true

[dev-dependencies]
insta = { workspace = true }
eddacraft-tui = { workspace = true, features = ["test-utils", "big-text"] }
temp-env = "0.3"
tempfile.workspace = true

[[example]]
name = "demo"

[lints]
workspace = true
