[package]
name = "eddacraft-anvil-grammar-wat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Vendored WebAssembly-text (.wat/.wast) tree-sitter grammar (LTW2-002, ADR-093) — no published upstream crate; isolates the grammar FFI from the forbid-unsafe kernel."

[lib]
name = "anvil_grammar_wat"

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-language = { workspace = true }
workspace-hack.workspace = true

[build-dependencies]
cc = { workspace = true }

# This crate's whole purpose is to host the vendored grammar's FFI binding,
# which is intrinsically `unsafe`. The workspace `forbid(unsafe_code)` lint
# can't be relaxed by inner attributes, so it opts out of inheriting workspace
# lints and re-states the rest of the policy directly (mirrors anvil-checks-napi).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
