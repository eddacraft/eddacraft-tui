[package]
name = "eddacraft-anvil-intercept-win32"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Windows-only Win32 helpers for the Anvil intercept daemon"

[lib]
name = "anvil_intercept_win32"

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Pinned to an exact patch (`=`) on purpose: windows-sys republishes new
# patch versions on its latest (0.61) line frequently, and each republish
# re-resolves the lock and churns the generated `workspace-hack` manifest,
# turning `Hakari verify` red on main for unrelated PRs. This is the only
# first-party direct dep on the volatile 0.61 line, so pinning it here
# freezes that line until we deliberately bump it. (The 0.52/0.60 lines are
# dormant older releases pulled only by third-party transitive deps.)
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # DSV-010 / ADR-068: the NtCreateFile read-safety guard.
  "Wdk_Storage_FileSystem",
  "Wdk_Foundation",
  "Win32_System_IO",
  "Win32_System_Kernel",
  # DSV-010b / ADR-070 step 4: peer-SID validation of a connected named-pipe
  # client (GetNamedPipeClientProcessId).
  "Win32_System_Pipes",
] }
