[package]
name = "eddacraft-anvil-witness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil witness chain primitive — in-tree hash-chained ndjson with flock-serialised append and rollover (MLP-002)"

[lib]
name = "anvil_witness"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
sha2 = "0.11"
hex = "0.4"
fs2 = "0.4"
workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true

# CIB-125: cross-process `append_chained` linearisation. Custom harness (no
# libtest) because the test binary re-execs ITSELF as N worker processes — the
# parent/worker split is decided from the environment in `fn main`.
[[test]]
name = "cross_process_linearisation"
harness = false

[lints]
workspace = true
