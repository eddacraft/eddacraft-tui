[package]
name = "eddacraft-anvil-witness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Anvil witness chain primitive — in-tree hash-chained ndjson with flock-serialised append and rollover (MLP-002)"

[lib]
name = "anvil_witness"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
