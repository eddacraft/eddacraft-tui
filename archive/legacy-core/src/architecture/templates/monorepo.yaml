# Monorepo Architecture Template
# Multi-package workspace with shared libraries

name: monorepo
description: Multi-package workspace structure with shared libraries and clear package boundaries

layers:
  packages:
    patterns:
      - apps/**
      - packages/**
      - libs/**
      - utils/**
    depends_on:
      - shared
    description: Application and library packages

  shared:
    patterns:
      - shared/**
    depends_on: []
    description: Shared utilities, types, and configurations
