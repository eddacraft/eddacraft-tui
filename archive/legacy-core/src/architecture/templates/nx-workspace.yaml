# Nx Workspace Architecture Template
# Nx monorepo with libs/apps structure

name: nx-workspace
description: Nx monorepo structure with apps, feature libs, and shared libs following Nx conventions

layers:
  apps:
    patterns:
      - apps/**
    depends_on:
      - feature-libs
      - shared-libs
    description: Deployable applications

  feature-libs:
    patterns:
      - libs/feature-*/**
      - libs/*/feature-*/**
    depends_on:
      - data-access-libs
      - ui-libs
      - shared-libs
    description: Feature libraries containing smart components

  data-access-libs:
    patterns:
      - libs/data-access-*/**
      - libs/*/data-access-*/**
    depends_on:
      - shared-libs
    description: Data access libraries for API and state

  ui-libs:
    patterns:
      - libs/ui-*/**
      - libs/*/ui-*/**
    depends_on:
      - shared-libs
    description: Presentational UI component libraries

  shared-libs:
    patterns:
      - libs/shared/**
      - libs/util-*/**
      - libs/*/util-*/**
    depends_on: []
    description: Shared utilities, types, and configurations
