# Serverless Architecture Template
# Functions-as-a-Service architecture

name: serverless
description:
  Functions-as-a-Service architecture for AWS Lambda, Azure Functions, or similar platforms

layers:
  functions:
    patterns:
      - src/functions/**
      - src/handlers/**
      - src/lambdas/**
    depends_on:
      - services
      - shared
    description: Serverless function handlers

  services:
    patterns:
      - src/services/**
      - src/business/**
    depends_on:
      - shared
    description: Business logic shared across functions

  shared:
    patterns:
      - src/shared/**
      - src/utils/**
      - src/lib/**
    depends_on: []
    description: Shared utilities, types, and configurations
