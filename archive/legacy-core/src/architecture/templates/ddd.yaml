# DDD Architecture Template
# Domain-Driven Design with bounded contexts

name: ddd
description: Domain-Driven Design - organise code around business domains and bounded contexts

layers:
  domain:
    patterns:
      - src/domain/**
    depends_on: []
    description: Domain model and business logic

  application:
    patterns:
      - src/application/**
    depends_on:
      - domain
    description: Application services and use cases

  infrastructure:
    patterns:
      - src/infrastructure/**
    depends_on:
      - domain
      - application
    description: Infrastructure implementations

  interfaces:
    patterns:
      - src/interfaces/**
      - src/api/**
    depends_on:
      - application
      - domain
    description: User interfaces and API endpoints
