# Monorepo Architecture Template
# Multi-package workspace with shared libraries

name: monorepo
description: Multi-package workspace structure with shared libraries and clear package boundaries

layers:
  apps:
    patterns:
      - apps/**
      - packages/app-*/**
    depends_on:
      - packages
      - shared
    description: Application packages (web, mobile, cli)

  packages:
    patterns:
      - packages/**
      - libs/**
    depends_on:
      - shared
    description: Reusable library packages

  shared:
    patterns:
      - shared/**
      - packages/shared/**
      - packages/common/**
    depends_on: []
    description: Shared utilities, types, and configurations
