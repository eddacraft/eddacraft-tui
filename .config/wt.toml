# Copy node_modules cache from nearest worktree first to eliminate cold starts
[[post-start]]
copy = "wt step copy-ignored"

# Reconcile dependencies. DEVENV-006 (ADR-057): the `copy` step above seeds this
# worktree's node_modules wholesale from a sibling, which can be internally
# inconsistent (some per-consumer workspace symlinks present, others missing).
# A plain `pnpm install` trusts the copied `node_modules/.modules.yaml` and does
# a partial pass that does NOT re-link the missing workspace symlinks — e.g.
# apps/anvil-api ends up without `@eddacraft/anvil-observability`, so the first
# `pnpm typecheck` fails on untouched files (it took a second install to fix).
# Removing `.modules.yaml` makes pnpm distrust the copied layout and fully
# relink every importer from the (warm, hardlinked) global store in one pass —
# a few seconds, no re-fetch.
[[post-start]]
install = "rm -f node_modules/.modules.yaml; pnpm install"

# Build Rust crates. DEVENV-002 (ADR-057): relocate the target/ off the full
# Projects mount onto /home before building, per-worktree (lock-free). Mirrors
# .envrc for agents that drive `wt` without a direnv-hooked shell.
# DEVENV-006: stderr is no longer sent to /dev/null and the build no longer
# `|| true`-swallows failures — a broken bootstrap now prints a loud warning
# instead of vanishing. Still non-fatal so a transient break doesn't lock you
# out of the worktree you need in order to fix it.
[[post-start]]
rust = "export CARGO_TARGET_DIR=\"${HOME}/.cache/anvil-targets/$(basename \"$PWD\")\"; mkdir -p \"$CARGO_TARGET_DIR\"; cargo build --workspace || echo 'WARNING (DEVENV-006): rust post-start build failed — see output above. The worktree is usable; fix the build before relying on it.'"

# Kill dev server for this worktree on remove
[pre-remove]
server = "lsof -ti :{{ branch | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"

# DEVENV-002 (ADR-057): loud, non-blocking guard — warn if cargo builds in this
# worktree are NOT relocated (CARGO_TARGET_DIR unset means they hit the full
# Projects mount). `direnv allow` or the wt rust post-start set it.
[[pre-commit]]
target-reloc = "test -n \"${CARGO_TARGET_DIR:-}\" || echo 'WARNING (DEVENV-002): CARGO_TARGET_DIR is unset — cargo builds write to the in-tree target/ on the full Projects mount. Run: direnv allow'"

# DEVENV-007 (ADR-057): change-scoped validation that shares CI's classifier
# (scripts/ci/classify-changes.sh) rather than always running the full-workspace
# format/lint/typecheck. The blunt prior hook ran all three even on a docs-only
# or rust-only commit; this selects the surfaces CI requires for the staged diff,
# so a docs commit skips typecheck and a TS-source commit also runs unit + E2E,
# closing the local↔CI parity gap. With no staged changes it is a no-op. Use
# `git commit --no-verify` to bypass when iterating.
[[pre-commit]]
validate = "bash scripts/validate/local.sh --staged"

# Full suite before merge
[[pre-merge]]
test = "pnpm run test"
build = "pnpm run build"

# Show dev URL in wt list
[list]
url = "http://localhost:{{ branch | hash_port }}"
