# cargo-nextest config for the Anvil workspace.
#
# We set `success-output = "immediate"` so that stderr from passing tests
# (e.g. `[SKIP] <name>: <reason>` lines from suites that self-skip when an
# external binary is absent) is surfaced in CI logs. Without this, nextest's
# default swallows those lines on every green run and a contributor shipping
# a regression that only such a suite would catch gets a silent green.
# Originally motivated by the OPA real-binary suite (deleted under ADR-098
# AD-1); kept so any future self-skipping suite stays visible.
#
# https://nexte.st/book/configuration.html
[profile.default]
success-output = "immediate"

# (Removed.) The watch cancellation test previously needed a
# single-thread group pin because it polled for a worker thread to
# park a `/bin/sleep` child; under contended CI it could starve past
# even a 30 s bound. The test was rewritten to assert
# `WaitOutcome::to_send_args` directly — a pure function with no
# child processes, no worker thread, and no timing dependency. No
# serialisation needed. See the test's doc comment in
# `crates/anvil-cli/src/commands/watch.rs`.

# GH #3182: eval harness subprocess tests (shell heredocs, large drains)
# flake under contended CI runners. Two fixed retries absorb transient
# spawn/drain failures without weakening the assertion on green runs.
[[profile.default.overrides]]
filter = 'package(eddacraft-anvil-policy) & (test(eval_harness_adapter_subprocess) | test(eval_harness_exit_code_classification))'
retries = { backoff = "fixed", count = 2, delay = "500ms" }

# CI-cost 2026-09 (PR #4325): `Rust Tests` now runs this same nextest gate on
# PRs, not just on push, so PRs inherit main's flake rate. This LSP test is a
# timing race between the didChange cancellation and the version-1
# publication (asserts the first publication after didChange is version 2;
# under load it observes 1) and was the failure behind four of the five most
# recent red push runs on main (33466859720, 33470597614, 33597011237,
# 33600292025). Two retries absorb it the same way GH #3182 does above; the
# race itself is still owed a fix in `crates/anvil-cli/tests/lsp_diagnostics.rs`.
# `no_daemon_makes_zero_rpc_calls_to_a_live_daemon_endpoint` failed the fifth
# run once and is not retried here — one observation is not a pattern yet.
[[profile.default.overrides]]
filter = 'package(eddacraft-anvil) & test(changing_a_document_cancels_the_active_daemon_exchange)'
retries = { backoff = "fixed", count = 2, delay = "500ms" }

# 2026-09-10 PR #4585: under full nextest contention, four concurrent ensures
# across disjoint XDG_RUNTIME_DIR values can spend the entire 2s
# LOCK_ACQUIRE_TIMEOUT waiting on the state-home rendezvous while the winner
# is still spawning. Locally the suite is stable (~1.3s); CI observed
# `timed out after 2000ms waiting for the daemon-start lock` once on this
# branch after earlier greens. Two retries match the GH #3182 / LSP pattern.
[[profile.default.overrides]]
filter = 'package(eddacraft-anvil) & test(concurrent_ensures_from_disjoint_runtime_dirs_start_exactly_one_daemon)'
retries = { backoff = "fixed", count = 2, delay = "1s" }
