# cargo-nextest config for the Anvil workspace.
#
# We set `success-output = "immediate"` so that stderr from passing tests
# (including `[SKIP] <name>: <reason>` lines emitted by
# crates/anvil-policy/tests/opa_real_binary.rs when OPA is absent) is
# surfaced in CI logs. Without this, nextest's default swallows those lines
# on every green run and a contributor shipping a regression that only the
# real-binary suite would catch gets a silent green.
#
# https://nexte.st/book/configuration.html
[profile.default]
success-output = "immediate"

# Serialise the watch cancellation test. It uses real /bin/sleep child
# processes and a 30 s polling barrier waiting for the worker thread to
# park; under nextest's default parallel execution it contends with
# thousands of other tests for CPU and the worker can starve past the
# bound. Pinning to one thread gives it a predictable runner without
# widening the timeout further.
[test-groups]
serial-watch-cancellation = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(anvil) and test(=commands::watch::tests::cancellation_emits_cancelled_error_detail_not_spawn_failed)'
test-group = 'serial-watch-cancellation'
