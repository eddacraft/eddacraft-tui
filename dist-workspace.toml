[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap repo for formula auto-publish on release
tap = "eddacraft/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
# install-updater is disabled globally so that aarch64-pc-windows-msvc can be
# included — axoupdater has no prebuilt ARM64 Windows binary and breaks the
# release build. Self-update will be restored when upstream publishes one.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# PR dry-run mode (plan only, no builds)
pr-run-mode = "plan"
# Allow manual edits to generated CI (path filters, permissions)
allow-dirty = ["ci"]
