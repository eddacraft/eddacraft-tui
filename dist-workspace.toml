[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap repo for formula auto-publish on release
tap = "eddacraft/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
# Note: aarch64-pc-windows-msvc is intentionally omitted — axoupdater has no
# prebuilt binary for it, and `install-updater = true` fails the release build
# on that target. Re-add once upstream publishes ARM64 Windows binaries.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = true
# PR dry-run mode (plan only, no builds)
pr-run-mode = "plan"
# Allow manual edits to generated CI (path filters, permissions)
allow-dirty = ["ci"]
