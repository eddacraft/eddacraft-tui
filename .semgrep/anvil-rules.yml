rules:
  # ──────────────────────────────────────────────────────────────────
  # anvil.shell-injection-risk
  # Flag execSync with string commands — prefer execFileSync with
  # array args to avoid shell injection.
  # Found in: adversarial review L4 (doctor checks), runtime H6
  # ──────────────────────────────────────────────────────────────────
  - id: anvil.shell-injection-risk
    patterns:
      - pattern: execSync($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          pattern: |
            "..."
    message: >
      execSync called with a string command is vulnerable to shell injection.
      Use execFileSync(command, args, { shell: false }) instead.
      See: REVIEW.md CLI L4, Runtime H6.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      cwe:
        - "CWE-78: OS Command Injection"
      owasp:
        - A03:2021 Injection
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
      confidence: HIGH

  # ──────────────────────────────────────────────────────────────────
  # anvil.spawn-shell-risk
  # Flag spawn/exec calls that don't explicitly set shell: false.
  # Positive pattern found in review: runtime uses shell: false
  # correctly — this rule catches places that don't.
  # ──────────────────────────────────────────────────────────────────
  - id: anvil.spawn-shell-risk
    patterns:
      - pattern-either:
          - pattern: spawn($CMD, $ARGS, { ..., shell: true, ... })
          - pattern: execFile($CMD, $ARGS, { ..., shell: true, ... })
    message: >
      Subprocess spawned with shell: true. This enables shell interpretation
      of arguments and risks command injection. Use shell: false (the default)
      and pass arguments as an array.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      cwe:
        - "CWE-78: OS Command Injection"
      owasp:
        - A03:2021 Injection
      confidence: HIGH

  # ──────────────────────────────────────────────────────────────────
  # anvil.path-traversal-join
  # Flag path.join where the first non-base argument comes from a
  # function parameter without prior validation. Heuristic — may need
  # tuning to reduce false positives.
  # Found in: MCP C1, Runtime H2, Policy H1, APS H1, Platform H1
  # ──────────────────────────────────────────────────────────────────
  - id: anvil.path-traversal-join
    patterns:
      - pattern: path.join($BASE, $USER_INPUT, ...)
      - metavariable-pattern:
          metavariable: $USER_INPUT
          patterns:
            - pattern-not: "..."
            - pattern-not: __dirname
            - pattern-not: __filename
    message: >
      path.join with a potentially user-controlled segment. Validate that the
      resolved path stays within the expected base directory to prevent path
      traversal. Use: const resolved = path.resolve(base, input); if
      (!resolved.startsWith(base)) throw new Error('Path traversal');
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      cwe:
        - "CWE-22: Path Traversal"
      owasp:
        - A01:2021 Broken Access Control
      confidence: LOW

  # ──────────────────────────────────────────────────────────────────
  # anvil.loose-schema-typing
  # Flag z.unknown() in contract schemas — these disable type
  # checking and can allow prototype pollution via __proto__ keys.
  # Found in: Contracts M1, M2
  # ──────────────────────────────────────────────────────────────────
  - id: anvil.loose-schema-typing
    pattern: z.unknown()
    paths:
      include:
        - packages/anvil/contracts/**
        - packages/**/schemas/**
    message: >
      z.unknown() disables type checking for this field. Consider using a
      more specific Zod type, or at minimum z.record(z.string(), z.any())
      with key validation to prevent prototype pollution via __proto__.
      See: Contracts M1, M2 in REVIEW.md.
    languages: [typescript, javascript]
    severity: INFO
    metadata:
      category: security
      cwe:
        - "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"
      confidence: MEDIUM

  # ──────────────────────────────────────────────────────────────────
  # anvil.hardcoded-secret-pattern
  # Flag hardcoded strings that look like API keys or tokens assigned
  # to variables with suspicious names.
  # Supplements Anvil's built-in secret detection and TruffleHog.
  # ──────────────────────────────────────────────────────────────────
  - id: anvil.hardcoded-secret-pattern
    patterns:
      - pattern-either:
          - pattern: |
              const $VAR = "...";
          - pattern: |
              let $VAR = "...";
          - pattern: |
              var $VAR = "...";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(api_?key|secret|password|token|auth|credential|private_?key)
    message: >
      Potential hardcoded secret in variable '$VAR'. Use environment variables
      or a secret manager instead.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - A07:2021 Identification and Authentication Failures
      confidence: MEDIUM
