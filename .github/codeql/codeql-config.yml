name: CodeQL config

# Files excluded from CodeQL analysis. Scope is the scanner itself — the
# workflow-level `paths-ignore` in .github/workflows/codeql.yml only gates
# when the workflow *runs*, so source directories we never want scanned
# (archived/legacy code, generated output) must be listed here.
paths-ignore:
  - archive/**
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
