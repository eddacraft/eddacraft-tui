# Auto-label PRs by path — used by .github/workflows/labeler.yml

'area:cli':
  - changed-files:
      - any-glob-to-any-file: 'crates/anvil-cli/**'

'area:core':
  - changed-files:
      - any-glob-to-any-file: 'packages/anvil/core/**'

'area:runtime':
  - changed-files:
      - any-glob-to-any-file: 'packages/anvil/runtime/**'

'area:contracts':
  - changed-files:
      - any-glob-to-any-file: 'packages/anvil/contracts/**'

'area:mcp':
  - changed-files:
      - any-glob-to-any-file: 'packages/mcp-server/**'

'area:website':
  - changed-files:
      - any-glob-to-any-file: 'apps/website/**'

'area:docs-site':
  - changed-files:
      - any-glob-to-any-file: 'apps/docs-site/**'

'area:api':
  - changed-files:
      - any-glob-to-any-file: 'apps/anvil-api/**'

'area:edda-stack':
  - changed-files:
      - any-glob-to-any-file: 'packages/edda-stack/**'

'area:adapters':
  - changed-files:
      - any-glob-to-any-file: 'packages/adapters/**'

'area:policy':
  - changed-files:
      - any-glob-to-any-file: 'packages/anvil/policy/**'

'ci':
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'

'docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
          - '!.github/**'

'plans':
  - changed-files:
      - any-glob-to-any-file: 'plans/**'

'infra':
  - changed-files:
      - any-glob-to-any-file:
          - 'infra/**'
          - 'apps/anvil-api/vercel.json'

'config':
  - changed-files:
      - any-glob-to-any-file:
          - '.claude/**'
          - 'nx.json'
          - 'tsconfig*.json'
          - '.eslintrc*'
          - '.lintstagedrc*'
