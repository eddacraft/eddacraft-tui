version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    # pnpm 11 (pinned via packageManager) enforces a default 24h
    # minimumReleaseAge supply-chain check — `pnpm install
    # --frozen-lockfile` refuses any lockfile entry published within
    # the last 24h. Without a cooldown, Dependabot proposes bumps
    # within hours of publish, so every CI job that installs deps
    # fails at that one step on open (see PR #3071). 2 days gives
    # margin over pnpm's 24h window for CI run lag and multi-package
    # groups spanning several publish times.
    cooldown:
      default-days: 2
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore(dev)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    labels:
      - 'github-actions'

  # SEC-001: automate Rust dependency updates the same way npm and actions are.
  # Advisory *gating* already ships via cargo-deny (deny.toml `[advisories]`);
  # this closes the *update* gap. See docs/guides/dependency-audit-posture.md.
  - package-ecosystem: 'cargo'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'rust'
    open-pull-requests-limit: 10
