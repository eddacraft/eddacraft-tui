name: Setup Workspace
description: Checkout, install pnpm + Node.js + deps, optionally Azure login + Nx SHAs

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  azure-login:
    description: 'Enable Azure login for Nx remote cache'
    required: false
    default: 'false'
  azure-credentials:
    description: 'Azure credentials JSON for Nx remote cache (only used when azure-login is true)'
    required: false
    default: ''
  nx-shas:
    description: 'Run nrwl/nx-set-shas for affected commands'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Azure login enables Nx remote cache (Azure Blob Storage).
    # continue-on-error: fork PRs don't have secrets, so login fails
    # silently and Nx falls back to local cache. This is intentional.
    - name: Azure Login
      if: inputs.azure-login == 'true' && inputs.azure-credentials != ''
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
      continue-on-error: true
      with:
        creds: ${{ inputs.azure-credentials }}

    - name: Set Nx SHAs
      if: inputs.nx-shas == 'true'
      uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
