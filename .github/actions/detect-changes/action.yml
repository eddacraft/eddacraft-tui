name: Detect Changes
description: Classify changed files to skip unnecessary CI jobs

outputs:
  docs-only:
    description: 'true if only docs/plans/metadata changed'
    value: ${{ steps.filter.outputs.docs-only }}
  code-changed:
    description: 'true if any non-docs file changed'
    value: ${{ steps.filter.outputs.code-changed }}
  source-changed:
    description: 'true if apps/ or packages/ source changed'
    value: ${{ steps.filter.outputs.source-changed }}
  e2e-changed:
    description: 'true if e2e test files changed'
    value: ${{ steps.filter.outputs.e2e-changed }}
  rust-changed:
    description: 'true if Rust crates or toolchain changed'
    value: ${{ steps.filter.outputs.rust-changed }}
  required-checks:
    description: 'JSON array of required checks from the shared classifier'
    value: ${{ steps.filter.outputs.required-checks }}
  markdownlint-required:
    description: 'true if markdown lint is required'
    value: ${{ steps.filter.outputs.markdownlint-required }}
  format-required:
    description: 'true if formatting checks are required'
    value: ${{ steps.filter.outputs.format-required }}
  lint-required:
    description: 'true if lint checks are required'
    value: ${{ steps.filter.outputs.lint-required }}
  typecheck-required:
    description: 'true if type checking is required'
    value: ${{ steps.filter.outputs.typecheck-required }}
  unit-tests-required:
    description: 'true if unit tests are required'
    value: ${{ steps.filter.outputs.unit-tests-required }}
  workflow-lint-required:
    description: 'true if workflow metadata checks are required'
    value: ${{ steps.filter.outputs.workflow-lint-required }}
  shell-syntax-required:
    description: 'true if shell syntax checks are required'
    value: ${{ steps.filter.outputs.shell-syntax-required }}
  script-fixtures-required:
    description: 'true if CI script fixture tests are required'
    value: ${{ steps.filter.outputs.script-fixtures-required }}
  dependency-audit-required:
    description: 'true if dependency audit is required'
    value: ${{ steps.filter.outputs.dependency-audit-required }}
  opa-required:
    description: 'true if OPA policy tests are required'
    value: ${{ steps.filter.outputs.opa-required }}
  regal-required:
    description: 'true if Regal policy lint is required'
    value: ${{ steps.filter.outputs.regal-required }}
  release-dry-run-required:
    description: 'true if release dry-run validation is required'
    value: ${{ steps.filter.outputs.release-dry-run-required }}
  infra-static-check-required:
    description: 'true if infrastructure static validation is required'
    value: ${{ steps.filter.outputs.infra-static-check-required }}
  platform-smoke-required:
    description: 'true if platform smoke validation is required'
    value: ${{ steps.filter.outputs.platform-smoke-required }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: filter
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" == "pull_request" ]; then
          BASE_SHA="$PR_BASE_SHA"
          HEAD_SHA="$PR_HEAD_SHA"
        else
          BASE_SHA="$PUSH_BEFORE"
          HEAD_SHA="$PUSH_SHA"
        fi

        diff_failed=false
        if ! CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
          diff_failed=true
        fi
        if [ "$diff_failed" = true ] || [ -z "$CHANGED_FILES" ]; then
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "::warning::git diff failed (shallow clone?) — falling back to GitHub API. Results may be incomplete."
            CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || echo "")
            if [ -z "$CHANGED_FILES" ]; then
              echo "::warning::PR fallback returned no changed files — treating all outputs as changed."
              echo "docs-only=false" >> "$GITHUB_OUTPUT"
              echo "code-changed=true" >> "$GITHUB_OUTPUT"
              echo "source-changed=true" >> "$GITHUB_OUTPUT"
              echo "e2e-changed=true" >> "$GITHUB_OUTPUT"
              echo "rust-changed=true" >> "$GITHUB_OUTPUT"
              echo 'required-checks=["markdownlint","format","lint","typecheck","unit-tests","workflow-lint","shell-syntax","script-fixtures","dependency-audit","opa-test","regal","infra-static-check","release-dry-run","platform-smoke","cargo-fmt","cargo-clippy","cargo-check","cargo-test"]' >> "$GITHUB_OUTPUT"
              echo "markdownlint-required=true" >> "$GITHUB_OUTPUT"
              echo "format-required=true" >> "$GITHUB_OUTPUT"
              echo "lint-required=true" >> "$GITHUB_OUTPUT"
              echo "typecheck-required=true" >> "$GITHUB_OUTPUT"
              echo "unit-tests-required=true" >> "$GITHUB_OUTPUT"
              echo "workflow-lint-required=true" >> "$GITHUB_OUTPUT"
              echo "shell-syntax-required=true" >> "$GITHUB_OUTPUT"
              echo "script-fixtures-required=true" >> "$GITHUB_OUTPUT"
              echo "dependency-audit-required=true" >> "$GITHUB_OUTPUT"
              echo "opa-required=true" >> "$GITHUB_OUTPUT"
              echo "regal-required=true" >> "$GITHUB_OUTPUT"
              echo "release-dry-run-required=true" >> "$GITHUB_OUTPUT"
              echo "infra-static-check-required=true" >> "$GITHUB_OUTPUT"
              echo "platform-smoke-required=true" >> "$GITHUB_OUTPUT"
              echo "Change detection: PR fallback empty — all flags and fast PR checks set to true"
              exit 0
            fi
          else
            # No API fallback for push events — assume everything changed
            # so no jobs are incorrectly skipped.
            echo "::warning::git diff failed on push (force-push or missing before SHA?) — treating all outputs as changed."
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            echo "source-changed=true" >> "$GITHUB_OUTPUT"
            echo "e2e-changed=true" >> "$GITHUB_OUTPUT"
            echo "rust-changed=true" >> "$GITHUB_OUTPUT"
            echo 'required-checks=["markdownlint","format","lint","typecheck","unit-tests","workflow-lint","shell-syntax","script-fixtures","dependency-audit","opa-test","regal","infra-static-check","release-dry-run","platform-smoke","cargo-fmt","cargo-clippy","cargo-check","cargo-test"]' >> "$GITHUB_OUTPUT"
            echo "markdownlint-required=true" >> "$GITHUB_OUTPUT"
            echo "format-required=true" >> "$GITHUB_OUTPUT"
            echo "lint-required=true" >> "$GITHUB_OUTPUT"
            echo "typecheck-required=true" >> "$GITHUB_OUTPUT"
            echo "unit-tests-required=true" >> "$GITHUB_OUTPUT"
            echo "workflow-lint-required=true" >> "$GITHUB_OUTPUT"
            echo "shell-syntax-required=true" >> "$GITHUB_OUTPUT"
            echo "script-fixtures-required=true" >> "$GITHUB_OUTPUT"
            echo "dependency-audit-required=true" >> "$GITHUB_OUTPUT"
            echo "opa-required=true" >> "$GITHUB_OUTPUT"
            echo "regal-required=true" >> "$GITHUB_OUTPUT"
            echo "release-dry-run-required=true" >> "$GITHUB_OUTPUT"
            echo "infra-static-check-required=true" >> "$GITHUB_OUTPUT"
            echo "platform-smoke-required=true" >> "$GITHUB_OUTPUT"
            echo "Change detection: push fallback — all flags and fast PR checks set to true"
            exit 0
          fi
        fi

        E2E_CHANGED=false

        # DEVENV-007: harness-internal edits are a cheap, classifier-independent
        # signal kept here as a belt-and-suspenders trigger. The TS-source case
        # (the real gap — a PR gated only on apps/e2e edits skipped E2E for a TS
        # source break and landed it on the integration branch) is driven by the
        # shared classifier's `e2e` required check below, so CI and local agree.
        while IFS= read -r file; do
          if [[ -n "$file" ]]; then
            # E2E patterns
            if [[ "$file" =~ ^apps/e2e/ ]] || \
               [[ "$file" == "playwright.config.ts" ]]; then
              E2E_CHANGED=true
            fi
          fi
        done <<< "$CHANGED_FILES"

        paths_file=$(mktemp)
        cleanup() {
          rm -f "${paths_file}"
        }
        trap cleanup EXIT
        printf '%s\n' "$CHANGED_FILES" >"${paths_file}"

        CLASSIFIER_CONTEXT=branch
        if [ "$EVENT_NAME" == "pull_request" ]; then
          CLASSIFIER_CONTEXT=pr
        elif [ "$EVENT_NAME" == "push" ]; then
          CLASSIFIER_CONTEXT=push
        fi

        classification=$(bash scripts/ci/classify-changes.sh --context "${CLASSIFIER_CONTEXT}" --paths-file "${paths_file}")

        has_check() {
          jq -e --arg check "$1" '.requiredChecks | index($check)' >/dev/null <<<"${classification}"
        }

        has_class() {
          jq -e --arg class "$1" '.pathClasses | index($class)' >/dev/null <<<"${classification}"
        }

        DOCS_ONLY=false
        CODE_CHANGED=true
        SOURCE_CHANGED=false
        RUST_CHANGED=false
        MARKDOWNLINT_REQUIRED=false
        FORMAT_REQUIRED=false
        LINT_REQUIRED=false
        TYPECHECK_REQUIRED=false
        UNIT_TESTS_REQUIRED=false
        WORKFLOW_LINT_REQUIRED=false
        SHELL_SYNTAX_REQUIRED=false
        SCRIPT_FIXTURES_REQUIRED=false
        DEPENDENCY_AUDIT_REQUIRED=false
        OPA_REQUIRED=false
        REGAL_REQUIRED=false
        RELEASE_DRY_RUN_REQUIRED=false
        INFRA_STATIC_CHECK_REQUIRED=false
        PLATFORM_SMOKE_REQUIRED=false

        if jq -e '.warnings | index("no-changed-paths")' >/dev/null <<<"${classification}"; then
          CODE_CHANGED=false
        fi
        if jq -e '.riskClasses | index("docs-only")' >/dev/null <<<"${classification}"; then
          DOCS_ONLY=true
          CODE_CHANGED=false
        fi
        if has_class rust; then
          RUST_CHANGED=true
        fi
        # DEVENV-007: the shared classifier marks TS source (and the harness
        # itself) as E2E-impacting. Honour it so a TS-source PR runs the E2E
        # harness instead of deferring the break to the integration push.
        if has_check e2e; then
          E2E_CHANGED=true
        fi
        if has_check markdownlint; then
          MARKDOWNLINT_REQUIRED=true
        fi
        if has_check format; then
          FORMAT_REQUIRED=true
        fi
        if has_check lint; then
          LINT_REQUIRED=true
        fi
        if has_check typecheck; then
          TYPECHECK_REQUIRED=true
        fi
        if has_check unit-tests || has_check platform-smoke; then
          UNIT_TESTS_REQUIRED=true
        fi
        if has_check workflow-lint; then
          WORKFLOW_LINT_REQUIRED=true
        fi
        if has_check shell-syntax; then
          SHELL_SYNTAX_REQUIRED=true
        fi
        if has_check script-fixtures; then
          SCRIPT_FIXTURES_REQUIRED=true
        fi
        if has_check dependency-audit; then
          DEPENDENCY_AUDIT_REQUIRED=true
          FORMAT_REQUIRED=true
          LINT_REQUIRED=true
          TYPECHECK_REQUIRED=true
          UNIT_TESTS_REQUIRED=true
        fi
        if has_check opa-test; then
          OPA_REQUIRED=true
        fi
        if has_check regal; then
          REGAL_REQUIRED=true
        fi
        if has_check release-dry-run; then
          RELEASE_DRY_RUN_REQUIRED=true
        fi
        if has_check infra-static-check; then
          INFRA_STATIC_CHECK_REQUIRED=true
        fi
        if has_check platform-smoke; then
          PLATFORM_SMOKE_REQUIRED=true
        fi
        if [[ "$FORMAT_REQUIRED" == true || "$LINT_REQUIRED" == true || "$TYPECHECK_REQUIRED" == true || "$UNIT_TESTS_REQUIRED" == true ]]; then
          SOURCE_CHANGED=true
        fi

        echo "docs-only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
        echo "code-changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
        echo "source-changed=$SOURCE_CHANGED" >> "$GITHUB_OUTPUT"
        echo "e2e-changed=$E2E_CHANGED" >> "$GITHUB_OUTPUT"
        echo "rust-changed=$RUST_CHANGED" >> "$GITHUB_OUTPUT"
        echo "required-checks=$(jq -c '.requiredChecks' <<<"${classification}")" >> "$GITHUB_OUTPUT"
        echo "markdownlint-required=$MARKDOWNLINT_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "format-required=$FORMAT_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "lint-required=$LINT_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "typecheck-required=$TYPECHECK_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "unit-tests-required=$UNIT_TESTS_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "workflow-lint-required=$WORKFLOW_LINT_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "shell-syntax-required=$SHELL_SYNTAX_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "script-fixtures-required=$SCRIPT_FIXTURES_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "dependency-audit-required=$DEPENDENCY_AUDIT_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "opa-required=$OPA_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "regal-required=$REGAL_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "release-dry-run-required=$RELEASE_DRY_RUN_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "infra-static-check-required=$INFRA_STATIC_CHECK_REQUIRED" >> "$GITHUB_OUTPUT"
        echo "platform-smoke-required=$PLATFORM_SMOKE_REQUIRED" >> "$GITHUB_OUTPUT"

        echo "Change detection: docs-only=$DOCS_ONLY code=$CODE_CHANGED source=$SOURCE_CHANGED e2e=$E2E_CHANGED rust=$RUST_CHANGED requiredChecks=$(jq -c '.requiredChecks' <<<"${classification}")"
