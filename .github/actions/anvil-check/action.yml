name: 'Anvil Check'
description: 'Run Anvil quality gates on your codebase'
author: 'Anvil'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  node-version:
    description:
      'Explicit Node.js version (e.g., 20, 22). If empty, auto-detects from project files.'
    required: false
    default: ''
  node-version-file:
    description:
      'File to read Node version from. Auto-detects .node-version, .nvmrc, or package.json if empty.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run Anvil in (useful for monorepos)'
    required: false
    default: '.'
  fail-on-warnings:
    description: 'Fail the check if warnings are found (blocking mode)'
    required: false
    default: 'false'
  check-type:
    description: 'Type of check to run: "gate" (full gates) or "check" (quick check)'
    required: false
    default: 'check'
  files:
    description:
      'Specific files to check (space-separated). If empty, auto-detects changed files in PR.'
    required: false
    default: ''
  auto-detect-files:
    description: 'Automatically detect changed files in PR/push. Set to false to check all files.'
    required: false
    default: 'true'
  github_token:
    description:
      'GitHub token for API access. Defaults to the automatic github.token. Use this to provide a
      custom token with write access (e.g., GH_AUTH_TOKEN).'
    required: false
    default: ''

outputs:
  warnings-count:
    description: 'Total number of warnings found'
    value: ${{ steps.anvil.outputs.warnings-count }}
  errors-count:
    description: 'Total number of errors found'
    value: ${{ steps.anvil.outputs.errors-count }}
  result-json:
    description: 'Full JSON result from Anvil'
    value: ${{ steps.anvil.outputs.result-json }}
  exit-code:
    description: 'Exit code from Anvil (0=pass, 1=warnings, 2=errors)'
    value: ${{ steps.anvil.outputs.exit-code }}
  files-checked:
    description: 'List of files that were checked'
    value: ${{ steps.resolve-files.outputs.files }}

runs:
  using: 'composite'
  steps:
    # Step 1: Detect Node version file if not explicitly provided
    - name: Detect Node version
      id: detect-node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ -n "${{ inputs.node-version }}" ]]; then
          echo "source=explicit" >> $GITHUB_OUTPUT
          echo "version=${{ inputs.node-version }}" >> $GITHUB_OUTPUT
          echo "::notice::Using explicit node-version: ${{ inputs.node-version }}"
        elif [[ -n "${{ inputs.node-version-file }}" ]]; then
          echo "source=file" >> $GITHUB_OUTPUT
          echo "file=${{ inputs.node-version-file }}" >> $GITHUB_OUTPUT
          echo "::notice::Using node-version-file: ${{ inputs.node-version-file }}"
        elif [[ -f ".node-version" ]]; then
          echo "source=auto" >> $GITHUB_OUTPUT
          echo "file=.node-version" >> $GITHUB_OUTPUT
          echo "::notice::Auto-detected .node-version"
        elif [[ -f ".nvmrc" ]]; then
          echo "source=auto" >> $GITHUB_OUTPUT
          echo "file=.nvmrc" >> $GITHUB_OUTPUT
          echo "::notice::Auto-detected .nvmrc"
        elif [[ -f "package.json" ]] && jq -e '.engines.node' package.json > /dev/null 2>&1; then
          echo "source=auto" >> $GITHUB_OUTPUT
          echo "file=package.json" >> $GITHUB_OUTPUT
          echo "::notice::Auto-detected Node version from package.json"
        else
          echo "source=fallback" >> $GITHUB_OUTPUT
          echo "version=20" >> $GITHUB_OUTPUT
          echo "::notice::No Node version file found, using fallback (Node 20)"
        fi

    # Step 2: Setup Node.js with detected or explicit version
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.detect-node.outputs.version || '' }}
        node-version-file: ${{ steps.detect-node.outputs.file || '' }}

    # Step 3: Get changed files (for PRs and pushes)
    - name: Get changed files
      id: changed-files
      if: inputs.files == '' && inputs.auto-detect-files == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token || github.token }}
      run: |
        FILES=""

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # For PRs, use gh CLI to get changed files
          FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path' 2>/dev/null | tr '\n' ' ' || echo "")
          echo "::notice::Detected PR #${{ github.event.pull_request.number }} - found $(echo "$FILES" | wc -w) changed files"
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          # For pushes, use git diff
          if [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | tr '\n' ' ' || echo "")
            echo "::notice::Detected push - found $(echo "$FILES" | wc -w) changed files"
          else
            echo "::notice::Initial commit or force push - will check all files"
          fi
        fi

        echo "files=$FILES" >> $GITHUB_OUTPUT

    # Step 4: Filter to analysable files
    - name: Filter analysable files
      id: resolve-files
      shell: bash
      run: |
        # Use explicit files if provided
        if [[ -n "${{ inputs.files }}" ]]; then
          echo "files=${{ inputs.files }}" >> $GITHUB_OUTPUT
          echo "::notice::Using explicitly provided files"
          exit 0
        fi

        # If auto-detect is disabled, check all files (empty = anvil decides)
        if [[ "${{ inputs.auto-detect-files }}" != "true" ]]; then
          echo "files=" >> $GITHUB_OUTPUT
          echo "::notice::Auto-detect disabled - Anvil will determine files to check"
          exit 0
        fi

        # Filter changed files to analysable types
        CHANGED="${{ steps.changed-files.outputs.files }}"
        FILTERED=""
        COUNT=0

        for FILE in $CHANGED; do
          case "$FILE" in
            *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs)
              FILTERED="$FILTERED $FILE"
              COUNT=$((COUNT + 1))
              ;;
          esac
        done

        # Trim leading space
        FILTERED=$(echo "$FILTERED" | xargs)

        echo "files=$FILTERED" >> $GITHUB_OUTPUT

        if [[ -z "$FILTERED" ]]; then
          echo "::notice::No analysable files in changeset (filtered from $(echo "$CHANGED" | wc -w) files)"
        else
          echo "::notice::Filtered to $COUNT analysable file(s)"
        fi

    # Step 5: Install Anvil CLI
    - name: Install Anvil CLI
      shell: bash
      run: npm install -g @eddacraft/anvil-cli

    # Step 6: Run Anvil check (skip if no files to check)
    - name: Run Anvil check
      id: anvil
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        FILES="${{ steps.resolve-files.outputs.files }}"

        # If we have specific files and none are analysable, skip
        if [[ "${{ inputs.auto-detect-files }}" == "true" && -z "$FILES" && -n "${{ steps.changed-files.outputs.files }}" ]]; then
          echo "::notice::No analysable files to check - skipping Anvil"
          echo "exit-code=0" >> $GITHUB_OUTPUT
          echo "warnings-count=0" >> $GITHUB_OUTPUT
          echo "errors-count=0" >> $GITHUB_OUTPUT
          echo 'result-json={"skipped":true,"reason":"No analysable files in changeset"}' >> $GITHUB_OUTPUT
          exit 0
        fi

        set +e
        RESULT=$(anvil ${{ inputs.check-type }} $FILES --json 2>&1)
        EXIT_CODE=$?
        set -e

        # Store exit code
        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT

        # Store full JSON result (using heredoc for multiline)
        echo "result-json<<ANVIL_EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "ANVIL_EOF" >> $GITHUB_OUTPUT

        # Extract counts from JSON based on check-type
        # - 'check' mode: .summary.warnings, .summary.errors, .warnings[]
        # - 'gate' mode: .summary.failed, .summary.passed, .checks[]
        if [[ "${{ inputs.check-type }}" == "gate" ]]; then
          # Gate mode: use failed/passed counts from gate result structure
          FAILED=$(echo "$RESULT" | jq -r '.summary.failed // 0' 2>/dev/null || echo "0")
          PASSED=$(echo "$RESULT" | jq -r '.summary.passed // 0' 2>/dev/null || echo "0")
          # Map gate failures to errors for consistent output interface
          WARNINGS=0
          ERRORS=$FAILED
          echo "::notice::Anvil gate complete: $PASSED passed, $FAILED failed"
        else
          # Check mode: use warnings/errors counts from check result structure
          WARNINGS=$(echo "$RESULT" | jq -r '.summary.warnings // 0' 2>/dev/null || echo "0")
          ERRORS=$(echo "$RESULT" | jq -r '.summary.errors // 0' 2>/dev/null || echo "0")
          echo "::notice::Anvil check complete: $WARNINGS warning(s), $ERRORS error(s)"
        fi
        echo "warnings-count=$WARNINGS" >> $GITHUB_OUTPUT
        echo "errors-count=$ERRORS" >> $GITHUB_OUTPUT

        # Handle exit based on mode
        if [[ "${{ inputs.fail-on-warnings }}" == "true" && $EXIT_CODE -ne 0 ]]; then
          echo "::error::Anvil check failed (blocking mode enabled)"
          exit 1
        fi

        # In non-blocking mode, always succeed - let status checks handle pass/fail
        exit 0

    # Step 7: Post PR comment with results summary
    - name: Post PR comment
      if: github.event_name == 'pull_request' && steps.anvil.outputs.exit-code != ''
      uses: actions/github-script@v7
      with:
        script: |
          const warnings = parseInt('${{ steps.anvil.outputs.warnings-count }}') || 0;
          const errors = parseInt('${{ steps.anvil.outputs.errors-count }}') || 0;
          const skipped = '${{ steps.anvil.outputs.result-json }}'.includes('"skipped":true');

          // Build comment body
          const marker = '<!-- anvil-check-results -->';
          let body = `${marker}\n## 🔨 Anvil Check Results\n\n`;

          if (skipped) {
            body += '⏭️ **Skipped** — No analysable files in changeset\n';
          } else if (warnings === 0 && errors === 0) {
            body += '✅ **All checks passed!** No issues found.\n';
          } else {
            body += `| Category | Count |\n|----------|-------|\n`;
            body += `| ⚠️ Warnings | ${warnings} |\n`;
            body += `| ❌ Errors | ${errors} |\n`;
            body += '\n';
            if (errors > 0) {
              body += '❌ **Action required** — Please fix the errors above.\n';
            } else if ('${{ inputs.fail-on-warnings }}' === 'true') {
              body += '⚠️ **Blocking mode** — Warnings must be resolved.\n';
            } else {
              body += '💡 Warnings are informational and do not block this PR.\n';
            }
          }

          body += '\n---\n*Powered by [Anvil](https://github.com/EddaCraft/anvil-001)*';

          // Find and update existing comment or create new one
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            console.log(`Updated existing comment #${existing.id}`);
          } else {
            const { data: newComment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            console.log(`Created new comment #${newComment.id}`);
          }

    # Step 8: Set commit status
    - name: Set commit status
      if: always() && steps.anvil.outputs.exit-code != ''
      uses: actions/github-script@v7
      with:
        script: |
          const warnings = parseInt('${{ steps.anvil.outputs.warnings-count }}') || 0;
          const errors = parseInt('${{ steps.anvil.outputs.errors-count }}') || 0;
          const failOnWarnings = '${{ inputs.fail-on-warnings }}' === 'true';
          const skipped = '${{ steps.anvil.outputs.result-json }}'.includes('"skipped":true');

          let state = 'success';
          let description = 'All checks passed';

          if (skipped) {
            state = 'success';
            description = 'Skipped — no analysable files';
          } else if (errors > 0) {
            state = 'failure';
            description = `${errors} error(s) found`;
          } else if (warnings > 0 && failOnWarnings) {
            state = 'failure';
            description = `${warnings} warning(s) found (blocking mode)`;
          } else if (warnings > 0) {
            // Note: GitHub commit status doesn't have 'neutral', so we use 'success' 
            // with a descriptive message. The Check Run (step 9) handles neutral state.
            state = 'success';
            description = `${warnings} warning(s) — non-blocking`;
          }

          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state,
            description,
            context: 'Anvil Check',
            target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          });

          console.log(`Set commit status: ${state} — ${description}`);

    # Step 9: Create check run with inline annotations
    - name: Create check run with annotations
      if:
        always() && steps.anvil.outputs.exit-code != '' && steps.anvil.outputs.warnings-count != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const warnings = parseInt('${{ steps.anvil.outputs.warnings-count }}') || 0;
          const errors = parseInt('${{ steps.anvil.outputs.errors-count }}') || 0;
          const failOnWarnings = '${{ inputs.fail-on-warnings }}' === 'true';

          // Parse result JSON safely
          let result;
          try {
            result = JSON.parse(`${{ steps.anvil.outputs.result-json }}`);
          } catch (e) {
            console.log('Could not parse result JSON, skipping annotations');
            return;
          }

          // Get items to annotate based on check-type
          const checkType = '${{ inputs.check-type }}';
          let items = [];

          if (checkType === 'gate') {
            // Gate mode: annotate failed checks (no file-level annotations available)
            items = (result.checks || [])
              .filter(c => !c.passed && !c.skipped)
              .map(c => ({
                name: c.name,
                message: c.message || `Check '${c.name}' failed`,
                severity: 'error'
              }));
          } else {
            // Check mode: annotate warnings with file locations
            items = result.warnings || [];
          }

          if (items.length === 0) {
            console.log('No items to annotate');
            return;
          }

          // Build annotations (GitHub limit: 50 per request)
          const annotations = items.slice(0, 50).map(v => ({
            path: v.file || v.path || '.github/workflows',
            start_line: v.line || v.start_line || 1,
            end_line: v.end_line || v.line || v.start_line || 1,
            annotation_level: v.severity === 'error' ? 'failure' : 'warning',
            message: v.id ? `[${v.id}] ${v.message}` : (v.name ? `[${v.name}] ${v.message}` : v.message),
          }));

          // Determine conclusion
          let conclusion = 'neutral';
          if (errors > 0) {
            conclusion = 'failure';
          } else if (warnings > 0 && failOnWarnings) {
            conclusion = 'failure';
          }

          const title = errors > 0 
            ? `${errors} error(s), ${warnings} warning(s)` 
            : `${warnings} warning(s)`;

          const summary = violations.length > 50
            ? `Showing first 50 of ${violations.length} issues. See full output for details.`
            : `Found ${violations.length} issue(s) to review.`;

          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Anvil Check',
            head_sha: context.sha,
            status: 'completed',
            conclusion,
            output: {
              title,
              summary,
              annotations,
            },
          });

          console.log(`Created check run with ${annotations.length} annotation(s)`);
