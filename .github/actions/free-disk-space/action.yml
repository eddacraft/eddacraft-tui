name: 'Free disk space'
description: >-
  Reclaim disk on GitHub-hosted ubuntu runners by removing preinstalled toolchains that the repo CI
  jobs do not use (dotnet, GHC/ghcup, Android SDK, CodeQL bundles, Swift). The stock ubuntu-latest image
  leaves limited free space on /, which large dependency/cache restores and build artifacts can
  exhaust — surfacing as intermittent "No space left on device" failures that kill jobs mid-setup,
  on a different job each run. Linux-only; a no-op on macOS/Windows.

runs:
  using: composite
  steps:
    - name: Reclaim runner disk
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "Runner OS is $RUNNER_OS, not Linux; skipping disk reclaim."
          exit 0
        fi
        echo "Disk before reclaim:"
        df -h / || true
        # Preinstalled toolchains that none of the repo CI jobs touch (~25-30 GB).
        # Each path is removed best-effort so an image layout change can
        # never fail the build — at worst we reclaim a little less.
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL \
          /usr/share/swift || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        echo "Disk after reclaim:"
        df -h / || true
