# SDT-002 secret-detection calibration report.
#
# Advisory sidecar — intentionally NOT in the required-checks ruleset (so it
# cannot be enforced from this file; the constraint lives in repo settings).
# The corpus gate itself is a normal integration test and already runs under
# `Test`; this workflow exists to put the *decomposed numbers* — detection
# rate, false-positive rate, per-rule misses — in front of a reviewer whenever
# anything under `secret/` moves.
#
# On a pull request it measures twice: the PR head ("after") and the merge
# base with this PR's corpus and runner overlaid onto it ("before"), so the two
# runs differ only in the engine under test. If the base leg cannot be
# produced, the summary says so in as many words rather than presenting a
# single measurement as a comparison.
name: Secret calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/anvil-checks/src/secret/**'
      - 'crates/anvil-checks/tests/secret_calibration.rs'
      - 'crates/anvil-checks/tests/corpus/secret/**'
      - '.github/workflows/secret-calibration.yml'
  pull_request:
    paths:
      - 'crates/anvil-checks/src/secret/**'
      - 'crates/anvil-checks/tests/secret_calibration.rs'
      - 'crates/anvil-checks/tests/corpus/secret/**'
      - '.github/workflows/secret-calibration.yml'

concurrency:
  group: secret-calibration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calibrate:
    name: Detection / false-positive report
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The "before" leg needs the merge base, so a shallow clone will not do.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ci
          save-if: 'false'

      - name: Measure this revision (after)
        run: |
          set -o pipefail
          cargo test -p eddacraft-anvil-checks --test secret_calibration -- --nocapture \
            2>&1 | tee after.txt
        # The corpus gate's own pass/fail is owned by the `Test` check; this
        # job is the report, so a red corpus must still publish its numbers.
        continue-on-error: true

      - name: Measure the merge base with this corpus (before)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "merge base: ${base_sha}" | tee before.txt
          git worktree add /tmp/sdt-base "${base_sha}"
          # Overlay THIS PR's corpus and runner onto the base tree so the only
          # difference between the two legs is the scanner under test. The
          # find/-delete clears any stale case files the base revision carried.
          overlay=/tmp/sdt-base/crates/anvil-checks/tests/corpus/secret
          mkdir -p "${overlay}"
          find "${overlay}" -type f -delete
          cp -R crates/anvil-checks/tests/corpus/secret/. "${overlay}/"
          cp crates/anvil-checks/tests/secret_calibration.rs \
            /tmp/sdt-base/crates/anvil-checks/tests/secret_calibration.rs
          # A drifted baseline is expected on this leg (that is the point), so
          # the test result is discarded and only the printed report is kept.
          if (cd /tmp/sdt-base && cargo test -p eddacraft-anvil-checks \
                --test secret_calibration -- --nocapture) >>before.txt 2>&1; then
            echo "base leg completed" >>before.txt
          else
            echo "base leg exited non-zero (expected when the numbers moved)" >>before.txt
          fi
        continue-on-error: true

      - name: Publish the report
        if: always()
        run: |
          set -uo pipefail
          headline() {
            # The report body, from its banner to the composition note.
            sed -n '/=== SDT-002 secret-detection calibration report ===/,/^NOTE:/p' "$1"
          }
          {
            echo '## SDT-002 secret-detection calibration'
            echo
            echo '### After (this revision)'
            echo '```text'
            if [ -s after.txt ] && headline after.txt | grep -q .; then
              headline after.txt
            else
              echo 'unavailable — the run under test produced no report (see the job log).'
            fi
            echo '```'
            echo
            echo '### Before (merge base, same corpus)'
            echo '```text'
            if [ "${{ github.event_name }}" != 'pull_request' ]; then
              echo 'not applicable — push and dispatch events have no merge base.'
            elif [ -s before.txt ] && headline before.txt | grep -q .; then
              headline before.txt
            else
              echo 'unavailable — the merge-base leg produced no report (see the job log).'
              echo 'The After block above is a single measurement, not a comparison.'
            fi
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
