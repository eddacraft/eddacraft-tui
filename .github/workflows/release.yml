name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      # GITHUB_REF is controlled by repo write access; tag names are
      # constrained by the on.push.tags pattern above (semver-only).
      GIT_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GIT_REF#refs/tags/v}"
          # `cargo pkgid` emits `<url>#<name>@<version>` (or `…#<version>` on
          # older cargo); the version always lives after the final `@` or `#`.
          PKGID=$(cargo pkgid)
          MANIFEST="${PKGID##*@}"
          MANIFEST="${MANIFEST##*#}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $MANIFEST"
            exit 1
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Mirror the CI dry-run: validate every feature gate at publish time
        # so the artifact uploaded to crates.io matches what `docs.rs` builds.
        run: cargo publish --all-features

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GIT_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes
