name: Resource Budget

# Assurance + release-candidate gate — not a PR required check.
#
# Tiering (see `.github/workflows/README.md`):
# - PR: does not run (keeps routine crates PRs free of ~18m release-profile work)
# - Integration push: path-filtered tip-of-main measurement after merge
# - Assurance: nightly schedule on main tip
# - Release candidate: `workflow_call` from release-readiness on an exact SHA
# - Manual: workflow_dispatch (also enables the heavier concurrent job)
#
# The load-bearing latency gates (GCALL-006 call-lift, GV2-025 hot-read, RLB
# SLOs) each exit non-zero on a budget breach and prove they trip via a
# synthetic-regression self-test. Shipping still requires them green on
# release-readiness even though they no longer block every PR merge.

on:
  push:
    branches: [main]
    paths:
      - 'crates/anvil-bench/**'
      - 'crates/**'
      - 'docs/policies/resource-budget.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/resource-budget.yml'
  schedule:
    # Daily 17:15 UTC — offset from ci-nightly @ 17:00 so both share warm
    # caches without stampeding the same minute. Moved with ci-nightly when
    # that shifted from 02:00 to 17:00 UTC (Perth-overnight); the +15 offset
    # is the load-bearing part, not the absolute hour.
    - cron: '15 17 * * *'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: Exact git ref or SHA to check out (release-readiness)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group:
    resource-budget-${{ github.event_name == 'workflow_call' && inputs.ref || github.ref }}-${{
    github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  resource-budgets:
    name: per-process resource budgets
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_call supplies the release-candidate SHA; other triggers
          # use the event SHA (push/schedule/dispatch).
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # CI-cost 2026-07: this job builds RELEASE-profile artefacts (the
          # anvil binary + benches below) but used to restore the debug
          # `rust-ci` cache — which never contains release deps — so every
          # run cold-built the release dependency graph. Own key, saved on
          # merges to `main` and nightly so later runs restore a warm
          # release cache. Cache contents only affect compile time, not the
          # measured budgets — the benches run the built binary.
          shared-key: rust-release-budget
          save-if:
            ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref ==
            'refs/heads/main' }}
      # The watch bench needs inotify headroom; surface the limits in the log so
      # an exhausted-watches failure is one glance to diagnose, not a mystery.
      - name: Report inotify limits
        run: |
          echo "max_user_watches=$(cat /proc/sys/fs/inotify/max_user_watches)"
          echo "max_user_instances=$(cat /proc/sys/fs/inotify/max_user_instances)"
      - name: Build release anvil binary
        run: cargo build -p eddacraft-anvil --release --bin anvil
      # Each bench exits non-zero when its budget verdict is not "pass", so the
      # step itself is the gate; `tee` keeps the JSON verdict as an artifact.
      - name: Measure watch resource budget (RLB-002)
        env:
          ANVIL_BENCH_ANVIL_BIN: target/release/anvil
        run: |
          set -o pipefail
          cargo bench -p anvil-bench --bench watch_resource_budget | tee watch-resource-budget.json
      - name: Measure intercept daemon resource budget (RLB-003)
        env:
          ANVIL_BENCH_ANVIL_BIN: target/release/anvil
        run: |
          set -o pipefail
          cargo bench -p eddacraft-anvil-intercept --bench intercept_resource_budget | tee intercept-resource-budget.json
      - name: Measure MCP server resource budget (RLB-004)
        env:
          ANVIL_BENCH_ANVIL_BIN: target/release/anvil
        run: |
          set -o pipefail
          cargo bench -p anvil-bench --bench mcp_resource_budget | tee mcp-resource-budget.json
      # DSV-006 / Task 16: the interactive `validate_paths` concurrency SLO
      # (4 agents + 1 background scan, ADR-061 §9 / RLB-008). This bench is
      # in-process (no daemon/inotify, unlike the load-ramp job), and the
      # measured warm p95 sits ~3 orders of magnitude under the 80 ms ADR-031
      # save-time budget, so it gates on the standard runner without the flake
      # risk a tight latency SLO would carry. The bench exits non-zero on a
      # p95 breach, so the step itself is the gate (ADR-061 §9 "not optional").
      - name: Measure validate_paths concurrency SLO (RLB-008 / DSV-006)
        run: |
          set -o pipefail
          cargo bench -p eddacraft-anvil-intercept --bench ipc_roundtrip \
            --features bench-internals | tee validate-paths-slo.log
      # Prove the gate is live: a 300 ms injected stall MUST drive interactive
      # p95 past the budget and exit non-zero. Build first so a *compile* failure
      # is an unambiguous error rather than being mistaken for "gate tripped"
      # (both exit non-zero). `success() || failure()` runs this even if the real
      # SLO step above tripped, so the liveness proof always executes.
      - name: Self-test — SLO gate trips on a synthetic regression
        if: success() || failure()
        run: |
          # pipefail so the `if` sees cargo bench's exit, not tee's (which is
          # always 0) — without it the gate-trip check would be inverted.
          set -o pipefail
          cargo build -p eddacraft-anvil-intercept --bench ipc_roundtrip \
            --features bench-internals
          if ANVIL_BENCH_VALIDATE_STALL_MS=300 \
              cargo bench -p eddacraft-anvil-intercept --bench ipc_roundtrip \
              --features bench-internals 2>&1 | tee validate-paths-slo-selftest.log; then
            echo "::error::validate_paths SLO gate did not fail on a 300 ms synthetic regression"
            exit 1
          fi
          echo "validate_paths SLO gate correctly fails on a synthetic regression"
      # GV2-025 / ADR-063: the resident hot-read latency gate. In-process
      # microbench (no daemon/inotify), p95 ~3 orders of magnitude under the
      # 80 ms ADR-031 save-time budget, so it gates on the standard runner. The
      # bench exits non-zero on a p95 breach, so the step itself is the gate.
      - name: Measure hot-read latency budget (GV2-025)
        run: |
          set -o pipefail
          cargo bench -p eddacraft-anvil-graph-cache --bench hot_read | tee hot-read-budget.log
      # Prove the hot-read gate is live: a 120 ms injected stall MUST drive p95
      # past the 80 ms budget and exit non-zero. Build first so a *compile*
      # failure is unambiguous rather than mistaken for "gate tripped".
      - name: Self-test — hot-read gate trips on a synthetic regression
        if: success() || failure()
        run: |
          set -o pipefail
          cargo build -p eddacraft-anvil-graph-cache --bench hot_read
          if ANVIL_BENCH_HOTREAD_STALL_MS=120 \
              cargo bench -p eddacraft-anvil-graph-cache --bench hot_read \
              2>&1 | tee hot-read-budget-selftest.log; then
            echo "::error::hot-read gate did not fail on a 120 ms synthetic regression"
            exit 1
          fi
          echo "hot-read gate correctly fails on a synthetic regression"
      # GCALL-006 / ADR-086: the save-time call-lift latency gate. In-process
      # microbench (no daemon/inotify), p95 ~13x under the 80 ms ADR-031 save-time
      # budget, so it gates on the standard runner. The bench exits non-zero on a
      # p95 breach, so the step itself is the gate.
      - name: Measure call-lift latency budget (GCALL-006)
        run: |
          set -o pipefail
          cargo bench -p eddacraft-anvil-graph-cache --bench call_lift | tee call-lift-budget.log
      # Prove the call-lift gate is live: a 120 ms injected stall MUST drive p95
      # past the 80 ms budget and exit non-zero. Build first so a *compile*
      # failure is unambiguous rather than mistaken for "gate tripped".
      - name: Self-test — call-lift gate trips on a synthetic regression
        if: success() || failure()
        run: |
          set -o pipefail
          cargo build -p eddacraft-anvil-graph-cache --bench call_lift
          if ANVIL_BENCH_CALLLIFT_STALL_MS=120 \
              cargo bench -p eddacraft-anvil-graph-cache --bench call_lift \
              2>&1 | tee call-lift-budget-selftest.log; then
            echo "::error::call-lift gate did not fail on a 120 ms synthetic regression"
            exit 1
          fi
          echo "call-lift gate correctly fails on a synthetic regression"
      - name: Upload resource budget verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-budget-verdicts
          path: |
            *-resource-budget.json
            validate-paths-slo.log
            validate-paths-slo-selftest.log
            hot-read-budget.log
            hot-read-budget-selftest.log
            call-lift-budget.log
            call-lift-budget-selftest.log
          if-no-files-found: ignore
          retention-days: 30

  # RLB-005 + the multi-agent load-ramp harness are heavier (spawn 3+ processes
  # and ramp concurrent watchers) and need inotify headroom, so they run on
  # *direct* manual dispatch of this workflow only — not on every push,
  # schedule, or release-readiness call.
  #
  # IMPORTANT: when release-readiness (workflow_dispatch) calls this file as a
  # reusable workflow, `github.event_name` is still `workflow_dispatch` (caller
  # context). Gate on the call-only `inputs.ref` being empty so readiness keeps
  # the lighter per-process job only, matching the historical intent.
  concurrent-resource-budget:
    name: concurrent multi-process budget + load ramp
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref == null || inputs.ref == '') }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Restore the release-profile cache saved by the push/schedule leg
          # above (dispatch-only job, so it never saves its own).
          shared-key: rust-release-budget
          save-if: 'false'
      - name: Build release anvil binary
        run: cargo build -p eddacraft-anvil --release --bin anvil
      - name: Measure concurrent multi-process budget (RLB-005)
        env:
          ANVIL_BENCH_ANVIL_BIN: target/release/anvil
        run: |
          set -o pipefail
          cargo bench -p anvil-bench --bench concurrent_processes | tee concurrent-resource-budget.json
      # Prefer absolute path: load-ramp / the probe chdir into a temp repo.
      - name: Multi-agent watch load-ramp smoke (RLB-001)
        run: |
          bin="$(pwd)/target/release/anvil"
          test -x "$bin"
          ANVIL_BIN="$bin" bash scripts/bench/load-ramp.sh --smoke
      - name: Upload concurrent budget verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: concurrent-resource-budget
          path: concurrent-resource-budget.json
          if-no-files-found: ignore
          retention-days: 30
