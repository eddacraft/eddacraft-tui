name: Resource Budget

on:
  push:
    branches: [main]
    paths:
      - 'crates/anvil-bench/**'
      - 'crates/**'
      - 'docs/policies/resource-budget.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/resource-budget.yml'
  pull_request:
    paths:
      - 'crates/anvil-bench/**'
      - 'crates/**'
      - 'docs/policies/resource-budget.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/resource-budget.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: resource-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  watch-resource-budget:
    name: anvil watch resource budget
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Build release anvil binary
        run: cargo build -p eddacraft-anvil --release --bin anvil
      - name: Measure watch resource budget
        env:
          ANVIL_BENCH_ANVIL_BIN: target/release/anvil
        run: |
          set -o pipefail
          cargo bench -p anvil-bench --bench watch_resource_budget | tee watch-resource-budget.json
      - name: Upload resource budget verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-resource-budget
          path: watch-resource-budget.json
          if-no-files-found: ignore
          retention-days: 30
