# Mirror the acknowledgements starter kit to its public sibling repo.
#
# ATTRIB-011. The canonical source lives at
# `tools/starters/acknowledgements/` in this (private) repository. This
# workflow extracts that subdirectory as its own repo via `git subtree
# split` and force-pushes it to `eddacraft/acknowledgements-starter:main`.
#
# Pre-push transformation:
#   - The kit is wrapped in a self-named `acknowledgements/` directory
#     before splitting, so the mirror's root contains `acknowledgements/`
#     rather than a flat dump of the kit's files. That lets consumers do
#     `git subtree add --prefix tools/starters …` and get
#     `tools/starters/acknowledgements/*` automatically — the kit names
#     itself instead of relying on the consumer to type the right prefix.
#   - `MIRROR-README.md` is promoted to the wrap parent's root (i.e. the
#     mirror repo's top level), so the public repo has a "this is a
#     mirror" landing page above the `acknowledgements/` folder. The
#     kit's own `README.md` (the marker-splice contract) is preserved
#     verbatim under `acknowledgements/README.md`.
#
# The mirror is read-only by policy: contributions go upstream to anvil.
# Force-push every run keeps that contract simple — no merge surface.
#
# Auth: fine-grained PAT scoped to `eddacraft/acknowledgements-starter`
# with `Contents: Read and write`, stored in the repo secret
# `MIRROR_PUSH_TOKEN`. Deploy keys are disabled at the eddacraft org
# level, so SSH is not an option; HTTPS + token is the supported path.
#
# See plans/execution/ATTRIB-011.steps.md for the design.

name: Mirror — acknowledgements starter kit

on:
  push:
    branches: [main]
    paths:
      - 'tools/starters/acknowledgements/**'
      - '.github/workflows/mirror-acknowledgements-starter.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you force-resyncing? (logged on the mirror commit)'
        required: false
        default: 'manual resync'

concurrency:
  group: mirror-acknowledgements-starter
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: this workflow does not touch the anvil-001
# repo's GitHub state — all writes go to the mirror via MIRROR_PUSH_TOKEN.
permissions:
  contents: read

jobs:
  mirror:
    name: Force-push subtree to eddacraft/acknowledgements-starter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_dispatch runs on whatever ref the operator selects in the UI.
      # The mirror is documented as tracking canonical `main`; reject any
      # other ref so a stray dispatch from a feature branch / tag can't
      # silently force-push the wrong tree to the public repo.
      - name: Guard — only mirror from refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "::error::mirror workflow refused: GITHUB_REF=${GITHUB_REF} (only refs/heads/main is allowed)"
            exit 1
          fi

      - name: Checkout (full history — subtree split needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name  'anvil-mirror-bot'
          git config --global user.email 'anvil-mirror-bot@users.noreply.github.com'

      - name: Sanity-check mirror push token
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -z "${MIRROR_PUSH_TOKEN}" ]; then
            echo '::error::secret MIRROR_PUSH_TOKEN is empty — wire the fine-grained PAT before re-running'
            exit 1
          fi

      - name: Wrap kit + promote MIRROR-README to mirror root (throwaway commit)
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          KIT_DIR=tools/starters/acknowledgements
          # Stage the wrapped layout under a scratch parent so the split
          # picks up `acknowledgements/<files>` rather than a flat root.
          # Using a hidden parent (`.mirror-wrap`) keeps the working tree
          # tidy and ensures the split prefix can't accidentally pull in
          # sibling starter kits added later under `tools/starters/`.
          WRAP_PARENT=tools/starters/.mirror-wrap
          WRAP_DIR="${WRAP_PARENT}/acknowledgements"
          if [ ! -f "${KIT_DIR}/MIRROR-README.md" ]; then
            echo "::error::${KIT_DIR}/MIRROR-README.md missing — the public framing header is required"
            exit 1
          fi
          mkdir -p "${WRAP_PARENT}"
          git mv "${KIT_DIR}" "${WRAP_DIR}"
          # Promote MIRROR-README to the wrap-parent root → mirror's
          # top-level README. The kit's own README.md (the marker-splice
          # contract) stays untouched under acknowledgements/README.md.
          git mv "${WRAP_DIR}/MIRROR-README.md" "${WRAP_PARENT}/README.md"
          git add -A
          msg='chore(mirror): wrap kit + promote public README [skip ci]'
          if [ -n "${DISPATCH_REASON:-}" ]; then
            msg=$(printf '%s\n\nmanual dispatch reason: %s\n' "${msg}" "${DISPATCH_REASON}")
          fi
          git commit -m "${msg}" --allow-empty

      - name: Subtree split
        run: |
          set -euo pipefail
          # Split from the wrapper parent. The split branch's root is
          # therefore `acknowledgements/<files>`, so consumers can
          # `git subtree add --prefix tools/starters` and the kit lands
          # at `tools/starters/acknowledgements/*` without naming it
          # again in the prefix.
          git subtree split \
            --prefix=tools/starters/.mirror-wrap \
            -b _mirror_split

      - name: Force-push to mirror repo
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate via an HTTP Basic header instead of embedding the
          # token in the URL. The URL-embedded form is fragile: a single
          # stray byte in the secret (trailing newline, control char) makes
          # libcurl reject the entire URL with "Malformed input to a URL
          # function" before it can even talk to GitHub. Sending an explicit
          # Authorization header sidesteps URL parsing entirely.
          basic=$(printf '%s' "x-access-token:${MIRROR_PUSH_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${basic}" \
              push --force \
              https://github.com/eddacraft/acknowledgements-starter.git \
              _mirror_split:main

      - name: Summary
        if: always()
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          {
            echo '## Mirror result'
            echo
            echo 'Source commit (anvil-001 main):    `'"${GITHUB_SHA}"'`'
            echo 'Mirror target:                     `eddacraft/acknowledgements-starter:main`'
            echo 'Trigger:                           `'"${GITHUB_EVENT_NAME}"'`'
            if [ -n "${DISPATCH_REASON:-}" ]; then
              echo 'Dispatch reason:                   `'"${DISPATCH_REASON}"'`'
            fi
            echo
            echo 'Verify with:'
            echo
            echo '    gh api repos/eddacraft/acknowledgements-starter/commits/main --jq .sha'
          } >> "${GITHUB_STEP_SUMMARY}"
