# Mirror the acknowledgements starter kit to its public sibling repo.
#
# ATTRIB-011. The canonical source lives at
# `tools/starters/acknowledgements/` in this (private) repository. This
# workflow extracts that subdirectory as its own repo via `git subtree
# split` and force-pushes it to `eddacraft/acknowledgements-starter:main`.
#
# Pre-push transformation:
#   - `MIRROR-README.md` is prepended onto `README.md` so the public repo
#     reads with a "this is a mirror" banner up front. The MIRROR-README
#     file itself is then removed.
#
# The mirror is intentionally **flat-rooted** (the kit's files at the
# public repo's top level, no wrapping subdirectory). Consumers adopt
# with a per-kit prefix:
#
#     git subtree add --prefix tools/starters/acknowledgements \
#       https://github.com/eddacraft/acknowledgements-starter.git main --squash
#
# Each starter kit is its own independently tracked subtree at its own
# per-kit prefix — so adding a second starter
# (`--prefix tools/starters/logging`, etc.) doesn't collide and pulls
# stay scoped to one kit. A previous iteration of this workflow wrapped
# the kit in an `acknowledgements/` directory so consumers could use
# `--prefix tools/starters`, but that forces the entire parent directory
# to become a single subtree — precluding the multi-kit independence
# we actually want. See plans/execution/ATTRIB-011.steps.md decisions
# table for the analysis.
#
# The mirror is read-only by policy: contributions go upstream to anvil.
# Force-push every run keeps that contract simple — no merge surface.
#
# Auth: fine-grained PAT scoped to `eddacraft/acknowledgements-starter`
# with `Contents: Read and write`, stored in the repo secret
# `MIRROR_PUSH_TOKEN`. Deploy keys are disabled at the eddacraft org
# level, so SSH is not an option; HTTPS + token is the supported path.
#
# PAT rotation: see docs/runbooks/acknowledgements-starter-release.md
# (the "Token rotation" section — the same secret backs this rolling
# mirror and the release workflow).
#
# See plans/archive/execution/ATTRIB-011.steps.md for the design.

name: Mirror — acknowledgements starter kit

on:
  push:
    branches: [main]
    paths:
      - 'tools/starters/acknowledgements/**'
      - '.github/workflows/mirror-acknowledgements-starter.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you force-resyncing? (logged on the mirror commit)'
        required: false
        default: 'manual resync'
      dry_run:
        description:
          'Preflight only: validate auth + refspec + tree shape via `git push --force --dry-run`
          without mutating the public mirror.'
        type: boolean
        required: false
        default: false

concurrency:
  group: mirror-acknowledgements-starter
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: this workflow does not touch the anvil-001
# repo's GitHub state — all writes go to the mirror via MIRROR_PUSH_TOKEN.
permissions:
  contents: read

jobs:
  mirror:
    name: Force-push subtree to eddacraft/acknowledgements-starter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_dispatch runs on whatever ref the operator selects in the UI.
      # The mirror is documented as tracking canonical `main`; reject any
      # other ref so a stray dispatch from a feature branch / tag can't
      # silently force-push the wrong tree to the public repo.
      - name: Guard — only mirror from refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "::error::mirror workflow refused: GITHUB_REF=${GITHUB_REF} (only refs/heads/main is allowed)"
            exit 1
          fi

      - name: Checkout (full history — subtree split needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name  'anvil-mirror-bot'
          git config --global user.email 'anvil-mirror-bot@users.noreply.github.com'

      - name: Sanity-check mirror push token
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -z "${MIRROR_PUSH_TOKEN}" ]; then
            echo '::error::secret MIRROR_PUSH_TOKEN is empty — wire the fine-grained PAT before re-running'
            exit 1
          fi

      - name: Swap MIRROR-README onto README (on a throwaway commit)
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          KIT_DIR=tools/starters/acknowledgements
          if [ ! -f "${KIT_DIR}/MIRROR-README.md" ]; then
            echo "::error::${KIT_DIR}/MIRROR-README.md missing — the public framing header is required"
            exit 1
          fi
          # Banner double-prepend sentinel. The read-only-mirror banner lives
          # ONLY in MIRROR-README.md; the canonical README must never carry it.
          # If it does, a contributor committed the post-swap state by mistake
          # — prepending again would publish a doubled banner. Hard-fail rather
          # than push it. Sentinel is derived from MIRROR-README.md so the check
          # tracks the banner wording automatically.
          sentinel='> **This repository is a read-only mirror.**'
          if ! grep -Fq -- "${sentinel}" "${KIT_DIR}/MIRROR-README.md"; then
            echo "::error::expected banner sentinel not found in ${KIT_DIR}/MIRROR-README.md — update the double-prepend guard"
            exit 1
          fi
          if grep -Fq -- "${sentinel}" "${KIT_DIR}/README.md"; then
            echo "::error::${KIT_DIR}/README.md already carries the read-only-mirror banner — refusing to double-prepend (revert the post-swap state committed to the canonical README)"
            exit 1
          fi
          tmp="$(mktemp)"
          cat "${KIT_DIR}/MIRROR-README.md" "${KIT_DIR}/README.md" > "${tmp}"
          mv "${tmp}" "${KIT_DIR}/README.md"
          rm "${KIT_DIR}/MIRROR-README.md"
          git add "${KIT_DIR}/README.md" "${KIT_DIR}/MIRROR-README.md"
          msg='chore(mirror): prepend public README header [skip ci]'
          if [ -n "${DISPATCH_REASON:-}" ]; then
            msg=$(printf '%s\n\nmanual dispatch reason: %s\n' "${msg}" "${DISPATCH_REASON}")
          fi
          git commit -m "${msg}" --allow-empty

      - name: Subtree split
        run: |
          set -euo pipefail
          # Pre-delete guard. `git subtree split -b _mirror_split` aborts with
          # "fatal: A branch named '_mirror_split' already exists" if the ref
          # is already present in the workspace. GitHub-hosted runners are
          # ephemeral per job so this is theoretical today, but a self-hosted
          # runner or any runner-reuse model would surface it. One-line
          # idempotent guard.
          git branch -D _mirror_split 2>/dev/null || true
          git subtree split \
            --prefix=tools/starters/acknowledgements \
            -b _mirror_split

      - name: Force-push to mirror repo
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # Authenticate via an HTTP Basic header instead of embedding the
          # token in the URL. The URL-embedded form is fragile: a single
          # stray byte in the secret (trailing newline, control char) makes
          # libcurl reject the entire URL with "Malformed input to a URL
          # function" before it can even talk to GitHub. Sending an explicit
          # Authorization header sidesteps URL parsing entirely.
          #
          # Dry-run preflight: the first workflow_dispatch run after a PAT
          # rotation is a live force-push to a public repo with no pre-flight.
          # Set the `dry_run` input to add `--dry-run` so an operator can
          # validate the auth + refspec + tree shape without mutating the
          # public mirror history.
          push_opts=(--force)
          if [ "${DRY_RUN:-false}" = 'true' ]; then
            push_opts+=(--dry-run)
            echo '::notice::dry_run=true — git push --force --dry-run (mirror NOT mutated)'
          fi
          basic=$(printf '%s' "x-access-token:${MIRROR_PUSH_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${basic}" \
              push "${push_opts[@]}" \
              https://github.com/eddacraft/acknowledgements-starter.git \
              _mirror_split:main

      - name: Summary
        if: always()
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          {
            echo '## Mirror result'
            echo
            echo 'Source commit (anvil-001 main):    `'"${GITHUB_SHA}"'`'
            echo 'Mirror target:                     `eddacraft/acknowledgements-starter:main`'
            echo 'Trigger:                           `'"${GITHUB_EVENT_NAME}"'`'
            if [ -n "${DISPATCH_REASON:-}" ]; then
              echo 'Dispatch reason:                   `'"${DISPATCH_REASON}"'`'
            fi
            echo
            echo 'Verify with:'
            echo
            echo '    gh api repos/eddacraft/acknowledgements-starter/commits/main --jq .sha'
          } >> "${GITHUB_STEP_SUMMARY}"
