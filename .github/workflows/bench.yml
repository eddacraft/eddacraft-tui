name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'crates/anvil-bench/**'
      - 'crates/anvil-kernel/**'
      - 'crates/anvil-kernel-types/**'
      - 'crates/anvil-checks/**'
      - 'crates/anvil-intercept/**'
      - 'scripts/check-midedit-baseline.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench-check:
    name: Bench compile check
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - run: cargo check -p anvil-bench --all-targets
      - run: cargo check -p eddacraft-anvil-kernel --benches
      - run: cargo check -p eddacraft-anvil-checks --benches
      - run: cargo check -p eddacraft-anvil-intercept --benches --features bench-internals
      - run: cargo test -p anvil-bench

  criterion:
    name: Criterion benchmarks
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    needs: bench-check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Run kernel benchmarks
        run: |
          set -o pipefail && cargo bench --bench kernel -- --output-format bencher | tee kernel-bench.txt
      - name: Run anvil-checks benchmarks
        run: |
          set -o pipefail && cargo bench -p eddacraft-anvil-checks --bench checks -- --output-format bencher | tee checks-bench.txt
      - name: Run stress benchmarks (small config)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail && cargo bench -p anvil-bench --bench stress -- --output-format bencher | tee stress-bench.txt
      - name: Run antipattern_scan benchmarks
        run: |
          set -o pipefail && cargo bench -p anvil-bench --bench antipattern_scan -- --output-format bencher | tee antipattern-bench.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            kernel-bench.txt
            checks-bench.txt
            stress-bench.txt
            antipattern-bench.txt
            target/criterion/
          if-no-files-found: ignore
          retention-days: 90

  midedit-baseline:
    name: Mid-edit baseline gate (RTAI-003)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    needs: bench-check
    timeout-minutes: 30
    # Hard fail on any p95 exceeding the ADR-031 SLO; soft warn on baseline
    # drift outside ±15%. Policy is documented inline in
    # `scripts/check-midedit-baseline.sh` and the baseline JSON header.
    # The committed baseline was recorded on a developer machine; CI runs on
    # the configured Linux runner (defaults to ubuntu-latest, overridable via
    # `vars.LINUX_RUNNER`) will likely emit drift WARN rows on the first runs
    # after any hardware-class change. The hard-fail gate (ADR-031 SLO) is
    # runner-independent and is the only gate that should block a merge.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Run midedit_roundtrip benchmark
        # Plain criterion output (no `--output-format bencher`) — the
        # comparator only reads the percentile-sampler block, so bencher
        # framing is noise in the artifact.
        run: |
          set -o pipefail
          cargo bench -p eddacraft-anvil-intercept --bench midedit_roundtrip \
              --features bench-internals \
              | tee midedit-bench.txt
      - name: Compare against baseline
        # Invoke via `bash` rather than relying on the executable bit so the
        # job is robust against checkout actions or runner filesystems that
        # don't preserve mode bits.
        run: |
          bash scripts/check-midedit-baseline.sh \
              midedit-bench.txt \
              crates/anvil-intercept/benches/baselines/midedit_roundtrip.json
      - name: Upload midedit benchmark log (partial if cancelled)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midedit-bench-results
          path: midedit-bench.txt
          if-no-files-found: ignore
          retention-days: 90
