name: Nightly Stress Tests

# BENCH-021: Run stress test scenarios nightly on dedicated hardware.
# Requires a self-hosted runner labelled 'bench'.
#
# Setup: https://docs.github.com/en/actions/hosting-your-own-runners
#   1. Settings > Actions > Runners > New self-hosted runner
#   2. Label the runner 'bench'
#   3. Install Rust toolchain (rustup)
#   4. Run as a service: sudo ./svc.sh install && sudo ./svc.sh start

on:
  schedule:
    # Every night at 03:00 UTC (11:00 AM Perth)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Run a specific scenario (blank = all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bench-nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  stress:
    name: Stress tests
    runs-on: [self-hosted, bench]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rust toolchain info
        run: |
          rustc --version
          cargo --version
          uname -a
          free -h || true

      - name: Build stress runner (release)
        run: cargo build -p anvil-bench --release

      - name: Run stress scenarios
        env:
          BENCH_SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ -n "$BENCH_SCENARIO" ]; then
            cargo run -p anvil-bench --release -- "$BENCH_SCENARIO"
          else
            cargo run -p anvil-bench --release
          fi

      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-results-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 90
