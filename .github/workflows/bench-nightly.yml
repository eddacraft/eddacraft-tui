name: Stress Tests (manual)

# BENCH-021: Run stress test scenarios on dedicated hardware.
# Requires a self-hosted runner labelled 'bench'.
#
# Manual-only: the nightly `schedule:` trigger was removed because no
# self-hosted 'bench' runner is currently online, so scheduled runs only
# queued and were auto-cancelled (dead signal since ~2026-05-22). Dispatch
# manually once a 'bench' runner is up. To restore the nightly cadence,
# re-add under `on:`:
#   schedule:
#     - cron: '0 19 * * *'   # 03:00 Perth (19:00 UTC prev day; no DST)
#
# Runner setup: https://docs.github.com/en/actions/hosting-your-own-runners
#   1. Settings > Actions > Runners > New self-hosted runner
#   2. Label the runner 'bench'
#   3. Install Rust toolchain (rustup)
#   4. Run as a service: sudo ./svc.sh install && sudo ./svc.sh start

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Run a specific scenario (blank = all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bench-nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  stress:
    name: Stress tests
    runs-on: [self-hosted, bench]
    timeout-minutes: 60

    steps:
      # workflow_dispatch runs on whatever ref the operator selects in the UI.
      # This job runs on a self-hosted 'bench' runner and builds + executes
      # `anvil-bench` directly on that box; reject any ref but main so a stray
      # dispatch from a feature branch / tag can't run untrusted branch content
      # on the self-hosted hardware. A restored `schedule:` trigger always runs
      # on refs/heads/main, so this guard leaves nightly runs unaffected.
      - name: Guard — only run stress tests from refs/heads/main
        id: guard
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "::error::bench-nightly refused: GITHUB_REF=${GITHUB_REF} (only refs/heads/main is allowed on the self-hosted runner)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain info
        run: |
          rustc --version
          cargo --version
          uname -a
          free -h || true

      - name: Build stress runner (release)
        run: cargo build -p anvil-bench --release

      - name: Run stress scenarios
        env:
          BENCH_SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ -n "$BENCH_SCENARIO" ]; then
            cargo run -p anvil-bench --release -- "$BENCH_SCENARIO"
          else
            cargo run -p anvil-bench --release
          fi

      - name: Upload JSON reports
        # Upload partial results even when a bench scenario fails, but never
        # after the ref guard rejects the run — otherwise this always()-style
        # step would still execute on the self-hosted runner past a failed
        # guard. Gate on the guard's success so nothing runs post-guard-failure.
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-results-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 90
