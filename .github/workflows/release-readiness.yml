name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      sourceSha:
        description: Full commit SHA to validate exactly
        required: true
        type: string
      mode:
        description: Readiness mode
        required: true
        type: choice
        options:
          - readiness
          - candidate-artifacts
      channel:
        description: Release channel, such as beta or stable
        required: true
        type: string
      # CICD-012: `migration-dev` is the migration-mode compatibility
      # probe. OPMODEL-012 should remove the `migration-dev` option,
      # the matching `dev` branch in the validate job below, and any
      # documentation references once `dev` is retired.
      expectedReachableFrom:
        description: Reachability target for the requested SHA
        required: true
        type: choice
        options:
          - main
          - migration-dev
      baseBoundary:
        description: Previous release tag or product boundary for release-content checks
        required: true
        type: string
      requestedVersion:
        description: Candidate version string for tag-intended readiness
        required: false
        type: string
      trackingIssue:
        description: Optional GitHub issue number for operator-log cross-linking
        required: false
        type: string
      apsItems:
        description: Optional comma-separated APS item allowlist
        required: false
        type: string
      retentionDays:
        description: Candidate metadata retention, 1-30 days; defaults to 7
        required: false
        type: string

concurrency:
  group: release-readiness-${{ inputs.sourceSha }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Exact SHA
    runs-on: ubuntu-latest
    outputs:
      checked-out-sha: ${{ steps.validate.outputs.checked-out-sha }}
      short-sha: ${{ steps.validate.outputs.short-sha }}
      retention-days: ${{ steps.retention.outputs.days }}
      failure-class: ${{ steps.validate.outputs.failure-class }}
    steps:
      - name: Checkout trusted ref for SHA validation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expectedReachableFrom == 'migration-dev' && 'dev' || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source SHA is trusted and reachable from expected base
        id: source-trust-validation
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.sourceSha }}
          EXPECTED_REACHABLE_FROM: ${{ inputs.expectedReachableFrom }}
        run: |
          set -euo pipefail

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::sourceSha must be a full 40-character commit SHA"
            echo "failure-class=invalid-input" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # History of the trusted ref is already present locally from the preceding checkout (fetch-depth: 0).
          # No extra `git fetch` (avoids auth issues with persist-credentials: false and is redundant).
          if ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::sourceSha does not resolve to a commit in this repository"
            echo "failure-class=unknown-sha" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! git merge-base --is-ancestor "${SOURCE_SHA}" HEAD; then
            echo "::error::sourceSha must be reachable from ${EXPECTED_REACHABLE_FROM}"
            echo "failure-class=untrusted-sha" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "checked-out-sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "failure-class=none" >> "$GITHUB_OUTPUT"
      - name: Checkout requested SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sourceSha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate request
        id: validate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.sourceSha }}
          MODE: ${{ inputs.mode }}
          EXPECTED_REACHABLE_FROM: ${{ inputs.expectedReachableFrom }}
          TRACKING_ISSUE: ${{ inputs.trackingIssue }}
        run: |
          set -euo pipefail

          failure_class=invalid-input
          echo "failure-class=${failure_class}" >> "$GITHUB_OUTPUT"

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::sourceSha must be a full 40-character commit SHA"
            exit 1
          fi

          if [[ -n "$TRACKING_ISSUE" && ! "$TRACKING_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::trackingIssue must be an integer greater than zero when provided"
            exit 1
          fi

          case "$MODE" in
            readiness|candidate-artifacts) ;;
            *)
              echo "::error::mode must be readiness or candidate-artifacts"
              exit 1
              ;;
          esac

          case "$EXPECTED_REACHABLE_FROM" in
            main)
              expected_branch=main
              ;;
            migration-dev)
              expected_branch=dev
              ;;
            *)
              echo "::error::expectedReachableFrom must be main or migration-dev"
              exit 1
              ;;
          esac

          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::checked out SHA does not match sourceSha"
            echo "::error::requested ${SOURCE_SHA}"
            echo "::error::checked out ${checked_out_sha}"
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/${expected_branch}:refs/remotes/origin/${expected_branch}"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/${expected_branch}"; then
            echo "failure-class=stale-source" >> "$GITHUB_OUTPUT"
            echo "::error::sourceSha is not reachable from ${EXPECTED_REACHABLE_FROM}"
            exit 1
          fi

          echo "checked-out-sha=${checked_out_sha}" >> "$GITHUB_OUTPUT"
          echo "short-sha=${checked_out_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "failure-class=" >> "$GITHUB_OUTPUT"

      - name: Bound metadata retention
        id: retention
        shell: bash
        env:
          RETENTION_DAYS: ${{ inputs.retentionDays }}
        run: |
          set -euo pipefail

          days="${RETENTION_DAYS:-7}"
          if [[ ! "$days" =~ ^[0-9]+$ ]] || (( days < 1 || days > 30 )); then
            echo "::error::retentionDays must be an integer from 1 to 30"
            exit 1
          fi

          echo "days=${days}" >> "$GITHUB_OUTPUT"

  required-checks:
    name: Required Readiness Checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.checked-out-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run release readiness checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint:md
          bash scripts/agent/_test/guidance.test.sh
          bash scripts/ci/classify-changes.test.sh

  candidate-artifacts:
    name: Candidate Artefact Placeholder
    runs-on: ubuntu-latest
    needs:
      - validate
      - required-checks
    if: inputs.mode == 'candidate-artifacts'
    steps:
      - name: Record non-publishing candidate scope
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Candidate artefact mode is intentionally non-publishing.'
            echo 'This skeleton records the mode boundary before cargo-dist candidate builds are wired.'
            echo 'No tag, release, registry, tap, OIDC, or deployment credentials are available.'
          } >> "$GITHUB_STEP_SUMMARY"

  metadata:
    name: Emit Candidate Metadata
    runs-on: ubuntu-latest
    needs:
      - validate
      - required-checks
      - candidate-artifacts
    if:
      always() && needs.validate.result == 'success' && needs.required-checks.result == 'success' &&
      (inputs.mode == 'readiness' || needs.candidate-artifacts.result == 'success')
    steps:
      - name: Build candidate metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.sourceSha }}
          CHECKED_OUT_SHA: ${{ needs.validate.outputs.checked-out-sha }}
          SHORT_SHA: ${{ needs.validate.outputs.short-sha }}
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
          EXPECTED_REACHABLE_FROM: ${{ inputs.expectedReachableFrom }}
          BASE_BOUNDARY: ${{ inputs.baseBoundary }}
          REQUESTED_VERSION: ${{ inputs.requestedVersion }}
          TRACKING_ISSUE: ${{ inputs.trackingIssue }}
          APS_ITEMS: ${{ inputs.apsItems }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const apsItems = process.env.APS_ITEMS
            ? process.env.APS_ITEMS.split(',').map((item) => item.trim()).filter(Boolean)
            : [];
          const trackingIssueNumber = process.env.TRACKING_ISSUE
            ? Number(process.env.TRACKING_ISSUE)
            : null;
          const trackingIssue = trackingIssueNumber
            ? {
                repository: process.env.GITHUB_REPOSITORY,
                number: trackingIssueNumber,
                url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/issues/${trackingIssueNumber}`,
              }
            : null;
          const metadata = {
            schemaVersion: '1.0.0',
            lifecycleState: 'candidate',
            sourceSha: process.env.SOURCE_SHA,
            validatedSha: process.env.CHECKED_OUT_SHA,
            expectedReachableFrom: process.env.EXPECTED_REACHABLE_FROM,
            baseBoundary: process.env.BASE_BOUNDARY,
            mode: process.env.MODE,
            channel: process.env.CHANNEL,
            requestedVersion: process.env.REQUESTED_VERSION || null,
            resolvedVersion: process.env.REQUESTED_VERSION
              ? `${process.env.REQUESTED_VERSION}+candidate.${process.env.GITHUB_RUN_ID}.${process.env.SHORT_SHA}`
              : null,
            apsItems,
            trackingIssue,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            workflowRef: `${process.env.GITHUB_REPOSITORY}/.github/workflows/release-readiness.yml@${process.env.CHECKED_OUT_SHA}`,
            createdAt: new Date().toISOString(),
          };
          const json = `${JSON.stringify(metadata, null, 2)}\n`;
          metadata.manifestSha256 = crypto.createHash('sha256').update(json).digest('hex');
          fs.writeFileSync('release-candidate-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `artifact-name=release-candidate-metadata-${process.env.MODE}-${process.env.SHORT_SHA}-${process.env.GITHUB_RUN_ID}\n`
          );
          NODE

      - name: Upload candidate metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: release-candidate-metadata.json
          retention-days: ${{ needs.validate.outputs.retention-days }}
