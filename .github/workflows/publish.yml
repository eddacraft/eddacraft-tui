# NPM Package Publishing Workflow
#
# To use:
# 1. Set up NPM_TOKEN secret in GitHub repository settings
# 2. Update version in apps/anvil-cli/package.json
# 3. Push a tag matching v* pattern
---
name: Publish to NPM
run-name: 'NPM Publish: ${{ github.ref_name }}'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: true
      publish-workspace:
        description: 'Publish internal workspace packages too (non-beta only; default false)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint:check

      - name: Run type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test -- --run

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Build all packages
        run: pnpm build

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CLI_PKG='./apps/anvil-cli/package.json'
          PKG_VERSION=$(node -p "require('$CLI_PKG').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Select package publish mode
        id: publish_mode
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH_WORKSPACE: ${{ github.event.inputs.publish-workspace || 'false' }}
        run: |
          set -euo pipefail

          CLI_ONLY='@eddacraft/anvil-cli'
          WORKSPACE_PACKAGES='@eddacraft/anvil-core
          @eddacraft/anvil-aps
          @eddacraft/anvil-policy
          @eddacraft/anvil-runtime
          @eddacraft/anvil-adapters
          @eddacraft/anvil-kindling-integration
          @eddacraft/anvil-cli'

          if [[ "$REF_NAME" == *"-beta"* ]] || [[ "$REF_NAME" == *"-beta."* ]] || [[ "$REF_NAME" == *"-beta-"* ]]; then
            MODE='beta-tag-cli-only'
            PACKAGES="$CLI_ONLY"
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "$INPUT_PUBLISH_WORKSPACE" == 'true' ]]; then
            MODE='manual-workspace'
            PACKAGES="$WORKSPACE_PACKAGES"
          else
            MODE='default-cli-only'
            PACKAGES="$CLI_ONLY"
          fi

          {
            echo "mode=$MODE"
            echo 'packages<<EOF'
            echo "$PACKAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "Publish mode: $MODE"
          echo "Packages:"
          while IFS= read -r pkg; do
            [[ -z "$pkg" ]] && continue
            echo " - $pkg"
          done <<< "$PACKAGES"

      - name: Publish selected packages (Dry Run)
        if: github.event.inputs.dry-run == 'true'
        run: |
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            ver=$(pnpm --filter "$pkg" exec node -p "require('./package.json').version")
            echo "Dry-run publish: $pkg@$ver"
            pnpm --filter "$pkg" publish --dry-run --access public --no-git-checks
          done <<< "${{ steps.publish_mode.outputs.packages }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish selected packages
        if: >-
          startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry-run != 'true'
        run: |
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            ver=$(pnpm --filter "$pkg" exec node -p "require('./package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "Skipping already published $pkg@$ver"
              continue
            fi
            echo "Publishing: $pkg@$ver"
            pnpm --filter "$pkg" publish --access public --provenance --no-git-checks
          done <<< "${{ steps.publish_mode.outputs.packages }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease:
            ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') ||
            contains(github.ref_name, '-rc') }}
