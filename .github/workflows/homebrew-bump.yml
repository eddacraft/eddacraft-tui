# Homebrew tap recovery + macOS install smoke test.
#
# DISTRIB-003. Auto-publish on release tag is already wired into the inline
# "Publish Homebrew formula to eddacraft/homebrew-tap" step in release.yml,
# which after this change calls `scripts/release/bump-homebrew.sh`. This
# workflow exists for two purposes:
#
#   1. `workflow_dispatch` recovery: rerun the publish for a specific tag
#      when the inline release.yml step failed (token, transient 5xx, etc.).
#      See docs/runbooks/homebrew-publish.md.
#   2. Post-publish smoke install: install `eddacraft/tap/anvil` on macOS
#      arm64 + x64 runners and confirm the binary runs. Covers the
#      DISTRIB-003 validation "install from the tap on macOS arm64 and x64".
#
# Both surfaces also run a no-network dry-run of bump-homebrew.sh against a
# fixture so the script contract is exercised on every push to this file.

name: Homebrew — bump and smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. v0.7.0-beta'
        required: true
      tap-repo:
        description: 'Tap repo (default eddacraft/homebrew-tap)'
        required: false
        default: 'eddacraft/homebrew-tap'
      skip-publish:
        description: 'Skip the publish step (smoke + dry-run only)'
        required: false
        default: 'false'
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/homebrew-bump.yml'
      - 'scripts/release/bump-homebrew.sh'
      - 'scripts/release/_test/bump-homebrew.test.sh'

permissions:
  contents: read

concurrency:
  group: homebrew-bump-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Always-on contract check: dry-run the script against a synthetic formula
  # so the publish surface is verified on every PR that touches it, with no
  # network or secrets.
  dry-run:
    name: bump-homebrew.sh dry-run contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run unit tests
        run: bash scripts/release/_test/bump-homebrew.test.sh

      - name: CI dry-run on candidate SHA produces a valid formula
        run: |
          set -euo pipefail
          # Synthesise the cargo-dist output the release pipeline would
          # produce. Tag derives from the workflow input, the release tag,
          # or a synthetic value when this runs on a PR.
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v0.0.0-ci"; fi

          SRC="$RUNNER_TEMP/eddacraft-anvil.rb"
          OUT="$RUNNER_TEMP/anvil.rb"
          cat > "$SRC" <<RUBY
          class EddacraftAnvil < Formula
            desc "Save-time trust for AI-generated code"
            homepage "https://anvil.eddacraft.ai"
            version "${TAG#v}"
          end
          RUBY

          bash scripts/release/bump-homebrew.sh \
            --release-tag "$TAG" \
            --formula-source "$SRC" \
            --out "$OUT" \
            --publish \
            --tap-repo "eddacraft/homebrew-tap" \
            --dry-run

          grep -q '^class Anvil < Formula' "$OUT"
          echo "::notice::dry-run produced a valid formula for $TAG"

  # Recovery publish: rerun the publish step against an explicit tag.
  # Wired to workflow_dispatch only; the release-time auto-publish stays in
  # release.yml so it runs inside the existing cargo-dist host job's
  # artefact context.
  republish:
    name: Re-publish formula (workflow_dispatch)
    if:
      ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip-publish != 'true' }}
    runs-on: ubuntu-22.04
    needs: dry-run
    env:
      GH_TOKEN: ${{ secrets.ANVIL_RELEASES_TOKEN }}
      TAG: ${{ github.event.inputs.tag }}
      TAP_REPO: ${{ github.event.inputs.tap-repo }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify ANVIL_RELEASES_TOKEN is configured
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secrets.ANVIL_RELEASES_TOKEN is required to publish to the tap."
            echo "::error::See docs/runbooks/release-token-scope.md."
            exit 1
          fi

      - name: Download eddacraft-anvil.rb from the GitHub Release
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # The cargo-dist host job uploads eddacraft-anvil.rb to BOTH the
          # private (eddacraft/anvil-001) and public (eddacraft/anvil)
          # release. Prefer the public repo so this recovery path mirrors
          # what a user-facing install would resolve to.
          gh release download "$TAG" \
            --repo eddacraft/anvil \
            --pattern "eddacraft-anvil.rb" \
            --dir artifacts
          ls -la artifacts/

      - name: Patch and publish formula
        run: |
          set -euo pipefail
          bash scripts/release/bump-homebrew.sh \
            --release-tag "$TAG" \
            --formula-source "artifacts/eddacraft-anvil.rb" \
            --out "artifacts/anvil.rb" \
            --publish \
            --tap-repo "$TAP_REPO"

      - name: Summarise
        run: |
          {
            echo "## anvil Homebrew formula republished"
            echo
            echo "- tag: \`$TAG\`"
            echo "- tap: \`$TAP_REPO\`"
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  # Smoke install on macOS arm64 + x64. Runs after a real release publishes
  # (and after manual republish). Validates the DISTRIB-003 Expected
  # Outcome: "macOS arm64 and x64 install paths both produce a working
  # `anvil` binary".
  #
  # `needs: [dry-run, republish]` with `always()` accommodates both flows:
  # on `release` events, `republish` is skipped (the inline release.yml
  # step already published) so smoke must allow `skipped`; on
  # `workflow_dispatch`, smoke must wait for `republish` to succeed before
  # tapping.
  smoke:
    name: brew install eddacraft/tap/anvil (${{ matrix.runner }})
    if: |
      always()
      && needs.dry-run.result == 'success'
      && (needs.republish.result == 'success' || needs.republish.result == 'skipped')
      && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-publish != 'true'))
    needs: [dry-run, republish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # arm64
            arch: arm64
          - runner: macos-13 # x86_64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: brew tap eddacraft/tap
        run: brew tap eddacraft/tap https://github.com/eddacraft/homebrew-tap

      - name: brew install eddacraft/tap/anvil
        run: brew install --verbose eddacraft/tap/anvil

      - name: Confirm anvil runs and reports the published version
        run: |
          set -euo pipefail
          which anvil
          file "$(which anvil)"
          anvil --version
          # Tags look like v0.7.0-beta; the binary reports 0.7.0-beta.
          EXPECTED="${TAG#v}"
          ACTUAL="$(anvil --version | awk '{print $NF}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::installed anvil reports $ACTUAL but tag is $EXPECTED"
            exit 1
          fi
          echo "::notice::anvil $ACTUAL installed cleanly on ${{ matrix.arch }}"

      - name: Confirm a basic command exits cleanly
        run: anvil --help
