name: CI Cost Report

on:
  schedule:
    # Weekly, offset from other scheduled assurance workflows.
    - cron: '15 7 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of recent workflow runs to inspect. Capped by the script.'
        required: false
        default: '200'
      include_jobs:
        description: 'Fetch per-job timings. Slower but more precise.'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-cost-report
  cancel-in-progress: true

jobs:
  report:
    name: Generate CI cost report
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate report
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '200' }}
          INCLUDE_JOBS: ${{ inputs.include_jobs || 'false' }}
        run: |
          set -euo pipefail
          include_jobs="$INCLUDE_JOBS"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            include_jobs=true
          fi
          args=(--limit "$LIMIT")
          if [ "$include_jobs" = "true" ]; then
            args+=(--jobs)
          fi
          bash scripts/ci/cost-report.sh "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
