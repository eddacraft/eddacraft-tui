name: Council Gate

# Server-side enforcement for the CIB-149 process guard: a PR that changes a
# protected save-time auth/confinement surface must carry the `council:reviewed`
# label (applied by a maintainer after running `/council`) before it can merge.
# This is the merge-time backstop to the local `.claude/hooks/council-gate.sh`
# hook — it holds even when an autonomous workflow bypasses local hooks (the
# CIB-149 failure mode).
#
# The job ALWAYS runs (no top-level `paths:` filter) so it reports a status on
# every PR and can be marked a required check without deadlocking PRs that do
# not touch protected paths. When nothing protected changed, it passes at once.
#
# Stale-review safety: same-repository PR labels are dismissed by an API-only
# job whenever commits are pushed or the PR base changes. The required gate is
# read-only and accepts the label only from its first matching `labeled` event
# while that event's head is still the live PR head.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: council-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dismiss-stale-review:
    name: Dismiss stale Council review
    if: >-
      github.event.pull_request.head.repo.fork == false && (github.event.action == 'synchronize' ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GATE_LABEL: council:reviewed
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Dismiss stale review label
        shell: bash
        run: |
          set -euo pipefail
          # This job deliberately uses only the GitHub API. It neither checks
          # out nor executes code controlled by the pull request.
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if grep -Fxq "$GATE_LABEL" <<<"$CURRENT_LABELS"; then
            echo "PR commits or base changed — dismissing stale '$GATE_LABEL' label."
            # A 404 ("Label does not exist") means it is already gone (fine);
            # any other failure is fatal so we never silently keep the label.
            if ! gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${GATE_LABEL}" >/dev/null 2>err.txt; then
              if ! grep -qi 'does not exist' err.txt; then
                echo "::error::Could not dismiss stale '$GATE_LABEL' label — failing closed."
                cat err.txt
                exit 1
              fi
            fi
            UPDATED_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
            if grep -Fxq "$GATE_LABEL" <<<"$UPDATED_LABELS"; then
              echo "::error::'$GATE_LABEL' still present after dismissal — failing closed."
              exit 1
            fi
          fi

  council-gate:
    name: Protected surfaces reviewed
    needs: dismiss-stale-review
    if: always()
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GATE_LABEL: council:reviewed
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base commit to diff the PR range

      - name: Gate protected-path changes on Council review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Files introduced by the PR (three-dot = changes since the merge base).
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if (( ${#changed[@]} == 0 )); then
            echo "No changed files detected."
            exit 0
          fi

          # Protected globs = the repo's declared list + the guard's own config
          # and this workflow (so the gate cannot be disabled without a review).
          protected_globs=(
            ".claude/hooks/council-protected-paths"
            ".github/workflows/council-gate.yml"
          )
          list_file=".claude/hooks/council-protected-paths"
          if [[ -f "$list_file" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"                        # strip trailing comment
              line="${line#"${line%%[![:space:]]*}"}"   # ltrim
              line="${line%"${line##*[![:space:]]}"}"   # rtrim
              [[ -n "$line" ]] && protected_globs+=("$line")
            done < "$list_file"
          fi

          path_is_protected() { # $1 = repo-relative path
            local path="$1" glob
            for glob in "${protected_globs[@]}"; do
              if [[ "$glob" == */ && "$path" == "$glob"* ]]; then return 0; fi
              # shellcheck disable=SC2053
              if [[ "$path" == $glob ]]; then return 0; fi
              if [[ "$path" == "$glob"/* ]]; then return 0; fi
            done
            return 1
          }

          hits=()
          for f in "${changed[@]}"; do
            [[ -z "$f" ]] && continue
            if path_is_protected "$f"; then hits+=("$f"); fi
          done

          if (( ${#hits[@]} == 0 )); then
            echo "✅ No protected auth/confinement surfaces changed — gate not required."
            exit 0
          fi

          echo "This PR changes protected auth/confinement surfaces:"
          printf '  - %s\n' "${hits[@]}"

          # Bind approval evidence to the current PR revision. `set -e` makes
          # an API/query failure fatal; a head pushed concurrently also fails
          # closed instead of accepting evidence for the stale event payload.
          LIVE_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          if ! [[ "$LIVE_HEAD_SHA" == "$HEAD_SHA" ]]; then
            echo "::error::PR head changed during Council validation — failing closed."
            exit 1
          fi

          # A pre-existing label is insufficient. Only the actual first event
          # that added the gate label to this exact head may pass.
          if ! [[ "$EVENT_ACTION" == "labeled" ]] ||
            ! [[ "$EVENT_LABEL" == "$GATE_LABEL" ]] ||
            ! [[ "$RUN_ATTEMPT" == "1" ]]; then
            echo "::error::Council evidence must be freshly labelled for this head."
            exit 1
          fi

          # Re-read labels live (the event payload is stale after a dismissal).
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if grep -Fxq "$GATE_LABEL" <<<"$CURRENT_LABELS"; then
            echo ""
            echo "✅ '$GATE_LABEL' label present — Council review recorded for this diff."
            exit 0
          fi

          echo ""
          echo "❌ Protected surfaces changed without a recorded Council review."
          echo "   These paths are the same-uid save-time trust boundary."
          echo "   Run a full Council review (\`/council full $PR_NUMBER\`) and have a"
          echo "   maintainer apply the '$GATE_LABEL' label. The label is dismissed"
          echo "   automatically on new commits, so the review must cover the final diff."
          exit 1
