name: Acknowledgements Autofix

# Dependabot's cargo bumps only touch Cargo.lock — they never run
# tools/starters/acknowledgements/generate-acknowledgements.sh, so the
# `Acknowledgements freshness` check in rust.yml (acknowledgements-diff)
# fails on every single cargo version bump for the one crate it moved.
# This workflow closes that gap by regenerating ACKNOWLEDGEMENTS.md and
# pushing the fix straight onto the Dependabot branch.
#
# Triggered via `workflow_run` rather than `pull_request_target`:
# GitHub gives `pull_request` runs from Dependabot a read-only
# GITHUB_TOKEN with no secrets, so acknowledgements-diff cannot push a
# fix itself. `workflow_run` always executes the workflow file from
# the default branch with normal `permissions:`, regardless of what
# triggered the upstream run — so it can push — while never executing
# anything the PR proposes beyond the identical read-only `npm ci
# --ignore-scripts` + regen commands acknowledgements-diff already ran.
# It only pushes if that regen actually produces a diff.
#
# The push itself must use a PAT, not GITHUB_TOKEN: GitHub does not
# start new workflow runs from events caused by GITHUB_TOKEN (to
# prevent recursive triggering), so a GITHUB_TOKEN push would update
# the Dependabot branch but never retrigger `Rust` on
# `pull_request: synchronize` — the PR would be left with no fresh
# check runs at all for the new commit. `DEPENDABOT_AUTOFIX_TOKEN` is
# a fine-grained PAT scoped to `Contents: Read and write` on this repo
# only (no cross-repo scope, unlike MIRROR_PUSH_TOKEN /
# ANVIL_RELEASES_TOKEN, which are scoped to other repos entirely).

on:
  workflow_run:
    workflows: ['Rust'] # must match rust.yml's top-level `name:`
    types: [completed]

permissions:
  contents: read

concurrency:
  group: acknowledgements-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # Keep in sync with rust.yml's acknowledgements-diff job.
  CARGO_ABOUT_VERSION: '0.8.4'

jobs:
  autofix:
    name: Regenerate ACKNOWLEDGEMENTS.md on Dependabot branch
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event ==
      'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/cargo/')
    steps:
      - name: Require DEPENDABOT_AUTOFIX_TOKEN
        env:
          AUTOFIX_TOKEN: ${{ secrets.DEPENDABOT_AUTOFIX_TOKEN }}
        run: |
          if [ -z "${AUTOFIX_TOKEN:-}" ]; then
            echo "::error::secrets.DEPENDABOT_AUTOFIX_TOKEN is required to push fixes back to Dependabot branches (a GITHUB_TOKEN push would not retrigger Rust's required checks)." >&2
            exit 1
          fi
      # The PAT is deliberately NOT passed to `checkout`: `token:` implies
      # `persist-credentials: true`, which writes a `Contents: write`
      # credential into `.git/config` for the rest of the job — i.e. while
      # the steps below run `npm ci` and the regen script out of the
      # checked-out tree. The default `GITHUB_TOKEN` is enough to read the
      # ref; the PAT is scoped to the single push step that needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install cargo-about
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Same recipe as rust.yml's acknowledgements-diff job: the
      # `node-devtools` attribution block needs license-checker on
      # PATH via tools/dev's own lockfile.
      - name: Install tools/dev devtools (for ATTRIB-015 Node attribution)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: cd tools/dev && npm ci --no-audit --no-fund --ignore-scripts
      - name: Regenerate ACKNOWLEDGEMENTS.md
        run: |
          export PATH="$GITHUB_WORKSPACE/tools/dev/node_modules/.bin:$PATH"
          tools/starters/acknowledgements/generate-acknowledgements.sh --config attribution/attribution.toml
      # `head_branch` reaches the shell through the environment, never
      # through `${{ }}` interpolation into the script body: git ref names
      # permit `(`, `)` and backticks, so a branch name spliced into `run:`
      # is a command-injection sink even behind the `startsWith` job gate.
      - name: Push fix if the regen changed anything
        env:
          AUTOFIX_TOKEN: ${{ secrets.DEPENDABOT_AUTOFIX_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- ACKNOWLEDGEMENTS.md; then
            echo "No drift after regen; the upstream failure wasn't ACKNOWLEDGEMENTS.md staleness."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ACKNOWLEDGEMENTS.md
          git commit -m "chore(attribution): regen ACKNOWLEDGEMENTS.md"
          # Auth via http.extraheader Basic auth — the URL-embedded
          # `x-access-token:${TOKEN}@github.com` form is fragile to stray
          # bytes in the credential (CURLE_URL_MALFORMAT). Matches the
          # pattern already used by publish-eddacraft-tui.yml.
          basic=$(printf '%s' "x-access-token:${AUTOFIX_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${basic}" \
              push \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/${HEAD_BRANCH}"
