      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          components: rustfmt
      - uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1

  cross-compile:
    name: Cross (${{ matrix.target }})
    # Only run cross-compilation on PRs targeting main or pushes to main.
    # Feature branch PRs get check + test + clippy + format only.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name ==
      'pull_request' && github.base_ref == 'main')
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: false
          - target: x86_64-apple-darwin
            os: macos-latest
            can_test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            can_test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            can_test: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            can_test: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.can_test
        run: cargo test --workspace --target ${{ matrix.target }} -- --test-threads=1
