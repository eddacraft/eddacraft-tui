name: Rust

on:
  push:
    branches: [main, 'rust-*', 'release/*']
    paths:
      - 'crates/**'
      - 'packages/anvil-checks-native/native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'dist-workspace.toml'
      - 'rust-toolchain.toml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/actions/free-disk-space/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/anvil-checks-native/native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'dist-workspace.toml'
      - 'rust-toolchain.toml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/actions/free-disk-space/**'
      - '.github/workflows/rust.yml'
  # CICD-008: explicit operator path to run the cross-compile matrix
  # against any ref (release-gate dry runs, post-incident verification,
  # release-candidate hand-validation).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned so nextest behaviour (retry/timeout/output) is reproducible.
  CARGO_NEXTEST_VERSION: '0.9.133'
  # RUSTNX-008/009: pinned hakari/deny/about versions — see
  # Task 1 of the RUSTNX completion plan for how to rev them.
  CARGO_HAKARI_VERSION: '0.9.38'
  CARGO_DENY_VERSION: '0.19.4'
  CARGO_ABOUT_VERSION: '0.8.4'

jobs:
  # Cheap path-classification job so cross-compile (the heaviest matrix in
  # this workflow — Windows + macOS runners, six targets) only fires when
  # actual Rust files change. The workflow-level `paths:` filter still
  # includes `pnpm-lock.yaml` etc. because Test/Clippy/Build use Nx targets
  # that depend on the lockfile; this per-job gate scopes cross-compile
  # specifically to Rust-touching diffs. See PR #1325 for the dev-branch
  # trigger this complements.
  detect-rust-changes:
    name: Detect Rust Changes
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    # `pull-requests: read` lets `dorny/paths-filter` query the PR diff via
    # the GitHub API on PR events; without it the action returns "Resource
    # not accessible by integration" because the workflow-level
    # `permissions:` block only grants `contents: read`. The fetch-depth: 0
    # checkout below additionally lets the action fall back to git diff on
    # push events, where there's no PR API to query.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-changed: ${{ steps.filter.outputs.rust }}
      # CICD-007: `rust-deps-changed` narrows dependency-only Rust signals
      # (Cargo manifests + lockfile) so cargo-deny and the acknowledgements
      # regeneration only fire when something the dependency graph cares
      # about actually moved. Pure crate source changes do not flip it.
      rust-deps-changed: ${{ steps.filter.outputs.rust-deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'packages/anvil-checks-native/native/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'dist-workspace.toml'
              - 'rust-toolchain.toml'
              - '.github/actions/free-disk-space/**'
              - '.github/workflows/rust.yml'
            rust-deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - 'dist-workspace.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/rust.yml'

  nxrust-smoke:
    name: nxrust Smoke
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Run nxrust check smoke
        run: pnpm exec nx run eddacraft-anvil-policy:check --skip-nx-cache --outputStyle=static

  check:
    name: Check
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Setup workspace for Nx affected
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-workspace
      - name: Detect Rust Nx projects
        if: github.event_name == 'pull_request'
        id: rust-projects
        shell: bash
        run: |
          echo "all=$(pnpm exec nx show projects --withTarget=check --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "affected=$(pnpm exec nx show projects --affected --withTarget=check --base="origin/${{ github.base_ref }}" --head="$GITHUB_SHA" --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          # GitHub cache keys are write-once, so with a shared-key only the
          # first job to finish actually saves. Restore-only here lets the
          # test job (the most comprehensive one) populate the cache.
          save-if: 'false'
      - name: Run check (affected on PRs, all on push)
        env:
          AFFECTED_RUST_PROJECTS: ${{ steps.rust-projects.outputs.affected }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            if [ -z "$AFFECTED_RUST_PROJECTS" ]; then
              echo "No affected Rust projects detected"
              exit 0
            fi
            pnpm exec nx run-many -t check --projects="$AFFECTED_RUST_PROJECTS" --outputStyle=static
          else
            cargo check --workspace --all-targets
          fi

  clippy:
    name: Clippy
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # CIB-193: close the cross-target cfg gap. `clippy` above is Linux-only, the
  # `cross-compile` matrix is release/hotfix/dispatch-gated, and the nightly
  # cross job is build-only — so a binding that is dead under `cfg(windows)`
  # (the PR #3290 / #3297 bug class) could not fail a normal PR. It surfaced a
  # day later in a nightly, or at the release gate.
  #
  # This is deliberately ONE check-only job on ONE Windows target, not a second
  # matrix: clippy emits metadata and never links, so it costs a fraction of
  # `cross-compile` while catching the whole `-D warnings` cfg class. Per the
  # CI-cost posture, it is gated on `detect-rust-changes` so JS-only PRs (e.g.
  # lockfile bumps that the workflow `paths:` filter still admits) do not spin
  # up a Windows runner.
  clippy-windows:
    name: Clippy (windows-msvc)
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          needs.detect-rust-changes.result == 'success' &&
          needs.detect-rust-changes.outputs.rust-changed == 'true')
      )
    needs: detect-rust-changes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci-windows
      # `--all-targets` is what makes this work: the dead bindings that started
      # this were in a test file, so a lib-only check would have missed them.
      - name: Run clippy for x86_64-pc-windows-msvc
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  doc:
    name: Doc
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      # CIB-030: PR-side rustdoc gate mirroring the publish-eddacraft-tui.yml
      # doc gate (`-p eddacraft-tui --all-features`, RUSTDOCFLAGS=-D warnings),
      # so feature-gated rustdoc regressions (broken_intra_doc_links and the
      # like) fail at PR review instead of at the publish run — the recurrence
      # surface from incident run 26549955604.
      - name: cargo doc --no-deps -p eddacraft-tui --all-features
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --no-deps -p eddacraft-tui --all-features

  format:
    name: Format
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Setup workspace for Nx affected
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-workspace
      - name: Detect Rust Nx projects
        if: github.event_name == 'pull_request'
        id: rust-projects
        shell: bash
        run: |
          echo "all=$(pnpm exec nx show projects --withTarget=check --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "affected=$(pnpm exec nx show projects --affected --withTarget=check --base="origin/${{ github.base_ref }}" --head="$GITHUB_SHA" --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Run rustfmt check (affected on PRs)
        if: github.event_name == 'pull_request'
        env:
          AFFECTED_RUST_PROJECTS: ${{ steps.rust-projects.outputs.affected }}
        run: |
          if [ -z "$AFFECTED_RUST_PROJECTS" ]; then
            echo "No affected Rust projects detected"
            exit 0
          fi
          pnpm exec nx run-many -t fmt-check --projects="$AFFECTED_RUST_PROJECTS" --outputStyle=static
      - uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1
        if: github.event_name != 'pull_request'

  hakari:
    name: Hakari verify
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Install cargo-hakari
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-hakari@${{ env.CARGO_HAKARI_VERSION }}
      - name: Verify workspace-hack manifest is current
        # `generate --diff` first so CI logs show what drifted; `verify`
        # then enforces (exit 1) if the manifest is stale.
        run: |
          cargo hakari generate --diff
          cargo hakari verify

  deny:
    name: cargo-deny
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: [check, detect-rust-changes]
    # CICD-007: only run cargo-deny when something dependency-relevant
    # moved (manifests, lockfile, toolchain, or this workflow file).
    if: needs.detect-rust-changes.outputs.rust-deps-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Install cargo-deny
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Run cargo deny check
        run: cargo deny check --config attribution/deny.toml

  acknowledgements-diff:
    name: Acknowledgements freshness
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: [check, detect-rust-changes]
    # CICD-007: ACKNOWLEDGEMENTS.md only needs regen when the dependency
    # graph changes; pure source edits cannot drift it.
    if: needs.detect-rust-changes.outputs.rust-deps-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Install cargo-about
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      # ATTRIB-012: Node driver tests need Node + npm (render + strict
      # tests `npm install` license-checker into a per-test fixture).
      # Even when only Rust deps change in this PR, we still want the
      # Node driver to be exercised so a dep-only change can't silently
      # break a different driver's contract.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Match root package.json's `engines.node` (>=22.13.0).
          node-version: '22'
      # ATTRIB-015: Anvil's own `node-devtools` attribution block in
      # `attribution.toml` points the Node driver at
      # `tools/dev/package.json`. The driver needs `license-checker`
      # on PATH, and the curated `tools/dev` manifest declares it as
      # a devDep. `tools/dev` is excluded from `pnpm-workspace.yaml`
      # (pnpm hoisting otherwise resolves a `glob` major that's
      # incompatible with license-checker@25.0.1's `read-package-json`
      # transitive), so we `npm ci` it directly. Subsequent steps
      # prepend its `node_modules/.bin` to PATH.
      #
      # --ignore-scripts skips lifecycle scripts (notably Playwright's
      # postinstall browser download — hundreds of MB we don't need
      # for attribution). PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD belt-and-
      # braces in case a future dep's postinstall slips past
      # --ignore-scripts.
      - name: Install tools/dev devtools (for ATTRIB-015 Node attribution)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: cd tools/dev && npm ci --no-audit --no-fund --ignore-scripts
      - name: Regenerate ACKNOWLEDGEMENTS.md and fail on drift
        run: |
          export PATH="$GITHUB_WORKSPACE/tools/dev/node_modules/.bin:$PATH"
          if ! tools/starters/acknowledgements/generate-acknowledgements.sh --config attribution/attribution.toml --check; then
            echo "::error::ACKNOWLEDGEMENTS.md is stale. Run 'tools/starters/acknowledgements/generate-acknowledgements.sh --config attribution/attribution.toml' locally and commit."
            exit 1
          fi
      # ATTRIB-007 regression guard: a missing-`license`-field crate
      # must trip cargo-about's strict mode (`--fail`) rather than
      # silently drop out of the generated attribution. The fixture
      # test stands up a throwaway workspace with one non-compliant
      # member and asserts the strict diagnostic fires.
      - name: Strict license-field regression test
        run: tools/starters/acknowledgements/tests/strict-license-field.sh
      # ATTRIB-006: catch drift between licences.toml and every
      # consumer file (about.toml.accepted, deny.toml.[licenses].allow,
      # ATTRIB-012 licences.node-allow.txt when present).
      - name: Licences single-source drift check
        run:
          tools/starters/acknowledgements/expand-licences.sh --config attribution/licences.toml
          --check
      # ATTRIB-006/-012 regression guard: the drift detector itself
      # must actually detect drift. Four-scenario fixture test pins
      # the contract so a regression that loosens the matcher is
      # caught.
      - name: Licences drift detector self-test
        run: tools/starters/acknowledgements/tests/licences-drift.sh
      # ATTRIB-012 Node driver: preflight (no npm install needed),
      # render (two-package fixture round-trip + idempotency +
      # --check), strict (disallowed-licence rejection + on-disk
      # target byte-identicality).
      - name: Node driver preflight test
        run: tools/starters/acknowledgements/tests/node-driver-preflight.sh
      - name: Node driver render test
        run: tools/starters/acknowledgements/tests/node-driver-render.sh
      - name: Node driver strict test
        run: tools/starters/acknowledgements/tests/node-driver-strict.sh

  # #1438 follow-up: collapse the six-leg fail-loud pattern (one
  # `::error::` per matrix target on detect-rust-changes failure) into
  # a single named gate job. The PR check UI then shows ONE red
  # `Cross-compile detection gate` instead of six identically-failing
  # `Cross (target)` legs that mislead 2am triage into looking at Rust
  # compilation. `cross-compile` depends on the gate (plus `check`),
  # so detect-rust-changes failure now skips the matrix instead of
  # spinning it up just to fail in setup.
  cross-compile-gate:
    name: Cross-compile detection gate
    # Skip on `workflow_dispatch` — operators may dispatch against any
    # ref, with or without a healthy change-detection signal. The gate
    # is the safety net for trigger-driven runs only.
    if: always() && github.event_name != 'workflow_dispatch'
    needs: detect-rust-changes
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Fail if Rust-change detection failed
        if: needs.detect-rust-changes.result != 'success'
        run: |
          echo "::error::detect-rust-changes did not complete (result=${{ needs.detect-rust-changes.result }}); refusing to run the cross-compile matrix in an unknown change-detection state. Re-run the workflow once detection is healthy, or use \`workflow_dispatch\` to bypass."
          exit 1

  cross-compile:
    name: Cross (${{ matrix.target }})
    # Run cross-compilation (incl. the Windows matrix) on release-gate
    # events only: release-class PR-to-`main`, push to a `release/*`
    # branch, and `workflow_dispatch` for operator-triggered
    # verification. Normal feat/fix/docs/chore PRs stay on the fast
    # Rust check/test/clippy/format path. Per CICD-008 platform
    # matrices are reserved for release-sensitive paths, nightly
    # assurance, and explicit dispatch.
    #
    # CI-cost 2026-07: pushes to `main` no longer fire this matrix. At
    # ~90 merges/day the per-merge macOS (10x) + Windows (2x) legs were
    # the single largest billable-minute line in the repo; the same
    # six-target matrix now runs nightly in `ci-nightly.yml`
    # (`cross-compile` job) plus on the release-class events above, so
    # cross-platform breakage on `main` surfaces within a day instead
    # of per merge.
    #
    # The head allowlist on PR-to-`main` keeps the cross-compile matrix
    # from firing on every normal post-cutover PR; only `release/*` and
    # `hotfix/*` head patterns do. The `head.repo.full_name ==
    # github.repository` clause makes the gate self-defending: a fork
    # PR cannot trigger the six-target cross-compile matrix by naming
    # its head `release/*` / `hotfix/*`.
    #
    # Additionally gate on `detect-rust-changes` so JS-only diffs (e.g.
    # dependabot pnpm-lock bumps that the workflow-level `paths:` filter
    # still admits, because Test/Clippy depend on the lockfile) don't
    # spin up the Windows + macOS matrix. Rust-only signals — `crates/**`,
    # `Cargo.toml`, `Cargo.lock`, `rust-toolchain.toml`, and this workflow
    # file itself — still fire cross-compile. `workflow_dispatch` is
    # intentionally exempt from the rust-changed gate so operators can
    # force a matrix run for verification work even when no Rust paths
    # moved in the dispatched ref.
    #
    # CICD-011 cycle-2 council: scope the override so a `detect-rust-
    # changes` failure fails-loud (now via `cross-compile-gate`) but a
    # `check` failure still skips the matrix (cycle-1 regression). The
    # plain `always()` from cycle-1 overrode GitHub's default skip-on-
    # needs-failure for *all* `needs:` jobs — including `check` — so a
    # broken `cargo check --workspace` on a `main` push spun up six
    # matrix legs before failing in setup. The conditional below
    # admits the matrix only when both `check` and `cross-compile-gate`
    # report `success`. `workflow_dispatch` bypasses both guards —
    # operators may run the matrix without `check` (the dispatch entry
    # point in rust.yml has no `needs:` resolution from a normal
    # trigger event).
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.check.result == 'success' &&
          needs.cross-compile-gate.result == 'success' &&
          (
            (
              (github.event_name == 'push' &&
                startsWith(github.ref, 'refs/heads/release/')) ||
              (github.event_name == 'pull_request' && github.base_ref == 'main' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                (startsWith(github.head_ref, 'release/') ||
                 startsWith(github.head_ref, 'hotfix/')))
            ) &&
            needs.detect-rust-changes.outputs.rust-changed == 'true'
          )
        )
      )
    runs-on: ${{ matrix.os }}
    needs: [check, detect-rust-changes, cross-compile-gate]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: false
          - target: x86_64-apple-darwin
            os: macos-latest
            can_test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            can_test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            can_test: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            can_test: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install OPA
        if: matrix.can_test
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v1.16.1

      - name: Verify OPA version
        if: matrix.can_test
        shell: bash
        env:
          EXPECTED_OPA_VERSION: '1.16.1'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.can_test
        # `--no-fail-fast` so a failure in one test binary does not mask
        # failures in later binaries — surfaces every platform-specific
        # failure in a single run instead of one binary at a time.
        run: cargo test --workspace --target ${{ matrix.target }} --no-fail-fast -- --test-threads=1
