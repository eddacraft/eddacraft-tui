name: Rust

on:
  push:
    branches: [main, dev, 'rust-*', 'release/*']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/nx-rust/**'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/nx-rust/**'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned so cache invalidation is intentional when we bump this.
  CARGO_LLVM_COV_VERSION: '0.6.14'
  # Pinned so nextest behaviour (retry/timeout/output) is reproducible.
  CARGO_NEXTEST_VERSION: '0.9.133'
  # RUSTNX-008/009: pinned hakari/deny/about versions — see
  # Task 1 of the RUSTNX completion plan for how to rev them.
  CARGO_HAKARI_VERSION: '0.9.37'
  CARGO_DENY_VERSION: '0.19.4'
  CARGO_ABOUT_VERSION: '0.8.4'

jobs:
  # Cheap path-classification job so cross-compile (the heaviest matrix in
  # this workflow — Windows + macOS runners, six targets) only fires when
  # actual Rust files change. The workflow-level `paths:` filter still
  # includes `pnpm-lock.yaml` etc. because Test/Clippy/Build use Nx targets
  # that depend on the lockfile; this per-job gate scopes cross-compile
  # specifically to Rust-touching diffs. See PR #1325 for the dev-branch
  # trigger this complements.
  detect-rust-changes:
    name: Detect Rust Changes
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # `pull-requests: read` lets `dorny/paths-filter` query the PR diff via
    # the GitHub API on PR events; without it the action returns "Resource
    # not accessible by integration" because the workflow-level
    # `permissions:` block only grants `contents: read`. The fetch-depth: 0
    # checkout below additionally lets the action fall back to git diff on
    # push events, where there's no PR API to query.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tools/nx-rust/**'
              - '.github/workflows/rust.yml'

  nxrust-smoke:
    name: nxrust Smoke
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      - name: Run nxrust check smoke
        run: pnpm exec nx run eddacraft-anvil-policy:check --skip-nx-cache --outputStyle=static

  check:
    name: Check
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup workspace for Nx affected
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-workspace
      - name: Detect Rust Nx projects
        if: github.event_name == 'pull_request'
        id: rust-projects
        shell: bash
        run: |
          echo "all=$(pnpm exec nx show projects --withTarget=check --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "affected=$(pnpm exec nx show projects --affected --withTarget=check --base="origin/${{ github.base_ref }}" --head="$GITHUB_SHA" --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          # GitHub cache keys are write-once, so with a shared-key only the
          # first job to finish actually saves. Restore-only here lets the
          # test job (the most comprehensive one) populate the cache.
          save-if: 'false'
      - name: Run check (affected on PRs, all on push)
        env:
          AFFECTED_RUST_PROJECTS: ${{ steps.rust-projects.outputs.affected }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            if [ -z "$AFFECTED_RUST_PROJECTS" ]; then
              echo "No affected Rust projects detected"
              exit 0
            fi
            pnpm exec nx run-many -t check --projects="$AFFECTED_RUST_PROJECTS" --outputStyle=static
          else
            cargo check --workspace --all-targets
          fi

  test:
    name: Test
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup workspace for Nx affected
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-workspace
      - name: Detect Rust Nx projects
        if: github.event_name == 'pull_request'
        id: rust-projects
        shell: bash
        run: |
          echo "all=$(pnpm exec nx show projects --withTarget=check --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "affected=$(pnpm exec nx show projects --affected --withTarget=check --base="origin/${{ github.base_ref }}" --head="$GITHUB_SHA" --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

      # Run the pin guard before any expensive setup so a stray version
      # reference fails fast without burning toolchain install time.
      # Invoke via `sh` so this doesn't depend on the executable bit surviving
      # checkout (e.g. on Windows runners / some git configurations).
      - name: Check OPA version pin is not duplicated outside allowlist
        run: sh scripts/check-opa-version-pin.sh

      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v0.60.0

      - name: Verify OPA version
        env:
          EXPECTED_OPA_VERSION: '0.60.0'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Install Regal
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: latest

      - name: Run OPA policy tests
        run: opa test --verbose policies/fixtures/

      - name: Lint policies with Regal
        run: regal lint --format github policies/fixtures/

      - name: Run tests (affected on PRs, full coverage on push)
        if: github.event_name == 'pull_request'
        env:
          AFFECTED_RUST_PROJECTS: ${{ steps.rust-projects.outputs.affected }}
        run: |
          if [ -z "$AFFECTED_RUST_PROJECTS" ]; then
            echo "No affected Rust projects detected"
            exit 0
          fi
          pnpm exec nx run-many -t test --projects="$AFFECTED_RUST_PROJECTS" --outputStyle=static

      - name: Cache cargo-llvm-cov
        if: github.event_name != 'pull_request'
        id: cache-llvm-cov
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          # Version-scoped key so bumping CARGO_LLVM_COV_VERSION below
          # invalidates the cache deterministically rather than serving a
          # stale pre-upgrade binary forever.
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-llvm-cov
        if: github.event_name != 'pull_request' && steps.cache-llvm-cov.outputs.cache-hit != 'true'
        # TODO: swap to taiki-e/install-action@<verified-sha> for faster install
        run: cargo install cargo-llvm-cov --locked --version ${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-nextest
        if: github.event_name != 'pull_request'
        uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2.77.1
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Run tests with coverage (nextest)
        if: github.event_name != 'pull_request'
        run: |
          cargo llvm-cov nextest --workspace --json --output-path coverage-rust.json
          cargo llvm-cov report --html --output-dir target/llvm-cov
          cargo llvm-cov report --summary-only | tee coverage-rust-summary.txt

      # nextest does not run doctests, so we run them separately to preserve
      # the same test surface as the pre-RUSTNX-002 `cargo test` invocation.
      # `if: always()` so doctest failures surface even if the coverage step
      # failed — we want both signals, not a short-circuit.
      - name: Run doctests
        if: always()
        run: cargo test --doc --workspace

      - name: Rust coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Rust Coverage"
            echo
            echo '<details><summary>Per-file / workspace summary (cargo llvm-cov)</summary>'
            echo
            echo '```'
            if [ -f coverage-rust-summary.txt ]; then
              cat coverage-rust-summary.txt
            else
              echo "(coverage summary not produced — cargo llvm-cov step failed)"
            fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-rust
          path: |
            coverage-rust.json
            coverage-rust-summary.txt
            target/llvm-cov/html/

  clippy:
    name: Clippy
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup workspace for Nx affected
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-workspace
      - name: Detect Rust Nx projects
        if: github.event_name == 'pull_request'
        id: rust-projects
        shell: bash
        run: |
          echo "all=$(pnpm exec nx show projects --withTarget=check --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "affected=$(pnpm exec nx show projects --affected --withTarget=check --base="origin/${{ github.base_ref }}" --head="$GITHUB_SHA" --json | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Run rustfmt check (affected on PRs)
        if: github.event_name == 'pull_request'
        env:
          AFFECTED_RUST_PROJECTS: ${{ steps.rust-projects.outputs.affected }}
        run: |
          if [ -z "$AFFECTED_RUST_PROJECTS" ]; then
            echo "No affected Rust projects detected"
            exit 0
          fi
          pnpm exec nx run-many -t fmt-check --projects="$AFFECTED_RUST_PROJECTS" --outputStyle=static
      - uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1
        if: github.event_name != 'pull_request'

  hakari:
    name: Hakari verify
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    needs: check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Install cargo-hakari
        uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2.77.1
        with:
          tool: cargo-hakari@${{ env.CARGO_HAKARI_VERSION }}
      - name: Verify workspace-hack manifest is current
        # `generate --diff` first so CI logs show what drifted; `verify`
        # then enforces (exit 1) if the manifest is stale.
        run: |
          cargo hakari generate --diff
          cargo hakari verify

  deny:
    name: cargo-deny
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    needs: check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Install cargo-deny
        uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2.77.1
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Run cargo deny check
        run: cargo deny check

  acknowledgements-diff:
    name: Acknowledgements freshness
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    needs: check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'
      - name: Install cargo-about
        uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2.77.1
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Regenerate ACKNOWLEDGEMENTS.md and fail on drift
        run: |
          if ! tools/starters/acknowledgements/generate-acknowledgements.sh --check; then
            echo "::error::ACKNOWLEDGEMENTS.md is stale. Run 'tools/starters/acknowledgements/generate-acknowledgements.sh' locally and commit."
            exit 1
          fi

  cross-compile:
    name: Cross (${{ matrix.target }})
    # Run cross-compilation (incl. the Windows matrix) on pushes to main
    # and dev, and on PRs targeting either branch. Feature-branch PRs
    # still skip this job — coverage scales with the integration target,
    # not with every transient feature branch.
    #
    # Additionally gate on `detect-rust-changes` so JS-only diffs (e.g.
    # dependabot pnpm-lock bumps that the workflow-level `paths:` filter
    # still admits, because Test/Clippy depend on the lockfile) don't
    # spin up the Windows + macOS matrix. Rust-only signals — `crates/**`,
    # `Cargo.toml`, `Cargo.lock`, `rust-toolchain.toml`, `tools/nx-rust/**`,
    # and this workflow file itself — still fire cross-compile.
    if: >-
      ((github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/dev"]'),
      github.ref)) || (github.event_name == 'pull_request' && contains(fromJSON('["main", "dev"]'),
      github.base_ref))) && needs.detect-rust-changes.outputs.rust-changed == 'true'
    runs-on: ${{ matrix.os }}
    needs: [check, detect-rust-changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: false
          - target: x86_64-apple-darwin
            os: macos-latest
            can_test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            can_test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            can_test: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            can_test: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install OPA
        if: matrix.can_test
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v0.60.0

      - name: Verify OPA version
        if: matrix.can_test
        shell: bash
        env:
          EXPECTED_OPA_VERSION: '0.60.0'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.can_test
        run: cargo test --workspace --target ${{ matrix.target }} -- --test-threads=1
