name: Editor Coexistence

on:
  push:
    branches: [main]
    paths:
      - 'crates/anvil-cli/**'
      - 'crates/anvil-kernel/**'
      - 'crates/anvil-hook/**'
      - 'docs/policies/editor-coexistence.md'
      - 'tools/test-harness/editor-coexistence/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/editor-coexistence.yml'
  pull_request:
    paths:
      - 'crates/anvil-cli/**'
      - 'crates/anvil-kernel/**'
      - 'crates/anvil-hook/**'
      - 'docs/policies/editor-coexistence.md'
      - 'tools/test-harness/editor-coexistence/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/editor-coexistence.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: editor-coexistence-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  editor-coexistence:
    name: anvil watch ↔ language servers
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install rust-analyzer component
        # `components:` on setup-rust-toolchain has historically been a
        # no-op when paired with the rustup-cached default toolchain on
        # the GitHub-hosted runners; install explicitly so the rustup
        # shim resolves to a real binary.
        run: rustup component add rust-analyzer || true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # CI-cost 2026-07: this job builds a RELEASE-profile anvil binary
          # but used to restore the debug `rust-ci` cache — which never
          # contains release deps — so every run cold-built the release
          # dependency graph. Own key (distinct from `rust-release-budget`:
          # write-once cache keys mean two workflows sharing one key would
          # race on the save and one of them would stay cold), saved on
          # merges to `main` so PR runs restore a warm release cache.
          shared-key: rust-release-editor
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Node + TypeScript / Prettier / ESLint
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - run: npm install -g typescript@5 prettier@3 eslint@9

      - name: Install Python + ruff + pyright
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip && pip install ruff pyright

      - name: Build release anvil binary
        run: cargo build -p eddacraft-anvil --release --bin anvil

      - name: Run editor-coexistence harness
        env:
          ANVIL_BIN: ${{ github.workspace }}/target/release/anvil
        run: |
          set -o pipefail
          tools/test-harness/editor-coexistence/run-harness.sh \
            | tee editor-coexistence-verdict.json

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-coexistence-verdict
          path: editor-coexistence-verdict.json
          if-no-files-found: ignore
          retention-days: 30
