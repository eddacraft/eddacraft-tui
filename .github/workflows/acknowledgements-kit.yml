name: Acknowledgements Kit

# ATTRIB-012 CI wire-up. The existing `rust.yml::acknowledgements-diff`
# job only fires when Cargo deps change — kit-only PRs (a new driver,
# a docs edit, a test addition) wouldn't exercise the kit's own
# self-tests under that gate. This dedicated workflow fires on changes
# to the kit, the canonical licences.toml, or its generated consumers,
# so kit invariants are verified on every PR that could break them.

on:
  push:
    branches: [main]
    paths:
      - 'tools/starters/acknowledgements/**'
      - 'attribution/licences.toml'
      - 'attribution/licences.node-allow.txt'
      - 'attribution/licences.go-allow.txt'
      - 'attribution/licences.python-allow.txt'
      - '.github/workflows/acknowledgements-kit.yml'
  pull_request:
    paths:
      - 'tools/starters/acknowledgements/**'
      - 'attribution/licences.toml'
      - 'attribution/licences.node-allow.txt'
      - 'attribution/licences.go-allow.txt'
      - 'attribution/licences.python-allow.txt'
      - '.github/workflows/acknowledgements-kit.yml'
  workflow_dispatch:
  # ATTRIB-021: the macOS leg runs on a weekly cron, on pushes to main, and
  # on manual dispatch — not on every PR. The kit carries deliberate
  # macOS-portability work (manual symlink resolution instead of
  # `readlink -f`, a hand-written wrapper replacing `fold` because
  # coreutils implementations disagree), none of which was ever exercised.
  # Running it on every PR would contradict this repository's matrices-are-
  # nightly cost posture, so it is scheduled instead.
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: acknowledgements-kit-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match rust.yml so the kit's strict-license-field.sh
  # exercises the same cargo-about behaviour CI consumers see.
  CARGO_ABOUT_VERSION: '0.8.4'
  # Pinned license-checker version exercised by the kit's Node tests.
  # Bump deliberately when license-checker ships a CLI-surface change.
  LICENSE_CHECKER_VERSION: '25.0.1'
  # Pinned go-licenses version exercised by the kit's Go tests. Bump
  # deliberately when go-licenses ships a CLI-surface or classifier change.
  GO_LICENSES_VERSION: '1.6.0'
  # Pinned pip-licenses version installed into the kit's Python test
  # venvs. Bump deliberately when pip-licenses ships a CLI-surface change.
  PIP_LICENSES_VERSION: '5.5.5'

jobs:
  kit-self-tests:
    name: Kit Self-Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      # PRs get the Linux leg only; scheduled, main-push and dispatch runs
      # add macOS. See the ATTRIB-021 note on the `schedule` trigger above.
      matrix:
        os:
          ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' ||
          '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust driver tests need cargo-about (strict-license-field.sh).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install cargo-about
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      # Node driver tests need Node + npm (the render + strict tests
      # `npm install` license-checker into a per-test fixture). The
      # preflight test runs without license-checker available — it
      # plants its own stubs / controlled PATH.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # Go driver tests need go-licenses (the render + strict tests build
      # a network-free local-`replace` Go module fixture). ubuntu-latest
      # ships Go; install the pinned go-licenses and expose GOPATH/bin.
      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses@v${GO_LICENSES_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Python driver tests build their own per-test venv and install the
      # pinned pip-licenses into it; they need a seeded `python3` with
      # `venv` + `pip`. Pin a stable CPython for deterministic behaviour.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # ATTRIB-022: the runner is the single source of the test list, so a
      # test added to tests/ is a test CI runs — there is no second list
      # here to forget. `tests/run-all.sh --list` shows what it covers.
      #
      # ATTRIB-020: `--require-all` turns a skipped test into a failure.
      # Several driver tests exit 0 with a `skip:` line when their tool or
      # network is unavailable, so without this a provisioning regression
      # or a network blip produced a green Kit Self-Tests run with the
      # Node, Go and Python drivers entirely unexercised.
      - name: Kit self-tests (skips are failures)
        run: bash tools/starters/acknowledgements/tests/run-all.sh --require-all

      # ATTRIB-020: the kit is ~2,000 lines of bash and was ShellCheck-clean
      # when this gate landed, so it starts green and stays green. Any
      # suppression must carry an inline justification comment.
      - name: ShellCheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck tools/starters/acknowledgements/*.sh \
                     tools/starters/acknowledgements/drivers/*.sh \
                     tools/starters/acknowledgements/tests/*.sh

      # ATTRIB-006 (+ ATTRIB-012 Node, ATTRIB-013 Go, ATTRIB-014 Python
      # fragments): the canonical licences.toml must stay in sync with
      # every consumer file it expands into (about.toml, deny.toml,
      # licences.node-allow.txt, licences.go-allow.txt,
      # licences.python-allow.txt).
      - name: Licences single-source drift check
        run:
          bash tools/starters/acknowledgements/expand-licences.sh --config attribution/licences.toml
          --check
