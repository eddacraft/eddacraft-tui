name: Security

# CICD-007: path/risk targeting for per-PR runs plus weekly scheduled
# assurance. Each job is gated by the classifier output that names the
# signal it cares about (TS/JS source for Semgrep, lockfile/manifest for
# dependency-audit + license-check, any code change for the secret scan).
# On schedule and manual dispatch, change detection is skipped so every
# job runs as a full assurance sweep.

on:
  push:
    branches:
      - main
  pull_request:
    # CIB-137 SAFETY: the trusted-classifier checkout below trusts
    # `github.event.pull_request.base.sha` ONLY because this filter restricts the
    # base to the protected `main` branch. Do NOT broaden this list (or drop the
    # filter) without re-reviewing that argument — a PR that could target an
    # unprotected base branch could point the classifier at attacker-controlled
    # code.
    branches:
      - main
  schedule:
    # Weekly full sweep: Monday 06:15 UTC (offset from codeql @ 06:30).
    - cron: '15 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group:
    security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Detect changes (skipped on schedule/dispatch → every job runs) ─
  detect-changes:
    name: Detect Changes
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
      source-changed: ${{ steps.changes.outputs.source-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
      dependency-audit-required: ${{ steps.changes.outputs.dependency-audit-required }}
    steps:
      # Primary checkout at the PR head (or pushed SHA): the tree whose diff the
      # classifier inspects. Change inputs stay the PR's own actual changes.
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # CIB-137: this workflow shares the "Detect Changes" required-context name
      # with ci.yml (the branch ruleset matches by name only), so its classifier
      # must be trusted too — otherwise a PR could spoof it here to satisfy the
      # required context. Resolve the classifier (this action + its
      # classify-changes.sh) from the base SHA (tip of the target branch, which
      # the PR cannot control — see SAFETY note on the `pull_request` trigger)
      # into `trusted-classifier/` and invoke it from there. On push/schedule the
      # checked-out head is already trusted, so `github.sha` is used. If this
      # checkout fails, the job fails and the dependent scan jobs run the full
      # set (see their `result != 'success'` guards) rather than skipping.
      - name: Checkout trusted classifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.sha }}
          path: trusted-classifier

      - name: Detect changes
        id: changes
        uses: ./trusted-classifier/.github/actions/detect-changes

  # ── SAST: Semgrep ─────────────────────────────────────────────
  # Path-gated on TS/JS or Rust source changes. Docs-only and
  # lockfile-only PRs do not need a Semgrep run.
  semgrep:
    name: SAST (Semgrep)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: `result != 'success'` (not `== 'skipped'`) so a FAILED classifier
    # runs the full scan (fail closed) instead of skipping it; `skipped` still
    # covers the schedule/dispatch full-sweep path.
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.source-changed == 'true' ||
       needs.detect-changes.outputs.rust-changed == 'true')
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep
        continue-on-error: true
        run: |
          python3 -m pip install --quiet semgrep==1.76.0
          semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: p/owasp-top-ten p/typescript p/nodejs .semgrep/

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ── Dependency Vulnerability Audit ─────────────────────────────
  # Trivy reads lockfiles directly — only run when a lockfile or
  # manifest actually changed (classifier `dependency-audit` signal).
  dependency-audit:
    name: Dependency Audit
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: fail closed on a failed classifier (see semgrep note).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.dependency-audit-required == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm audit uses the retired npm v1 audit endpoint (returns 410).
      # Trivy reads pnpm-lock.yaml directly via NVD/OSV databases — no
      # pnpm/node install required.
      - name: Audit production dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ── Secret Scanning ────────────────────────────────────────────
  # TruffleHog is cheap and a secret can land in any non-docs file,
  # so the broader `code-changed` gate stays here.
  secret-scan:
    name: Secret Scan
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: fail closed on a failed classifier (see semgrep note).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.code-changed == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334 # v3.95.7
        with:
          extra_args: --only-verified

  # ── License Compliance ─────────────────────────────────────────
  # License surface only moves when a lockfile or manifest changes,
  # so gate on the same `dependency-audit` classifier signal as the
  # dependency vulnerability audit.
  license-check:
    name: License Compliance
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: fail closed on a failed classifier (see semgrep note).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.dependency-audit-required == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: bash scripts/license-check.sh

  # ── OSSF Scorecard: disabled.
  # Scorecard requires running on the repository's default branch with
  # permissions that the GitHub App token on this repo does not currently
  # grant (ListCommits → "Resource not accessible by integration"). Keeping
  # the job off until the token/branch setup is sorted — re-enable by
  # restoring the schedule trigger and a gated `scorecard:` job.

  # ── PR Summary Comment ─────────────────────────────────────────
  summary:
    name: Security Summary
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: [semgrep, dependency-audit, secret-scan, license-check]
    if: >
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Post summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const semgrep = '${{ needs.semgrep.result }}';
            const audit = '${{ needs.dependency-audit.result }}';
            const secrets = '${{ needs.secret-scan.result }}';
            const license = '${{ needs.license-check.result }}';

            function icon(result) {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⚠️';  // cancelled or other
            }

            function status(result) {
              if (result === 'success') return 'Passed';
              if (result === 'failure') return 'Failed';
              if (result === 'skipped') return 'Skipped';
              return result;
            }

            // Semgrep is non-blocking, so treat failure as a warning
            const semgrepIcon = semgrep === 'failure' ? '⚠️' : icon(semgrep);
            const semgrepStatus = semgrep === 'failure' ? 'Findings (non-blocking)' : status(semgrep);

            const allPassed = audit === 'success' && secrets === 'success' && license === 'success';
            const header = allPassed
              ? '## 🛡️ Security Scan — All Clear'
              : '## 🛡️ Security Scan — Action Required';

            const body = [
              header,
              '',
              '| Check | Status | Result |',
              '| ----- | ------ | ------ |',
              `| SAST (Semgrep) | ${semgrepIcon} | ${semgrepStatus} |`,
              `| Dependency Audit | ${icon(audit)} | ${status(audit)} |`,
              `| Secret Scan | ${icon(secrets)} | ${status(secrets)} |`,
              `| License Compliance | ${icon(license)} | ${status(license)} |`,
              '',
              '> Semgrep is currently in **non-blocking** mode while the baseline is established.',
              '> See the [Security tab](../security) for detailed SARIF findings.',
              '',
              `_Run ID: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Find existing comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🛡️ Security Scan';
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
