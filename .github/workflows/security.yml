name: Security

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group:
    security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Detect changes (skip security scans for docs-only PRs) ─────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  # ── SAST: Semgrep ─────────────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Semgrep
        continue-on-error: true
        run: |
          python3 -m pip install --quiet semgrep==1.76.0
          semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: p/owasp-top-ten p/typescript p/nodejs .semgrep/

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ── Dependency Vulnerability Audit ─────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # pnpm audit uses the retired npm v1 audit endpoint (returns 410).
      # Trivy reads pnpm-lock.yaml directly via NVD/OSV databases — no
      # pnpm/node install required.
      - name: Audit production dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ── Secret Scanning ────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          extra_args: --only-verified

  # ── License Compliance ─────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: bash scripts/license-check.sh

  # ── OSSF Scorecard: disabled.
  # Scorecard requires running on the repository's default branch with
  # permissions that the GitHub App token on this repo does not currently
  # grant (ListCommits → "Resource not accessible by integration"). Keeping
  # the job off until the token/branch setup is sorted — re-enable by
  # restoring the schedule trigger and a gated `scorecard:` job.

  # ── PR Summary Comment ─────────────────────────────────────────
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep, dependency-audit, secret-scan, license-check]
    if: >
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Post summary comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const semgrep = '${{ needs.semgrep.result }}';
            const audit = '${{ needs.dependency-audit.result }}';
            const secrets = '${{ needs.secret-scan.result }}';
            const license = '${{ needs.license-check.result }}';

            function icon(result) {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⚠️';  // cancelled or other
            }

            function status(result) {
              if (result === 'success') return 'Passed';
              if (result === 'failure') return 'Failed';
              if (result === 'skipped') return 'Skipped';
              return result;
            }

            // Semgrep is non-blocking, so treat failure as a warning
            const semgrepIcon = semgrep === 'failure' ? '⚠️' : icon(semgrep);
            const semgrepStatus = semgrep === 'failure' ? 'Findings (non-blocking)' : status(semgrep);

            const allPassed = audit === 'success' && secrets === 'success' && license === 'success';
            const header = allPassed
              ? '## 🛡️ Security Scan — All Clear'
              : '## 🛡️ Security Scan — Action Required';

            const body = [
              header,
              '',
              '| Check | Status | Result |',
              '| ----- | ------ | ------ |',
              `| SAST (Semgrep) | ${semgrepIcon} | ${semgrepStatus} |`,
              `| Dependency Audit | ${icon(audit)} | ${status(audit)} |`,
              `| Secret Scan | ${icon(secrets)} | ${status(secrets)} |`,
              `| License Compliance | ${icon(license)} | ${status(license)} |`,
              '',
              '> Semgrep is currently in **non-blocking** mode while the baseline is established.',
              '> See the [Security tab](../security) for detailed SARIF findings.',
              '',
              `_Run ID: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Find existing comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🛡️ Security Scan';
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
