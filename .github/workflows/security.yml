name: Security

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # OSSF Scorecard: weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ── Detect changes (skip security scans for docs-only PRs) ─────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Skip for scheduled runs (scorecard always runs)
    if: github.event_name != 'schedule'
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  # ── SAST: Semgrep ─────────────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    # Non-blocking until baseline is established
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
          generateSarif: '1'
        env:
          SEMGREP_RULES: p/owasp-top-ten p/typescript p/nodejs

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ── Dependency Vulnerability Audit ─────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          echo "=== Dependency Vulnerability Audit ==="
          echo ""
          echo "Auditing production dependencies for high/critical CVEs..."
          echo ""
          pnpm audit --prod --audit-level=high || {
            EXIT_CODE=$?
            echo ""
            echo "::error::Dependency audit found high/critical vulnerabilities."
            echo "Run 'pnpm audit --prod' locally for details."
            echo "Run 'pnpm audit --prod --fix' to attempt auto-fix."
            exit $EXIT_CODE
          }
          echo ""
          echo "PASS: No high/critical vulnerabilities in production dependencies."

  # ── Secret Scanning ────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --only-verified

  # ── License Compliance ─────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: bash scripts/license-check.sh

  # ── OSSF Scorecard (weekly + push to main) ─────────────────────
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' || (github.event_name == 'push' && github.ref ==
      'refs/heads/main')
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
        continue-on-error: true

  # ── PR Summary Comment ─────────────────────────────────────────
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep, dependency-audit, secret-scan, license-check]
    if: >
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const semgrep = '${{ needs.semgrep.result }}';
            const audit = '${{ needs.dependency-audit.result }}';
            const secrets = '${{ needs.secret-scan.result }}';
            const license = '${{ needs.license-check.result }}';

            function icon(result) {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⚠️';  // cancelled or other
            }

            function status(result) {
              if (result === 'success') return 'Passed';
              if (result === 'failure') return 'Failed';
              if (result === 'skipped') return 'Skipped';
              return result;
            }

            // Semgrep is non-blocking, so treat failure as a warning
            const semgrepIcon = semgrep === 'failure' ? '⚠️' : icon(semgrep);
            const semgrepStatus = semgrep === 'failure' ? 'Findings (non-blocking)' : status(semgrep);

            const allPassed = audit === 'success' && secrets === 'success' && license === 'success';
            const header = allPassed
              ? '## 🛡️ Security Scan — All Clear'
              : '## 🛡️ Security Scan — Action Required';

            const body = [
              header,
              '',
              '| Check | Status | Result |',
              '| ----- | ------ | ------ |',
              `| SAST (Semgrep) | ${semgrepIcon} | ${semgrepStatus} |`,
              `| Dependency Audit | ${icon(audit)} | ${status(audit)} |`,
              `| Secret Scan | ${icon(secrets)} | ${status(secrets)} |`,
              `| License Compliance | ${icon(license)} | ${status(license)} |`,
              '',
              '> Semgrep is currently in **non-blocking** mode while the baseline is established.',
              '> See the [Security tab](../security) for detailed SARIF findings.',
              '',
              `_Run ID: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Find existing comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🛡️ Security Scan';
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
