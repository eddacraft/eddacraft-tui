name: CI Nightly

# Nightly matrix: cross-platform + multi-version Node tests.
# These were moved out of the main CI to save included minutes.
# macOS runners cost 10x, Windows 2x — running on every push was
# burning ~40k included minutes/month.

on:
  schedule:
    # Every night at 02:00 UTC (10:00 AM Perth)
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned so cache invalidation is intentional when we bump this.
  CARGO_LLVM_COV_VERSION: '0.6.14'
  # Pinned so nextest behaviour (retry/timeout/output) is reproducible.
  CARGO_NEXTEST_VERSION: '0.9.133'

jobs:
  # ── Cross-platform smoke tests ─────────────────────────────────
  test-cross-platform:
    name: Unit Tests (Node 22.x, ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          pnpm run test:js -- --run
          pnpm run test:rust

  # ── Multi-version Node tests (Linux only) ──────────────────────
  test-multi-node:
    name: Unit Tests (Node ${{ matrix.node-version }}, Linux)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          pnpm run test:js -- --run
          pnpm run test:rust

  # ── Multi-version build check ──────────────────────────────────
  build-multi-node:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  # ── TypeScript coverage (scheduled assurance) ─────────────────
  # CICD-006: TypeScript coverage runs nightly rather than on every
  # `main` push. PR/integration runs use plain tests; nightly produces
  # coverage evidence and uploads the per-project summaries.
  coverage-typescript:
    name: TypeScript Coverage (Node 22.x, Linux)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v1.16.1

      - name: Build test dependencies
        run: pnpm exec nx run-many -t build --projects=@eddacraft/transactional

      - name: Run unit tests with coverage
        run: |
          RUST_EXCLUDES=(
            --exclude=eddacraft-anvil-architecture
            --exclude=eddacraft-anvil-kernel-types
            --exclude=eddacraft-anvil-checks
            --exclude=eddacraft-anvil-checks-napi
            --exclude=eddacraft-anvil-kernel
            --exclude=eddacraft-anvil-policy
            --exclude=eddacraft-anvil
            --exclude=eddacraft-anvil-tui
            --exclude=anvil-bench
            --exclude=anvil-spike
          )
          pnpm exec nx run-many -t test --exclude=@eddacraft/anvil-e2e --exclude=@eddacraft/anvil-checks-native "${RUST_EXCLUDES[@]}" \
            -- --run --coverage --coverage.reporter=json-summary --coverage.reporter=text

      - name: TypeScript coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### TypeScript Coverage"
            echo
            echo "<details><summary>Per-project line/branch/function/statement coverage</summary>"
            echo
            echo "| Project | Lines | Branches | Functions | Statements |"
            echo "| ------- | -----:| --------:| ---------:| ----------:|"
            found=0
            while IFS= read -r f; do
              found=1
              proj=$(dirname "$(dirname "$f")")
              proj=${proj#./}
              [ -z "$proj" ] && proj=.
              row=$(jq -r '.total | "| \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.statements.pct)% |"' "$f" 2>/dev/null || echo "| — | — | — | — |")
              echo "| \`$proj\` $row"
            done < <(find . -path '*/coverage/coverage-summary.json' \
              -not -path '*/node_modules/*' \
              -not -path '*/.nx/*' \
              -not -path '*/dist/*' | sort)
            if [ "$found" = "0" ]; then
              echo "| _no coverage summaries found_ | — | — | — | — |"
            fi
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-22.x
          path: |
            coverage/
            packages/**/coverage/
            apps/**/coverage/
          retention-days: 14

  # ── Rust coverage (scheduled assurance) ───────────────────────
  # CICD-006: Rust coverage runs nightly. The strict test gate stays
  # in rust.yml on push/PR; this job is observability only.
  coverage-rust:
    name: Rust Coverage (Linux)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: 'false'

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.16.1

      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version ${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      # Coverage is observability, not a gate. Keep this step explicitly
      # non-fatal while preserving whatever summary/artifact evidence is
      # available from the run.
      - name: Collect coverage (nextest)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            while true; do
              sleep 60
              echo "Rust coverage collection still running"
            done
          ) &
          keepalive_pid=$!
          trap 'kill "$keepalive_pid" 2>/dev/null || true' EXIT

          cargo llvm-cov nextest --workspace --json --output-path coverage-rust.json
          coverage_status=$?
          if [ "$coverage_status" -ne 0 ]; then
            echo "::warning::cargo llvm-cov nextest failed with status $coverage_status; nightly coverage is advisory"
          fi

          cargo llvm-cov report --html --output-dir target/llvm-cov
          html_status=$?
          if [ "$html_status" -ne 0 ]; then
            echo "::warning::cargo llvm-cov html report failed with status $html_status"
          fi

          cargo llvm-cov report --summary-only | tee coverage-rust-summary.txt
          summary_status=${PIPESTATUS[0]}
          if [ "$summary_status" -ne 0 ]; then
            echo "::warning::cargo llvm-cov summary failed with status $summary_status"
          fi

          exit 0

      - name: Rust coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Rust Coverage"
            echo
            echo '<details><summary>Per-file / workspace summary (cargo llvm-cov)</summary>'
            echo
            echo '```'
            if [ -f coverage-rust-summary.txt ]; then
              cat coverage-rust-summary.txt
            else
              echo "(coverage summary not produced — cargo llvm-cov step failed)"
            fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-rust
          path: |
            coverage-rust.json
            coverage-rust-summary.txt
            target/llvm-cov/html/
          retention-days: 14
