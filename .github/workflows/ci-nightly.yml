name: CI Nightly

# Nightly matrix: cross-platform + multi-version Node tests.
# These were moved out of the main CI to save included minutes.
# macOS runners cost 10x, Windows 2x — running on every push was
# burning ~40k included minutes/month.
#
# Linux jobs reclaim stock-image disk via free-disk-space (see rust.yml):
# without it, Build / coverage legs intermittently die mid-setup with ENOSPC.

on:
  schedule:
    # 17:00 UTC — 01:00 Perth, no DST. Same Perth-overnight convention as the
    # scheduled cron in bench.yml (`0 19 * * *` → 03:00 Perth). Note:
    # bench-nightly.yml is currently manual-only (its schedule is commented
    # out); the live scheduled bench is bench.yml.
    #
    # Was 02:00 UTC, which is 10:00 Perth: a "nightly" landing mid-morning,
    # so cross-platform breakage sat unseen through the working day that
    # introduced it. The run takes ~25-30 minutes and GitHub defers scheduled
    # triggers by roughly half an hour under load, so results are on the board
    # by ~02:00 Perth — waiting at the start of the day, not arriving during
    # it. Two hours clear of the bench.yml nightly (19:00 UTC / 03:00 Perth)
    # so the two do not contend for macOS runners.
    - cron: '0 17 * * *'
  workflow_dispatch: {}

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned so cache invalidation is intentional when we bump this.
  CARGO_LLVM_COV_VERSION: '0.6.14'
  # Pinned so nextest behaviour (retry/timeout/output) is reproducible.
  CARGO_NEXTEST_VERSION: '0.9.133'

jobs:
  # ── Cross-platform smoke tests ─────────────────────────────────
  # Job names say Node 24 to match engines.node / DEVENV-005 (were stale
  # "Node 22.x" labels while already installing 24.x).
  test-cross-platform:
    name: Unit Tests (Node 24.x, ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          pnpm run test:js -- --run
          pnpm run test:rust

  # ── Multi-version Node tests (Linux only) ──────────────────────
  test-multi-node:
    name: Unit Tests (Node ${{ matrix.node-version }}, Linux)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reclaim preinstalled toolchains on stock ubuntu runners (~25-30 GB).
      # Nightly Build / coverage jobs have been dying mid-setup with ENOSPC
      # ("No space left on device") — the same class of failure free-disk-space
      # already prevents on rust.yml. No-op on macOS/Windows.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          pnpm run test:js -- --run
          pnpm run test:rust

  # ── Multi-version build check ──────────────────────────────────
  build-multi-node:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  # ── TypeScript coverage (scheduled assurance) ─────────────────
  # CICD-006: TypeScript coverage runs nightly rather than on every
  # `main` push. PR/integration runs use plain tests; nightly produces
  # coverage evidence and uploads the per-project summaries.
  coverage-typescript:
    name: TypeScript Coverage (Node 24.x, Linux)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v1.16.1

      - name: Build test dependencies
        run: pnpm exec nx run-many -t build --projects=@eddacraft/transactional

      - name: Run unit tests with coverage
        run: |
          RUST_EXCLUDES=(
            --exclude=eddacraft-anvil-architecture
            --exclude=eddacraft-anvil-kernel-types
            --exclude=eddacraft-anvil-checks
            --exclude=eddacraft-anvil-checks-napi
            --exclude=eddacraft-anvil-kernel
            --exclude=eddacraft-anvil-policy
            --exclude=eddacraft-anvil
            --exclude=eddacraft-anvil-tui
            --exclude=anvil-bench
            --exclude=anvil-spike
          )
          pnpm exec nx run-many -t test --exclude=@eddacraft/anvil-e2e --exclude=@eddacraft/anvil-checks-native "${RUST_EXCLUDES[@]}" \
            -- --run --coverage --coverage.reporter=json-summary --coverage.reporter=text

      - name: TypeScript coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### TypeScript Coverage"
            echo
            echo "<details><summary>Per-project line/branch/function/statement coverage</summary>"
            echo
            echo "| Project | Lines | Branches | Functions | Statements |"
            echo "| ------- | -----:| --------:| ---------:| ----------:|"
            found=0
            while IFS= read -r f; do
              found=1
              proj=$(dirname "$(dirname "$f")")
              proj=${proj#./}
              [ -z "$proj" ] && proj=.
              row=$(jq -r '.total | "| \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.statements.pct)% |"' "$f" 2>/dev/null || echo "| — | — | — | — |")
              echo "| \`$proj\` $row"
            done < <(find . -path '*/coverage/coverage-summary.json' \
              -not -path '*/node_modules/*' \
              -not -path '*/.nx/*' \
              -not -path '*/dist/*' | sort)
            if [ "$found" = "0" ]; then
              echo "| _no coverage summaries found_ | — | — | — | — |"
            fi
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-22.x
          path: |
            coverage/
            packages/**/coverage/
            apps/**/coverage/
          retention-days: 14

  # ── Rust coverage (scheduled assurance) ───────────────────────
  # CICD-006: Rust coverage runs nightly. The strict test gate stays
  # in rust.yml on push/PR; this job is observability only.
  coverage-rust:
    name: Rust Coverage (Linux)
    # llvm-cov instrumented workspace builds exhaust stock ubuntu-latest disk
    # even after free-disk-space (~14 GB free). Prefer the 8-core pool already
    # used by rust-tests (#3684); fall back to LINUX_RUNNER / ubuntu-latest.
    runs-on: ${{ vars.RUST_TEST_RUNNER || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Skip when the dedicated 8-core pool is selected (`RUST_TEST_RUNNER`);
      # that pool already has headroom. When the job falls back to
      # LINUX_RUNNER / ubuntu-latest, reclaim preinstalled toolchains first.
      # (LINUX_RUNNER may itself be non-stock — the condition keys only on
      # RUST_TEST_RUNNER, matching rust-tests.yml.)
      - name: Free disk space
        if: vars.RUST_TEST_RUNNER == ''
        uses: ./.github/actions/free-disk-space

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview

      # Separate cache namespace from rust-tests — llvm-cov instrumentation
      # flags must not share artefact slots with the non-instrumented gate.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-coverage
          save-if:
            ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      # free-disk-space only removes preinstalled toolchains, not cargo target
      # from a cache restore — re-running it here would not undo the restore.
      # Record post-restore headroom for ENOSPC forensics instead.
      - name: Report disk after cache restore
        if: vars.RUST_TEST_RUNNER == ''
        shell: bash
        run: df -h / || true

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.16.1

      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version ${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      # Coverage is observability, not a gate. Collection mechanics live in
      # scripts/ci/rust-coverage.sh (clean → --no-report nextest → report).
      - name: Collect coverage (nextest)
        continue-on-error: true
        run: bash scripts/ci/rust-coverage.sh

      - name: Rust coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Rust Coverage"
            echo
            echo '<details><summary>Per-file / workspace summary (cargo llvm-cov)</summary>'
            echo
            echo '```'
            if [ -f coverage-rust-summary.txt ]; then
              cat coverage-rust-summary.txt
            else
              echo "(coverage summary not produced — cargo llvm-cov step failed)"
            fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-rust
          path: |
            coverage-rust.json
            coverage-rust-summary.txt
            target/llvm-cov/html/
          retention-days: 14

  # ── Cross-compile matrix (nightly assurance) ───────────────────
  # CI-cost 2026-07: moved here from rust.yml's per-merge push-to-main
  # trigger. The matrix mirrors rust.yml's `cross-compile` job (which
  # still fires on release/* pushes, release-class PRs, and
  # workflow_dispatch); this nightly leg keeps cross-platform breakage
  # on `main` visible within a day without paying macOS (10x) +
  # Windows (2x) runner multipliers on every merge.
  cross-compile:
    name: Cross (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            can_test: false
          - target: x86_64-apple-darwin
            os: macos-latest
            can_test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            can_test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            can_test: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            can_test: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      # Per-target cache: nightly runs on the default branch, so the saved
      # cache is restorable by the next nightly. Keeps the 10x-billed macOS
      # legs warm instead of cold-building the workspace every night.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cross-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install OPA
        if: matrix.can_test
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v1.16.1

      - name: Verify OPA version
        if: matrix.can_test
        shell: bash
        env:
          EXPECTED_OPA_VERSION: '1.16.1'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.can_test
        # `--no-fail-fast` so a failure in one test binary does not mask
        # failures in later binaries — surfaces every platform-specific
        # failure in a single run instead of one binary at a time.
        run: cargo test --workspace --target ${{ matrix.target }} --no-fail-fast -- --test-threads=1
