name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'
      - 'apps/anvil-api/src/db/migrations/**'
      - 'apps/anvil-api/src/db/migrate.ts'
      - 'apps/anvil-api/scripts/migrate.mjs'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'
      - 'apps/anvil-api/src/db/migrations/**'
      - 'apps/anvil-api/src/db/migrate.ts'
      - 'apps/anvil-api/scripts/migrate.mjs'
  workflow_dispatch:

concurrency:
  group: infra-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  PULUMI_STACK_PREVIEW: dev
  PULUMI_STACK_UP: prod

jobs:
  # Check if Azure infrastructure secrets are configured
  check-secrets:
    name: Check Azure Secrets
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    outputs:
      azure-configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check if ARM secrets exist
        id: check
        run: |
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Azure secrets (ARM_CLIENT_ID, ARM_CLIENT_SECRET) not configured — skipping Pulumi jobs"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

  preview:
    name: Pulumi Preview
    needs: check-secrets
    if: >-
      needs.check-secrets.outputs.azure-configured == 'true' && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Fetch Vercel token from Key Vault
        run: |
          VERCEL_TOKEN=$(az keyvault secret show --vault-name kv-iac-anvil --name vercel-token --query value -o tsv)
          echo "::add-mask::$VERCEL_TOKEN"
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"

      - name: Pulumi Preview
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: ${{ env.PULUMI_STACK_PREVIEW }}
          work-dir: infra
          cloud-url: azblob://pulumi-state
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          VERCEL_API_TOKEN: ${{ env.VERCEL_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

  up:
    name: Pulumi Up
    needs: check-secrets
    if: >-
      needs.check-secrets.outputs.azure-configured == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Fetch Vercel token from Key Vault
        run: |
          VERCEL_TOKEN=$(az keyvault secret show --vault-name kv-iac-anvil --name vercel-token --query value -o tsv)
          echo "::add-mask::$VERCEL_TOKEN"
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"

      # V041F-014: apply pending DB migrations BEFORE Pulumi Up so any
      # new schema the infra apply depends on is already in place.
      # v0.4.0-beta tag failed Pulumi Up with `relation "admin_keys"
      # does not exist` because migrations 007–010 had not been
      # applied. The runner is idempotent and refuses to apply if any
      # recorded migration has been edited on disk (drift guard).
      - name: Build anvil-api
        # tsc --build already follows the project references composite
        # graph, so `--filter @eddacraft/anvil-api` (without `...`) is
        # enough — `--filter ...` would re-build deps once via pnpm
        # then again via tsc --build.
        run: pnpm --filter @eddacraft/anvil-api run build

      - name: Apply pending DB migrations
        # Fetch DATABASE_URL inline rather than persisting to GITHUB_ENV
        # so the prod credential is scoped to this single step and is
        # never visible to the Pulumi Up action below or any other
        # third-party action.
        run: |
          DATABASE_URL=$(az keyvault secret show --vault-name kv-iac-anvil --name anvil-api-database-url --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" node apps/anvil-api/scripts/migrate.mjs

      - name: Apply infrastructure changes
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK_UP }}
          work-dir: infra
          cloud-url: azblob://pulumi-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          VERCEL_API_TOKEN: ${{ env.VERCEL_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
