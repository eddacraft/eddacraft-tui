name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'
      - 'apps/anvil-api/src/db/migrations/**'
      - 'apps/anvil-api/src/db/migrate.ts'
      - 'apps/anvil-api/scripts/migrate.mjs'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'
      - 'apps/anvil-api/src/db/migrations/**'
      - 'apps/anvil-api/src/db/migrate.ts'
      - 'apps/anvil-api/scripts/migrate.mjs'
  workflow_dispatch:

concurrency:
  group: infra-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  # CIB-136: PR previews run an untrusted, synthetic stack against a throwaway
  # local Pulumi backend. `ci-preview` is not `prod`, so the stack-trust gating
  # in infra/src/*.ts (CIB-119) keeps every production secret and resource out
  # of the PR-controlled preview.
  PULUMI_STACK_PREVIEW: ci-preview
  PULUMI_STACK_UP: prod

jobs:
  # Check if Azure infrastructure secrets are configured. Gated to push only:
  # it exists solely to gate the trusted `up` job, and evaluating the ARM
  # secrets in pull_request-triggered runs would contradict the preview job's
  # credential-free contract (CIB-136) even though no PR code is checked out.
  check-secrets:
    name: Check Azure Secrets
    if: github.event_name == 'push'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      azure-configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check if ARM secrets exist
        id: check
        run: |
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Azure secrets (ARM_CLIENT_ID, ARM_CLIENT_SECRET) not configured — skipping Pulumi jobs"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

  preview:
    name: Pulumi Preview (untrusted — validates, does not diff prod)
    # CIB-136: the preview runs PR-controlled code (pnpm lifecycle scripts and
    # the Pulumi program itself). It therefore carries NO Azure login, NO Key
    # Vault fetch and NONE of the production Pulumi/ARM/Vercel/Storage secrets.
    # The ONLY credential reachable by PR code here is the job's own ephemeral
    # GITHUB_TOKEN (contents: read, pull-requests: write) used to post the
    # preview comment — pre-existing and repo-scoped, but not "no secrets at
    # all". It is deliberately decoupled from `check-secrets` (which gates the
    # trusted `up` job) because it no longer needs any Azure credential to run.
    #
    # TRADEOFF (CIB-119 security model, completed by CIB-136): the preview runs
    # against an untrusted synthetic stack, and on an untrusted stack every
    # production resource is gated off at source (keyvault reads become markers;
    # vercel / signing / admin-keys / DNS define nothing). So `pulumi preview`
    # here registers ZERO resources and always reports "no changes". This step
    # validates that the Pulumi program loads and constructs cleanly WITHOUT any
    # credential — it does NOT and CANNOT diff production resources. Real infra
    # changes are only planned/applied by the trusted `up` job after merge. This
    # is intentional: PR-controlled code must never be trusted with prod state.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare credential-free preview backend
        # The preview must not touch the production azblob Pulumi state (that
        # would need the storage-account key, a secret we must keep away from PR
        # code). Instead we point Pulumi at a throwaway local backend and a
        # synthetic untrusted stack. Because that stack is not `prod`, the
        # CIB-119 gating in infra/src/*.ts resolves every secret to an
        # `<untrusted-stack-secret:...>` marker and defines no production
        # resource, so the preview runs with zero credentials.
        run: |
          # Drop the committed azblob backend pin so the local login is honoured
          # (only edits the ephemeral CI checkout). The helper fails closed if
          # the backend or its azblob URL survives the strip — see
          # scripts/ci/strip-pulumi-backend.sh and its fixture test.
          bash scripts/ci/strip-pulumi-backend.sh infra/Pulumi.yaml
          # Ephemeral, non-secret passphrase for the local backend's secrets
          # provider. This is NOT the production PULUMI_CONFIG_PASSPHRASE — the
          # synthetic stack lives only on this runner's filesystem and is
          # discarded when the job ends.
          echo "PULUMI_CONFIG_PASSPHRASE=ci-preview-not-a-secret" >> "$GITHUB_ENV"

      - name: Pulumi Preview (untrusted stack, no production secrets)
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: ${{ env.PULUMI_STACK_PREVIEW }}
          work-dir: infra
          # Throwaway local backend — no azblob, so no storage-account key.
          cloud-url: file://~
          # Create the synthetic untrusted stack on first run.
          upsert: true
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # This step executes the PR-controlled Pulumi program. The one
          # credential it can reach is the ephemeral GITHUB_TOKEN below
          # (contents: read, pull-requests: write), needed to post the preview
          # comment — pre-existing and repo-scoped. No Azure, Vercel or
          # production Pulumi credentials reach this job. The local backend's
          # passphrase set in the previous step is a non-secret throwaway, not
          # the production one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  up:
    name: Pulumi Up
    needs: check-secrets
    if: >-
      needs.check-secrets.outputs.azure-configured == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Fetch Vercel token from Key Vault
        run: |
          VERCEL_TOKEN=$(az keyvault secret show --vault-name kv-iac-anvil --name vercel-token --query value -o tsv)
          echo "::add-mask::$VERCEL_TOKEN"
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"

      # V041F-014: apply pending DB migrations BEFORE Pulumi Up so any
      # new schema the infra apply depends on is already in place.
      # v0.4.0-beta tag failed Pulumi Up with `relation "admin_keys"
      # does not exist` because migrations 007–010 had not been
      # applied. The runner is idempotent and refuses to apply if any
      # recorded migration has been edited on disk (drift guard).
      - name: Build anvil-api
        # tsc --build already follows the project references composite
        # graph, so `--filter @eddacraft/anvil-api` (without `...`) is
        # enough — `--filter ...` would re-build deps once via pnpm
        # then again via tsc --build.
        run: pnpm --filter @eddacraft/anvil-api run build

      - name: Apply pending DB migrations
        # Fetch DATABASE_URL inline rather than persisting to GITHUB_ENV
        # so the prod credential is scoped to this single step and is
        # never visible to the Pulumi Up action below or any other
        # third-party action.
        run: |
          DATABASE_URL=$(az keyvault secret show --vault-name kv-iac-anvil --name anvil-api-database-url --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" node apps/anvil-api/scripts/migrate.mjs

      - name: Apply infrastructure changes
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK_UP }}
          work-dir: infra
          cloud-url: azblob://pulumi-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          VERCEL_API_TOKEN: ${{ env.VERCEL_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
