# Mirror the `eddacraft-tui` crate to its public sibling repo.
#
# TUIR-004 (module: tui-reintegration). The canonical source lives at
# `crates/eddacraft-tui/` in this repository. This workflow extracts that
# subdirectory as its own repo via `git subtree split` and force-pushes it
# to `eddacraft/eddacraft-tui:main`.
#
# Pre-push transformation:
#   - `MIRROR-README.md` is prepended onto `README.md` so the public repo
#     reads with a "this is a mirror" banner up front. The MIRROR-README
#     file itself is then removed from the staged tree (D-TUIR-012).
#
# The mirror is intentionally **flat-rooted** (the crate's files at the
# public repo's top level, no wrapping subdirectory), per D-TUIR-004.
# External consumers depend on the crates.io release, not on git `main`
# (D-TUIR-008). Release tags (`eddacraft-tui-v*`) are pushed by the
# separate publish workflow (TUIR-005), NOT by this mirror — this
# workflow only force-pushes `main`, so existing tags on the mirror
# (including pre-cutover `v0.x.y` tags per D-TUIR-011) are never
# overwritten by the mirror job (D-TUIR-009).
#
# Auth: the `eddacraft-mirror-bot` GitHub App (org-owned by
# `eddacraft`, installed on `eddacraft/eddacraft-tui` only,
# permissions `Contents: Read and write` + `Metadata: Read`). The
# workflow mints a short-lived installation token at runtime via
# `actions/create-github-app-token`, then uses it as the password in
# an `http.extraheader` Basic auth header against
# `https://github.com/eddacraft/eddacraft-tui.git`. Two repo secrets
# back the App:
#   - `EDDACRAFT_MIRROR_BOT_APP_ID` — numeric App ID.
#   - `EDDACRAFT_MIRROR_BOT_PRIVATE_KEY` — PEM-format private key.
# The previous `EDDACRAFT_TUI_MIRROR_PUSH_TOKEN` PAT is no longer
# referenced and can be deleted from anvil-001 repo secrets after the
# first successful App-auth run.
#
# Credential rotation: see docs/runbooks/eddacraft-tui-release.md (covers
# rotating the eddacraft-mirror-bot App ID + private key; the legacy term
# "PAT rotation" maps to the same runbook section).
#
# URL-embedded `x-access-token:${TOKEN}@github.com` form is fragile
# to stray bytes in the credential (CURLE_URL_MALFORMAT); the
# Basic-header form sidesteps URL parsing entirely (ATTRIB-011
# precedent).
#
# Runner: `ubuntu-latest` is required. `git subtree split` shells out to
# `dirname`, and uutils coreutils 0.2.2 mis-handles multi-segment
# prefixes (returns `a/b` for `a/b/c/.`). GitHub Actions `ubuntu-latest`
# ships GNU coreutils and is unaffected. Local reproduction on uutils
# boxes requires the `/tmp/gnu-shim/dirname` PATH shim documented in
# the release runbook.
#
# Drift check: D-TUIR-018 is implemented by the separate
# `.github/workflows/mirror-drift-check.yml` daily job (TUIR-010), which
# diffs the canonical subtree against the live mirror tree and opens a
# tracked issue on any drift. That job REPLICATES the subtree-split and
# the "Swap MIRROR-README onto README" step below to reconstruct the
# expected mirror tree — the two must produce the SAME TREE (incidental
# YAML form may differ): any change to the `--prefix` or the banner-swap
# *content* here MUST be mirrored in `mirror-drift-check.yml` in the same
# PR, or the watchdog reports false drift.
#
# See plans/archive/modules/tui-reintegration.aps.md (D-TUIR-004, D-TUIR-009,
# D-TUIR-012, D-TUIR-018) and the ATTRIB-011 precedent
# (.github/workflows/mirror-acknowledgements-starter.yml).

name: Mirror — eddacraft-tui crate

on:
  push:
    branches: [main]
    paths:
      - 'crates/eddacraft-tui/**'
      - '.github/workflows/mirror-eddacraft-tui.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you force-resyncing? (logged on the mirror commit)'
        required: false
        default: 'manual resync'
      dry_run:
        description:
          'Preflight only: validate auth + refspec + tree shape via `git push --force --dry-run`
          without mutating the public mirror.'
        type: boolean
        required: false
        default: false

concurrency:
  group: mirror-eddacraft-tui
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: this workflow does not touch the anvil-001
# repo's GitHub state — all writes go to the mirror via the
# eddacraft-mirror-bot App installation token (minted per run).
permissions:
  contents: read

jobs:
  mirror:
    name: Force-push subtree to eddacraft/eddacraft-tui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_dispatch runs on whatever ref the operator selects in the
      # UI. The mirror is documented as tracking canonical `main`; reject
      # any other ref so a stray dispatch from a feature branch / tag
      # can't silently force-push the wrong tree to the public repo.
      - name: Guard — only mirror from refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "::error::mirror workflow refused: GITHUB_REF=${GITHUB_REF} (only refs/heads/main is allowed)"
            exit 1
          fi

      - name: Checkout (full history — subtree split needs it)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Git identity for the throwaway banner-swap commit. The App
      # installation token authenticates the push, but `git commit`
      # still needs a local identity. Use the eddacraft-mirror-bot
      # bot-account form so the commit author on the mirror matches
      # the App that produced it.
      - name: Configure git identity
        run: |
          git config --global user.name  'eddacraft-mirror-bot[bot]'
          git config --global user.email 'eddacraft-mirror-bot[bot]@users.noreply.github.com'

      - name: Sanity-check App credentials
        env:
          APP_ID: ${{ secrets.EDDACRAFT_MIRROR_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.EDDACRAFT_MIRROR_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ]; then
            echo '::error::secret EDDACRAFT_MIRROR_BOT_APP_ID is empty — wire the App credentials before re-running'
            exit 1
          fi
          if [ -z "${PRIVATE_KEY}" ]; then
            echo '::error::secret EDDACRAFT_MIRROR_BOT_PRIVATE_KEY is empty — wire the App credentials before re-running'
            exit 1
          fi

      - name: Mint eddacraft-mirror-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EDDACRAFT_MIRROR_BOT_APP_ID }}
          private-key: ${{ secrets.EDDACRAFT_MIRROR_BOT_PRIVATE_KEY }}
          owner: eddacraft
          repositories: eddacraft-tui

      - name: Swap MIRROR-README onto README (on a throwaway commit)
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          CRATE_DIR=crates/eddacraft-tui
          if [ ! -f "${CRATE_DIR}/MIRROR-README.md" ]; then
            echo "::error::${CRATE_DIR}/MIRROR-README.md missing — the public framing header is required"
            exit 1
          fi
          if [ ! -f "${CRATE_DIR}/README.md" ]; then
            echo "::error::${CRATE_DIR}/README.md missing — cannot prepend banner without a README"
            exit 1
          fi
          # Banner double-prepend sentinel. The read-only-mirror banner lives
          # ONLY in MIRROR-README.md; the canonical README must never carry it.
          # If it does, a contributor committed the post-swap state by mistake
          # (e.g. ran this swap locally during testing and forgot to revert) —
          # prepending again would publish a doubled banner. Hard-fail rather
          # than push it. We derive the sentinel from MIRROR-README.md so the
          # check tracks the banner wording automatically.
          sentinel='> **This repository is a read-only mirror.**'
          if ! grep -Fq -- "${sentinel}" "${CRATE_DIR}/MIRROR-README.md"; then
            echo "::error::expected banner sentinel not found in ${CRATE_DIR}/MIRROR-README.md — update the double-prepend guard"
            exit 1
          fi
          if grep -Fq -- "${sentinel}" "${CRATE_DIR}/README.md"; then
            echo "::error::${CRATE_DIR}/README.md already carries the read-only-mirror banner — refusing to double-prepend (revert the post-swap state committed to the canonical README)"
            exit 1
          fi
          tmp="$(mktemp)"
          cat "${CRATE_DIR}/MIRROR-README.md" "${CRATE_DIR}/README.md" > "${tmp}"
          mv "${tmp}" "${CRATE_DIR}/README.md"
          rm "${CRATE_DIR}/MIRROR-README.md"
          git add "${CRATE_DIR}/README.md" "${CRATE_DIR}/MIRROR-README.md"
          msg='chore(mirror): prepend public README header [skip ci]'
          if [ -n "${DISPATCH_REASON:-}" ]; then
            msg=$(printf '%s\n\nmanual dispatch reason: %s\n' "${msg}" "${DISPATCH_REASON}")
          fi
          git commit -m "${msg}" --allow-empty

      - name: Subtree split
        run: |
          set -euo pipefail
          # Pre-delete guard. `git subtree split -b _mirror_split` aborts with
          # "fatal: A branch named '_mirror_split' already exists" if the ref
          # is already present in the workspace. GitHub-hosted runners are
          # ephemeral per job so this is theoretical today, but a self-hosted
          # runner or any runner-reuse model would surface it. One-line
          # idempotent guard.
          git branch -D _mirror_split 2>/dev/null || true
          git subtree split \
            --prefix=crates/eddacraft-tui \
            -b _mirror_split
          # Non-empty assertion. `git subtree split` can produce an empty
          # branch if the prefix gets renamed / removed in a future
          # refactor and the workflow's `paths:` filter is not updated in
          # the same commit. Force-pushing an empty tree to the mirror
          # would silently wipe the public repo. Fail loudly instead so
          # the operator notices.
          if ! git rev-parse --verify --quiet _mirror_split >/dev/null; then
            echo '::error::subtree split did not produce _mirror_split branch'
            exit 1
          fi
          commit_count=$(git rev-list --count _mirror_split)
          if [ "${commit_count}" -eq 0 ]; then
            echo '::error::_mirror_split is empty — refusing to push (would wipe the public mirror)'
            exit 1
          fi
          if [ -z "$(git ls-tree _mirror_split)" ]; then
            echo '::error::_mirror_split has no tree content — refusing to push (would wipe the public mirror)'
            exit 1
          fi

      - name: Force-push to mirror repo
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # Authenticate via an HTTP Basic header instead of embedding the
          # token in the URL. The URL-embedded form is fragile: a single
          # stray byte in the credential (trailing newline, control char)
          # makes libcurl reject the entire URL with "Malformed input to a
          # URL function" before it can even talk to GitHub. Sending an
          # explicit Authorization header sidesteps URL parsing entirely.
          #
          # Refspec is scoped to `_mirror_split:main` only — no `--tags`,
          # no `--mirror`, no wildcard. This is the single line that
          # enforces D-TUIR-009 / D-TUIR-011 (existing mirror tags are
          # never overwritten by this workflow). Any future edit that
          # widens the refspec MUST be reviewed against those decisions.
          #
          # Dry-run preflight: the first workflow_dispatch run after a
          # credential rotation is a live force-push to a public repo with no
          # pre-flight. Set the `dry_run` input to add `--dry-run` so an
          # operator can validate the auth + refspec + tree shape without
          # mutating the public mirror history.
          push_opts=(--force)
          if [ "${DRY_RUN:-false}" = 'true' ]; then
            push_opts+=(--dry-run)
            echo '::notice::dry_run=true — git push --force --dry-run (mirror NOT mutated)'
          fi
          basic=$(printf '%s' "x-access-token:${APP_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${basic}" \
              push "${push_opts[@]}" \
              https://github.com/eddacraft/eddacraft-tui.git \
              _mirror_split:main

      - name: Summary
        if: always()
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Sanitize the dispatch reason before embedding it in the
          # markdown step summary. The reason flows in from a workflow
          # dispatch input and could contain backticks (which would
          # terminate the inline code span and break the markdown) or
          # newlines / `#` characters (which could inject headings into
          # the summary). Strip backticks and CR/LF; replace any
          # remaining `#` with `H` so embedded headings can't form.
          reason_sanitized=$(printf '%s' "${DISPATCH_REASON:-}" | tr -d '`\r\n' | tr '#' 'H')
          {
            echo '## Mirror result'
            echo
            echo 'Source commit (anvil-001 main):    `'"${GITHUB_SHA}"'`'
            echo 'Mirror target:                     `eddacraft/eddacraft-tui:main`'
            echo 'Trigger:                           `'"${GITHUB_EVENT_NAME}"'`'
            echo 'Job outcome:                       `'"${JOB_STATUS}"'`'
            if [ -n "${reason_sanitized}" ]; then
              echo 'Dispatch reason:                   `'"${reason_sanitized}"'`'
            fi
            echo
            echo 'Verify with:'
            echo
            echo '    gh api repos/eddacraft/eddacraft-tui/commits/main --jq .sha'
          } >> "${GITHUB_STEP_SUMMARY}"
