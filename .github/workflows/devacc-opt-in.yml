# DEVACC-011 / DEVACC-012 — opt-in only. Default: no schedule, not a required check.
# Enable deliberately: run via workflow_dispatch, or uncomment the schedule block.
name: DEVACC opt-in (disabled by default)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'A (deterministic) or B (dry-run unless secrets configured)'
        required: true
        default: 'A'
  # schedule:
  #   - cron: "0 4 * * *"   # DEVACC-011: uncomment only when deliberately enabling nightly

permissions:
  contents: read

jobs:
  devacc-tier-a:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tier A smoke
        run: |
          cargo test -p anvil-bench -- devacc_ -- --nocapture
          cargo run -p anvil-bench --release -- devacc --tier A --out benchmark-results/devacc-ci
      - name: Upload (optional artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devacc-results
          path: benchmark-results/devacc-ci/
          retention-days: 14
