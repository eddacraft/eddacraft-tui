# TSRET-002: cross-platform prebuilds for @eddacraft/anvil-checks-native.
#
# - On push/PR touching the napi crate, build the .node binary on every
#   target we ship to and run the parity test on the platforms GitHub
#   provides runners for. Keeps prebuild breakage off main.
# - On a `napi-v*` tag push, do the same matrix and then publish each
#   per-platform sub-package + the main package to npm. The `release.yml`
#   workflow (cargo-dist) handles the CLI binary; this workflow only
#   touches the napi npm packages.
#
# Validation per the TSRET-002 work item is "fresh clone on each platform
# installs without a Rust toolchain and the scanner runs". The `test`
# matrix asserts that on linux-x64 / macos-arm64 / windows-x64 (the three
# native runners). aarch64-linux and x86_64-darwin install-tests must
# happen out-of-band before TSRET-003 cuts consumers over (see follow-ups
# in plans/modules/anvil-ts-scanner-retirement.aps.md TSRET-002).

name: NAPI

on:
  push:
    branches: [main, dev]
    paths:
      - 'crates/anvil-checks-napi/**'
      - 'crates/anvil-checks/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/napi.yml'
    tags:
      - 'napi-v*'
  pull_request:
    paths:
      - 'crates/anvil-checks-napi/**'
      - 'crates/anvil-checks/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/napi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napi-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NAPI_PACKAGE_DIR: crates/anvil-checks-napi

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            extra_args: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            # Cross-compiles via napi-cross's prebuilt sysroot; avoids
            # spinning up a full QEMU emulator on the build job. Install
            # tests on real arm64 hardware are tracked as a follow-up.
            extra_args: '--use-napi-cross'
          - target: x86_64-apple-darwin
            runner: macos-13
            extra_args: ''
          - target: aarch64-apple-darwin
            runner: macos-14
            extra_args: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            extra_args: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Per-target cache key — host toolchains differ enough that
          # sharing one bucket would force constant invalidation.
          shared-key: napi-${{ matrix.target }}

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --filter @eddacraft/anvil-checks-native --frozen-lockfile

      - name: Build napi binding
        # Matrix values are workflow-defined (no user input), but routing
        # them through env keeps the security-hook contract intact and
        # makes the run line trivially auditable.
        env:
          NAPI_TARGET: ${{ matrix.target }}
          NAPI_EXTRA_ARGS: ${{ matrix.extra_args }}
        shell: bash
        run: |
          pnpm --filter @eddacraft/anvil-checks-native exec \
            napi build --platform --release \
              --js index.js --dts index.d.ts \
              --manifest-path Cargo.toml \
              --target "$NAPI_TARGET" $NAPI_EXTRA_ARGS

      - name: Upload binding artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-binary-${{ matrix.target }}
          # Ship the .node binary together with the JS loader and TS
          # declarations the loader resolves through. `napi create-npm-dirs`
          # only scaffolds the per-platform `npm/<arch>/package.json`
          # stubs — it does NOT regenerate `index.js` / `index.d.ts`, so
          # the test job depends on the build job uploading them here.
          path: |
            ${{ env.NAPI_PACKAGE_DIR }}/*.node
            ${{ env.NAPI_PACKAGE_DIR }}/index.js
            ${{ env.NAPI_PACKAGE_DIR }}/index.d.ts
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.runner }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the targets where we have native runners — cross-compiled
          # arm64-linux and x64-darwin install-tests have to happen
          # elsewhere (see workflow comment + module follow-ups).
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        # No Rust toolchain is installed in this job — proves the prebuilt
        # .node loads on a host with only Node + pnpm, which is the
        # TSRET-002 validation contract.
        run: pnpm install --filter @eddacraft/anvil-checks-native --frozen-lockfile

      - name: Download binding artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: napi-binary-${{ matrix.target }}
          path: ${{ env.NAPI_PACKAGE_DIR }}

      - name: Run parity test
        working-directory: ${{ env.NAPI_PACKAGE_DIR }}
        run: pnpm test

  publish:
    name: Publish to npm
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/napi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token: write` is what `npm publish --provenance` needs.
      # Enable when we turn provenance on — see follow-up in TSRET-002.
      # id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --filter @eddacraft/anvil-checks-native --frozen-lockfile

      - name: Download all .node artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ env.NAPI_PACKAGE_DIR }}/artifacts
          pattern: napi-binary-*
          merge-multiple: false

      - name: Move artefacts into per-platform npm packages
        working-directory: ${{ env.NAPI_PACKAGE_DIR }}
        run: pnpm exec napi artifacts --output-dir artifacts

      - name: Publish per-platform packages
        working-directory: ${{ env.NAPI_PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec napi pre-publish --tag-style npm --no-gh-release
