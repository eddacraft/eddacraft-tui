# TSRET-002: cross-platform prebuilds for @eddacraft/anvil-checks-native.
#
# - On push/PR touching the napi crate, build the .node binary on every
#   target we ship to and run the parity test on the platforms GitHub
#   provides runners for. Keeps prebuild breakage off main.
# - On a `napi-v*` tag push, do the same matrix and then publish each
#   per-platform sub-package + the main package to npm. The `release.yml`
#   workflow (cargo-dist) handles the CLI binary; this workflow only
#   touches the napi npm packages.
#
# Validation per the TSRET-002 work item is "fresh clone on each platform
# installs without a Rust toolchain and the scanner runs". The `test`
# matrix asserts that on linux-x64 / macos-arm64 / windows-x64 (the three
# native runners). aarch64-linux and x86_64-darwin install-tests must
# happen out-of-band before TSRET-003 cuts consumers over (see follow-ups
# in plans/modules/anvil-ts-scanner-retirement.aps.md TSRET-002).

name: NAPI

on:
  push:
    branches: [main]
    # Per ADR-030 the napi binding is an internal CLI-acceleration
    # path (not published, not consumer-facing via VSCode / MCP).
    # Scope the path filter to what affects the binding's compile
    # surface (binding + anvil-checks Rust sources + manifest +
    # toolchain / workflow) *plus* the compiled pattern registry
    # that `anvil_checks::antipattern::registry_loader` reads at
    # runtime — registry content changes what
    # `getDefaultPatternsJson` and `getPatternJson` return, so a
    # registry-only change must still retrigger the napi canary.
    # Anvil-checks tests/, benches/, and docs do not affect the
    # binding and are deliberately excluded. Council review X4
    # (2026-04-24, refined after copilot pointed out the registry
    # gap).
    paths:
      - 'crates/anvil-checks-napi/**'
      - 'crates/anvil-checks/src/**'
      - 'crates/anvil-checks/Cargo.toml'
      - 'patterns/compiled/registry.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/napi.yml'
    tags:
      - 'napi-v*'
  pull_request:
    paths:
      - 'crates/anvil-checks-napi/**'
      - 'crates/anvil-checks/src/**'
      - 'crates/anvil-checks/Cargo.toml'
      - 'patterns/compiled/registry.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/napi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napi-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NAPI_PACKAGE_DIR: crates/anvil-checks-napi

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Cap each build matrix leg. Warm builds complete in 2–6m; aarch64
    # cross-compile is the slowest typically ~5m. 30m absorbs a cold
    # sccache miss or a runner cold-start blip without turning a hung
    # job into a 6-hour runner squat. Council review M15 (2026-04-24).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            extra_args: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            # Cross-compiles with the Ubuntu-provided aarch64 GNU toolchain
            # (installed in the step below), not napi-cross's bundled sysroot:
            # that sysroot's GCC is too old to build aws-lc-sys 0.41 (missing
            # stdatomic.h, no `armv8.4-a+sha3` -march, undeclared AT_HWCAP2).
            # The stock toolchain is modern enough and still avoids QEMU.
            # Install tests on real arm64 hardware are tracked as a follow-up.
            extra_args: ''
          - target: x86_64-apple-darwin
            # Both darwin targets build on macos-14 (Apple silicon) — the
            # x86_64 build cross-compiles via the `--target` flag below.
            # macos-13 (Intel) runners are EOL on GitHub-hosted infra and
            # increasingly fail to schedule. This matches the napi-rs
            # reference template since the macos-13 deprecation.
            runner: macos-14
            extra_args: ''
          - target: aarch64-apple-darwin
            runner: macos-14
            extra_args: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            extra_args: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          target: ${{ matrix.target }}
          # The explicit rust-cache step below owns target/registry caching.
          # The setup action's built-in cache also restores ~/.cargo/bin, which
          # can poison macOS runners with a cached rustup-init shim named cargo.
          cache: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Per-target cache key — host toolchains differ enough that
          # sharing one bucket would force constant invalidation.
          shared-key: napi-${{ matrix.target }}
          # Do not cache ~/.cargo/bin. On macOS a restored cargo shim has been
          # observed resolving to rustup-init, breaking `cargo metadata` in both
          # rust-cache and @napi-rs/cli before the build starts.
          cache-bin: false

      - name: Verify cargo is not a rustup-init shim
        # Belt-and-braces for issue #1535: if anything reintroduces a cached
        # cargo shim that resolves to rustup-init, fail this step with a
        # clear, actionable error before `@napi-rs/cli` produces the cryptic
        # "unexpected argument 'metadata'" message many minutes into the
        # build. macOS is where this has actually bitten us, but the check
        # is cheap on every platform and is platform-neutral so a future
        # Linux/Windows regression of the same shape is caught too.
        shell: bash
        run: |
          set -euo pipefail
          cargo_path="$(command -v cargo)"
          echo "cargo resolves to: $cargo_path"
          # `cargo --version` succeeds on real cargo and fails (or prints
          # `rustup-init` usage) on the shim. Capture both stdout+stderr so
          # the failure mode is visible in the workflow log either way.
          if ! version_output="$(cargo --version 2>&1)"; then
            echo "::error::'cargo --version' failed at $cargo_path. \
          This usually means a rustup-init shim is on PATH (regression of #1535). \
          Check that setup-rust-toolchain's cache: false and rust-cache's cache-bin: false \
          are still in this workflow." >&2
            echo "$version_output" >&2
            exit 1
          fi
          if printf '%s' "$version_output" | grep -qi 'rustup-init'; then
            echo "::error::'cargo --version' returned rustup-init usage output \
          at $cargo_path. This is the #1535 regression — a cached cargo shim is \
          resolving to rustup-init. Restore the cache disables in this workflow." >&2
            echo "$version_output" >&2
            exit 1
          fi
          echo "$version_output"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --filter @eddacraft/anvil-checks-native --frozen-lockfile

      - name: Install aarch64 Linux cross toolchain
        # Only the aarch64-linux leg cross-compiles from an x86_64 runner.
        # Use the distro's modern aarch64 GNU toolchain and point cc-rs +
        # cargo's linker at it, so aws-lc-sys's BoringSSL C build sees a
        # compiler new enough for its ARMv8.4 crypto probes and headers.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Build napi binding
        # Matrix values are workflow-defined (no user input), but routing
        # them through env keeps the security-hook contract intact and
        # makes the run line trivially auditable.
        #
        # `--profile release-napi` (defined in workspace Cargo.toml) is
        # load-bearing: it sets `panic = "unwind"` so the
        # `catch_unwind` boundary in `scan_artifact_json` can convert a
        # scanner panic to a JS exception instead of aborting the host
        # Node process. Plain `--release` would silently drop back to
        # the workspace default `panic = "abort"` and ship an artefact
        # that crashes VSCode/MCP on any panic.
        env:
          NAPI_TARGET: ${{ matrix.target }}
          NAPI_EXTRA_ARGS: ${{ matrix.extra_args }}
        shell: bash
        run: |
          pnpm --filter @eddacraft/anvil-checks-native exec \
            napi build --platform --profile release-napi \
              --js index.js --dts index.d.ts \
              --manifest-path Cargo.toml \
              --target "$NAPI_TARGET" $NAPI_EXTRA_ARGS

      - name: Upload binding artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-binary-${{ matrix.target }}
          # Ship the .node binary together with the JS loader and TS
          # declarations the loader resolves through. `napi create-npm-dirs`
          # only scaffolds the per-platform `npm/<arch>/package.json`
          # stubs — it does NOT regenerate `index.js` / `index.d.ts`, so
          # the test job depends on the build job uploading them here.
          path: |
            ${{ env.NAPI_PACKAGE_DIR }}/*.node
            ${{ env.NAPI_PACKAGE_DIR }}/index.js
            ${{ env.NAPI_PACKAGE_DIR }}/index.d.ts
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.runner }})
    needs: build
    runs-on: ${{ matrix.runner }}
    # Pure test job: download artefact + pnpm install (no Rust
    # toolchain) + `node --test`. Warm runs finish in 1–3m. 15m is a
    # generous cap that still fails fast on a hung Node process.
    # Council review M15 (2026-04-24).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the targets where we have native runners — cross-compiled
          # arm64-linux and x64-darwin install-tests have to happen
          # elsewhere (see workflow comment + module follow-ups).
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        # No Rust toolchain is installed in this job — proves the prebuilt
        # .node loads on a host with only Node + pnpm, which is the
        # TSRET-002 validation contract.
        run: pnpm install --filter @eddacraft/anvil-checks-native --frozen-lockfile

      - name: Download binding artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: napi-binary-${{ matrix.target }}
          path: ${{ env.NAPI_PACKAGE_DIR }}

      - name: Run parity test
        working-directory: ${{ env.NAPI_PACKAGE_DIR }}
        run: pnpm test

  publish:
    name: Publish to npm
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/napi-v')
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    # Tag-gated job; ADR-030 keeps the crate private so this path is
    # dormant in practice. 30m still prevents a hung publish step from
    # squatting a runner if it ever flips live. Council review M15
    # (2026-04-24).
    timeout-minutes: 30
    permissions:
      contents: read
      # `id-token: write` is what `npm publish --provenance` needs.
      # Enable when we turn provenance on — see follow-up in TSRET-002.
      # id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --filter @eddacraft/anvil-checks-native --frozen-lockfile

      - name: Download all .node artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ env.NAPI_PACKAGE_DIR }}/artifacts
          pattern: napi-binary-*
          merge-multiple: false

      - name: Move artefacts into per-platform npm packages
        working-directory: ${{ env.NAPI_PACKAGE_DIR }}
        run: pnpm exec napi artifacts --output-dir artifacts

      - name: Publish per-platform packages
        working-directory: ${{ env.NAPI_PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec napi pre-publish --tag-style npm --no-gh-release
