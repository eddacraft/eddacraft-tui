name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    # CIB-137 SAFETY: the "Checkout trusted classifier" step in the
    # detect-changes job trusts `github.event.pull_request.base.sha` ONLY
    # because this filter restricts the PR base to the protected `main` branch,
    # so the base SHA is always a commit on a branch a PR author cannot rewrite.
    # Do NOT broaden this list (or remove the filter) without re-reviewing that
    # trust argument — allowing an unprotected base branch would let a PR point
    # the classifier at attacker-controlled code.
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Detect what changed to skip unnecessary jobs
  detect-changes:
    name: Detect Changes
    # CICD-011 council follow-up: bound the cheap classification job so a
    # stuck checkout cannot pin a runner slot near the GitHub default of
    # 360 minutes.
    timeout-minutes: 10
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      code-changed: ${{ steps.changes.outputs.code-changed }}
      source-changed: ${{ steps.changes.outputs.source-changed }}
      e2e-changed: ${{ steps.changes.outputs.e2e-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
      required-checks: ${{ steps.changes.outputs.required-checks }}
      markdownlint-required: ${{ steps.changes.outputs.markdownlint-required }}
      format-required: ${{ steps.changes.outputs.format-required }}
      lint-required: ${{ steps.changes.outputs.lint-required }}
      typecheck-required: ${{ steps.changes.outputs.typecheck-required }}
      unit-tests-required: ${{ steps.changes.outputs.unit-tests-required }}
      workflow-lint-required: ${{ steps.changes.outputs.workflow-lint-required }}
      shell-syntax-required: ${{ steps.changes.outputs.shell-syntax-required }}
      script-fixtures-required: ${{ steps.changes.outputs.script-fixtures-required }}
      dependency-audit-required: ${{ steps.changes.outputs.dependency-audit-required }}
      opa-required: ${{ steps.changes.outputs.opa-required }}
      regal-required: ${{ steps.changes.outputs.regal-required }}
      release-dry-run-required: ${{ steps.changes.outputs.release-dry-run-required }}
      infra-static-check-required: ${{ steps.changes.outputs.infra-static-check-required }}
      platform-smoke-required: ${{ steps.changes.outputs.platform-smoke-required }}
    steps:
      # Primary checkout at the PR head (or pushed SHA). This provides the
      # working tree whose diff the classifier inspects — the changed-file
      # inputs stay the PR's own actual changes.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CIB-137: resolve the required-check CLASSIFIER (this composite action
      # AND its `scripts/ci/classify-changes.sh`) from a TRUSTED ref rather than
      # the PR's own head. On `pull_request` the PR head is attacker-controlled:
      # a PR could edit `.github/actions/detect-changes/action.yml` or
      # `scripts/ci/classify-changes.sh` to always report `docs-only` / no
      # required checks and thereby skip lint/typecheck/tests/dependency-audit
      # on itself. We check the classifier out at the base SHA (the tip of the
      # target branch, which the PR cannot control — trustworthy ONLY because the
      # `pull_request` trigger is filtered to the protected `main` branch; see
      # the SAFETY note there) into a dedicated directory and invoke the action
      # FROM that checkout (see the `uses:` below). On `push` the checked-out
      # head is already trusted, so `github.sha` is used. If this checkout fails
      # the whole detect-changes job fails; the downstream required jobs guard on
      # `needs.detect-changes.result != 'success'` and run their full work (fail
      # closed). NOTE: this hardens the classifier LOGIC only — `ci.yml` itself
      # is still taken from the PR merge ref, so full tamper-resistance of the
      # wiring below requires a branch-protection/ruleset control (out of scope).
      - name: Checkout trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.sha }}
          path: trusted-classifier

      # NB: the local-action path is a STATIC literal (`uses:` cannot take an
      # expression), so it resolves to the trusted checkout for every trigger.
      # The action's own steps run with the workspace root as CWD (so its
      # `git diff` still sees the PR-head tree above), but it locates
      # `classify-changes.sh` via `$GITHUB_ACTION_PATH`, i.e. the trusted copy
      # co-located here — see action.yml.
      - name: Detect changes
        id: changes
        uses: ./trusted-classifier/.github/actions/detect-changes

  # Runs markdown lint (plus format, docs:check, APS index/lint checks) whenever
  # any `.md` change is present (or on any PR, for the required-check name).
  # The job now internally provides the "Docs Lint" required status conclusion
  # on all PRs (quick success filler path when not markdownlint-required; full
  # work otherwise). This ensures exactly one conclusion per required context
  # name (no more duplicate success+skipped from twin filler jobs). See CIB-038.
  #
  # Note: `Lint & Format` (Job 1 below) currently also runs `pnpm run lint:md`
  # as part of its PR lint step. That overlap is intentional during the
  # rejoin window — keep `Lint & Format` as the markdownlint failsafe until
  # required-status reporting on `Docs Lint` is stable. A follow-up can
  # remove the duplicate.
  docs-lint:
    name: Docs Lint
    timeout-minutes: 15
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.markdownlint-required == 'true' ||
        github.event_name == 'pull_request'
      )

    steps:
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      # Internal PR-only filler so that "Docs Lint" (a required check name) always
      # has exactly one conclusion per run. When no .md changes, this job still
      # runs (to own the name) but short-circuits with success; heavy steps are
      # step-conditional and do not execute. This eliminates the prior twin
      # `docs-lint-skip` job (same name) that produced success+skipped duplicates
      # under the ruleset. See CIB-038.
      - name: Skip (filler) when no .md changes on PR
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.markdownlint-required != 'true' &&
          needs.detect-changes.outputs.source-changed != 'true' &&
          needs.detect-changes.outputs.script-fixtures-required != 'true'
        run: |
          echo "Skipped — no .md changes detected (CIB-038)"
          echo '::notice title=Docs Lint (filler)::Job concluded success without executing docs lint/format/docs:check/APS checks. Provides the single required "Docs Lint" conclusion for docs-only PRs so the main ruleset sees CLEAN (no success+skipped duplicate). Real work only on markdownlint-required paths.'

      - name: Checkout repository
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true' ||
          needs.detect-changes.outputs.source-changed == 'true' ||
          needs.detect-changes.outputs.script-fixtures-required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true' ||
          needs.detect-changes.outputs.source-changed == 'true' ||
          needs.detect-changes.outputs.script-fixtures-required == 'true'
        uses: ./.github/actions/setup-workspace

      - name: Run markdown lint
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: pnpm run lint:md

      - name: Run format check
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: pnpm run format:check

      - name: Build docs-meta package for docs:check
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: pnpm -F @eddacraft/anvil-docs-meta build

      - name: Install the public-doc command truth binary
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        env:
          ANVIL_DOCS_VERSION: 0.9.1-beta
          ANVIL_DOCS_INSTALLER_SHA256: e609fb1b175bb047fb3e86d801b320941c6605a4ce1810c33238fbb35223dcea
        run: |
          installer_path="${RUNNER_TEMP}/eddacraft-anvil-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "${installer_path}" \
            "https://github.com/eddacraft/anvil/releases/download/v${ANVIL_DOCS_VERSION}/eddacraft-anvil-installer.sh"
          echo "${ANVIL_DOCS_INSTALLER_SHA256}  ${installer_path}" | sha256sum --check --strict
          sh "${installer_path}"
          test "$(anvil --version)" = "anvil ${ANVIL_DOCS_VERSION}"

      - name: Validate public anvil command examples
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: pnpm run docs:public:commands

      - name: Run docs:check (DOCGOV-005)
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: pnpm run docs:check

      - name: Report APS index count drift (CIB-022/025 advisory)
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: pnpm run aps:index:check

      - name: Check eddacraft-tui stability markers (TUIN-006, warn-only)
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true' ||
          needs.detect-changes.outputs.source-changed == 'true'
        run: node scripts/check-stability-markers.mjs
        continue-on-error: true

      # These are self-tests of the docs-check/active-lint tooling itself (run
      # against the live corpus only to exercise output contract/format, per
      # docs-check.test.sh's own header comment) — not a content check of this
      # PR's markdown. Gate on script-fixtures-required (scripts/**/*.mjs|.sh,
      # which covers scripts/docs/* and scripts/aps/*) instead of the much
      # broader markdownlint-required (any *.md), so a plans/*.md-only PR
      # doesn't pay for a ~280s tool self-test on every run. Content
      # correctness is unaffected: `docs:check` above still gates on
      # markdownlint-required exactly as it did before this change.
      - name: Run docs-check fixture tests
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.script-fixtures-required == 'true'
        run: pnpm run test:docs-check

      - name: Run active-lint self-test
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.script-fixtures-required == 'true'
        run: pnpm run test:aps-active-lint

      # CIB-288: `scripts/install.test.sh` predates this step and was never
      # wired anywhere, so the post-install banner — the first Anvil copy a new
      # user reads — had no gate at all. It runs the real `install.sh` against
      # a fake curl, so it is fast and needs no network.
      - name: Run install.sh tests
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.script-fixtures-required == 'true'
        run: pnpm run test:install-sh

      # The same gap as the CIB-288 note above, found by auditing all 48 shell
      # contract tests: these six had `pnpm` scripts (or none) and no workflow
      # ever invoked them, so they were unfalsifiable everywhere — a guard that
      # never runs cannot fail. The Windows package-manager guard is the costly
      # one: it protects against the v0.9.2-beta regression (the guard's own
      # `exit 0` terminating the installer before cargo-dist's body ran) and
      # the CIB-230 "no internal tracker ids in public ship artefacts" policy.
      #
      # Gated on workflow changes as well as script changes, deliberately.
      # `script-fixtures-required` fires on `scripts/**` only, but four of
      # these assert *about* workflow files — wiring them on the script gate
      # alone would rebuild the same trap one level up, where editing
      # `release.yml` skips the very test that guards it.
      #
      # All six are shell/node against fixtures: no network, no `gh`, and
      # `ci-log` sets its own git identity.
      - name: Run script contract tests
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.script-fixtures-required == 'true' ||
          needs.detect-changes.outputs.workflow-lint-required == 'true'
        run: |
          pnpm run test:windows-pm-guard
          pnpm run test:aps-drift
          pnpm run test:ci-log
          pnpm run test:ci-security-targeting
          pnpm run test:ci-rust-coverage
          pnpm run test:release-publish-contents

      # CIB-036: gate the active APS corpus on canonical `aps lint`. Check out
      # the canonical CLI (anvil-plan-spec) pinned to an IMMUTABLE commit and
      # point APS_CANONICAL_BIN at it, rather than piping a curl|bash installer
      # or tracking the mutable `main` ref. Bump this SHA intentionally when
      # adopting new canonical `aps` semantics, per the APS adoption-boundary
      # spec (plans/specs/2026-05-25-aps-cli-adoption-boundary.md).
      - name: Check out canonical aps CLI
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EddaCraft/anvil-plan-spec
          # anvil-plan-spec@main as of the E005 terminal-item exemption (PR #56).
          ref: 202d2a148538f0322727164c6fdc403952999fa0
          path: .aps-cli

      - name: Canonical APS lint (CIB-036)
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.markdownlint-required == 'true'
        run: APS_CANONICAL_BIN="$GITHUB_WORKSPACE/.aps-cli/bin/aps" pnpm run aps:active-lint

  metadata-validation:
    name: CI Metadata Checks
    timeout-minutes: 20
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: run on a FAILED classifier (result != 'success') so the fail-fast
    # step below fails this job closed instead of the whole job being skipped
    # (skipped satisfies a required context). On a successful classifier the
    # `result != 'success'` clause is false, so normal path gating is unchanged.
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.workflow-lint-required == 'true' ||
        needs.detect-changes.outputs.shell-syntax-required == 'true' ||
        needs.detect-changes.outputs.script-fixtures-required == 'true' ||
        needs.detect-changes.outputs.opa-required == 'true' ||
        needs.detect-changes.outputs.regal-required == 'true' ||
        needs.detect-changes.outputs.infra-static-check-required == 'true' ||
        needs.detect-changes.outputs.release-dry-run-required == 'true'
      )

    steps:
      # CIB-137: fail closed when change detection failed. This short-circuits
      # before the unguarded checkout/setup steps below, so on a normal run
      # (classifier success) it is skipped and behaviour is unchanged.
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Validate workflow YAML
        if: needs.detect-changes.outputs.workflow-lint-required == 'true'
        run: |
          node -e 'const fs = require("node:fs"); const yaml = require("yaml"); for (const path of process.argv.slice(1)) yaml.parse(fs.readFileSync(path, "utf8"));' \
            .github/workflows/*.yml \
            .github/actions/*/action.yml

      - name: Run shell syntax checks
        if: needs.detect-changes.outputs.shell-syntax-required == 'true'
        shell: bash
        run: |
          set -e
          git ls-files 'scripts/*.sh' 'scripts/**/*.sh' | while IFS= read -r script; do
            bash -n -- "$script"
          done
          # CIB-277: `.husky/*` classifies as a shell change, but the hooks
          # carry no `.sh` suffix, so this check skipped them entirely.
          # Parse them with `sh -n`, not `bash -n`: husky executes them via
          # `sh -e` (see `.husky/_/h`), so a bashism that `bash -n` accepts
          # would still break the hook at runtime.
          git ls-files '.husky/*' '.husky/**/*' | while IFS= read -r hook; do
            sh -n -- "$hook"
          done

      - name: Run CI script fixtures
        if:
          needs.detect-changes.outputs.script-fixtures-required == 'true' ||
          needs.detect-changes.outputs.workflow-lint-required == 'true'
        run: |
          pnpm test:ci-classify
          pnpm test:precommit-gate
          pnpm test:contributing-engines
          pnpm test:ci-cost
          pnpm test:ci-fast-pr
          pnpm test:ci-integration
          pnpm test:ci-matrix-targeting
          pnpm test:ci-drift-integration
          pnpm test:ci-workflow-contracts
          pnpm test:ci-mirror-hardening
          pnpm test:ci-infra-preview-strip
          pnpm test:ci-security-summary-gate
          pnpm test:aps-index
          pnpm test:release-sign-artefacts
          pnpm test:wt-cleanup-sweep
          pnpm test:aps-advance-released
          pnpm test:bench-parity
          pnpm test:validate-local

      - name: Install OPA
        if: needs.detect-changes.outputs.opa-required == 'true'
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.16.1

      - name: Install Regal
        if: needs.detect-changes.outputs.regal-required == 'true'
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          # Keep in sync with rust.yml's Install Regal pin.
          version: v0.41.1

      - name: Run OPA policy tests
        if: needs.detect-changes.outputs.opa-required == 'true'
        run: opa test --verbose policies/fixtures/ policies/eval/

      - name: Lint policies with Regal
        if: needs.detect-changes.outputs.regal-required == 'true'
        run: regal lint --format github policies/fixtures/ policies/eval/

      - name: Run infrastructure static checks
        if: needs.detect-changes.outputs.infra-static-check-required == 'true'
        run: pnpm lint:check

      - name: Run release script syntax check
        if: needs.detect-changes.outputs.release-dry-run-required == 'true'
        run: |
          bash -n scripts/release/*.sh

  platform-smoke:
    name: Platform Smoke
    timeout-minutes: 20
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: also run on a FAILED classifier so the fail-fast step fails this
    # job closed rather than skipping a required context.
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.platform-smoke-required == 'true'
      )

    steps:
      # CIB-137: fail closed when change detection failed (short-circuits the
      # unguarded checkout/setup below; skipped on a normal successful run).
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build native checks binding
        run: pnpm --filter @eddacraft/anvil-checks-native build:debug

      - name: Run native checks smoke tests
        run: pnpm --filter @eddacraft/anvil-checks-native test

  dependency-audit:
    name: Dependency Audit (PR)
    timeout-minutes: 15
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CICD-005: PR-only. The integration push contract delegates dependency
    # audit to security.yml's `dependency-audit` job so push events do not
    # run Trivy twice on the same SHA.
    # CIB-137: also run (and fail closed via the fail-fast step) on a FAILED
    # classifier, while staying PR-only. On a successful classifier the
    # `result != 'success'` clause is false, so path gating is unchanged.
    if: |
      always() && github.event_name == 'pull_request' && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.dependency-audit-required == 'true'
      )

    steps:
      # CIB-137: fail closed when change detection failed (short-circuits the
      # unguarded checkout below; skipped on a normal successful run).
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run dependency audit
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  aps-drift:
    name: APS Drift Check
    timeout-minutes: 10
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: `if: always()` + the fail-fast step below fail this required
    # context CLOSED when the classifier fails, instead of the job being
    # skipped (skipped satisfies the required context). The job-level
    # `continue-on-error` that previously made ALL failures non-blocking has
    # moved onto the individual drift steps, so the drift findings stay advisory
    # (CICD-011) while a classifier failure is still a hard failure here.
    if: always()
    steps:
      # CIB-137: fail closed when change detection failed.
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      # CIB-137: advisory (non-blocking) — preserves the prior job-level
      # continue-on-error posture for the drift work itself.
      - name: Checkout repository
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CICD-011 council follow-up: mirror the fallback pattern from
      # `.github/actions/detect-changes/action.yml`. On first push the
      # `before` SHA is 0000…, and on a force-push the before SHA can be
      # garbage-collected; `git diff` exits 128 in both cases. Under the
      # default `set -e` runner shell that kills the step and silently
      # drops every advisory drift finding for the run. Catch the failure
      # explicitly and fall through with an empty changed-file list so
      # drift-check.mjs still runs (it emits no `changed-file-without-aps-
      # reference` warnings for an empty list, which is the right
      # behaviour: we have no diff to analyse, not "everything is fine").
      - name: Build changed-file fixture
        continue-on-error: true
        run: |
          : > /tmp/aps-drift-files.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/aps-drift-files.txt 2>/dev/null; then
              echo "::warning::aps-drift: git diff failed against origin/${{ github.base_ref }}...HEAD (shallow clone?) — proceeding with empty changed-files list"
              : > /tmp/aps-drift-files.txt
            fi
          else
            if ! git diff --name-only "${{ github.event.before }}...${{ github.sha }}" > /tmp/aps-drift-files.txt 2>/dev/null; then
              echo "::warning::aps-drift: git diff failed against ${{ github.event.before }}...${{ github.sha }} (first push or force-push past gc'd SHA?) — proceeding with empty changed-files list"
              : > /tmp/aps-drift-files.txt
            fi
          fi

      # CICD-011: pass PR title + body so drift-check.mjs can warn when
      # a PR neither references a known APS work item nor declares
      # `Unplanned-work:`. PR body lands in a file because GitHub
      # Actions step inputs strip multi-line content and the body can
      # contain shell-significant characters.
      #
      # CICD-011 cycle-2 council: the body is intentionally never echoed
      # to stdout. The earlier `::add-mask::${PR_BODY}` attempt traded a
      # minor info-disclosure concern for an active workflow-command
      # injection vector (the runner parses `::cmd::` lines from any
      # step's stdout; a multiline body whose 2nd+ lines start with
      # `::` would be executed, and shell expansion lands line 1 in the
      # log buffer before the mask registers anyway). PR bodies are
      # already public via the GitHub UI/API — they are not a credential
      # that needs runtime masking. Keep the body in a file the rest of
      # the job can read; do not surface it via shell echo.
      #
      # Note on `ACTIONS_STEP_DEBUG=true`: when debug mode is enabled
      # the runner dumps all step env vars to the log before executing
      # the run block, so `PR_BODY` will appear verbatim. This is
      # acceptable because PR bodies are already public via the GitHub
      # UI/API; do NOT extend this pattern to genuinely sensitive
      # values, where the env-var path would itself be the leak.
      - name: Capture PR metadata
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "${PR_BODY:-}" > /tmp/aps-drift-pr-body.txt

      - name: Run warning-mode drift checks (push)
        continue-on-error: true
        if: github.event_name != 'pull_request'
        run: node scripts/aps/drift-check.mjs --changed-files /tmp/aps-drift-files.txt

      - name: Run warning-mode drift checks (PR)
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/aps/drift-check.mjs \
            --changed-files /tmp/aps-drift-files.txt \
            --pr-title "$PR_TITLE" \
            --pr-body-file /tmp/aps-drift-pr-body.txt

  # ── Job 1: Lint + Format ─────────────────────────────────────────
  # Gated on source-changed (not code-changed): pure-Rust PRs are
  # covered by rust.yml, while security.yml continues to run via
  # code-changed. Same rationale applies to typecheck/test/build below.
  lint:
    name: Lint & Format
    timeout-minutes: 30
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.lint-required == 'true' ||
        needs.detect-changes.outputs.format-required == 'true' ||
        github.event_name == 'pull_request'
      )

    steps:
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      # Internal PR-only filler so that "Lint & Format" (a required check name)
      # always has exactly one conclusion per run. On docs-only / no-lint PRs
      # this job runs (to own the name for the ruleset) but short-circuits
      # success; heavy steps are guarded and skipped. Removes the prior
      # separate `lint-skip` twin (same name) that caused success+skipped
      # duplicates. CIB-038.
      - name: Skip (filler) when no lint/format required on PR
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.lint-required != 'true' &&
          needs.detect-changes.outputs.format-required != 'true'
        run: |
          echo "Skipped — no Node/source changes detected (CIB-038)"
          echo '::notice title=Lint & Format (filler)::Job concluded success without lint/format work. Single "Lint & Format" required conclusion for the ruleset on non-lint PRs (e.g. docs-only). See CIB-038 consolidation of CICD-005 twins.'

      - name: Checkout repository
        if:
          needs.detect-changes.result != 'success' || needs.detect-changes.outputs.lint-required ==
          'true' || needs.detect-changes.outputs.format-required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        if:
          needs.detect-changes.result != 'success' || needs.detect-changes.outputs.lint-required ==
          'true' || needs.detect-changes.outputs.format-required == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          nx-shas: true

      - name: Build ESLint plugin (required by lint rules)
        if:
          needs.detect-changes.result != 'success' || needs.detect-changes.outputs.lint-required ==
          'true' || needs.detect-changes.outputs.format-required == 'true'
        run: pnpm exec nx run eslint-plugin-anvil:build

      - name: Run lint (affected on PRs, all on push)
        if:
          needs.detect-changes.result != 'success' || needs.detect-changes.outputs.lint-required ==
          'true' || needs.detect-changes.outputs.format-required == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t lint && pnpm run lint:md
          else
            pnpm run lint:check
          fi

      - name: Run format check
        if:
          needs.detect-changes.result != 'success' || needs.detect-changes.outputs.lint-required ==
          'true' || needs.detect-changes.outputs.format-required == 'true'
        run: pnpm run format:check

  # ── Job 2: Type Check ───────────────────────────────────────────
  typecheck:
    name: Type Check
    timeout-minutes: 30
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.typecheck-required == 'true' ||
        github.event_name == 'pull_request'
      )

    steps:
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      # Internal PR-only filler so "Type Check" required name always has one
      # conclusion. Short-circuits on no-typecheck PRs; heavy steps guarded.
      # Removes prior `typecheck-skip` twin. CIB-038.
      - name: Skip (filler) when no typecheck required on PR
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.typecheck-required != 'true'
        run: |
          echo "Skipped — no Node/source changes detected (CIB-038)"
          echo '::notice title=Type Check (filler)::Job concluded success without typecheck. Single required "Type Check" conclusion under the ruleset for docs/pure-Rust PRs.'

      - name: Checkout repository
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.typecheck-required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.typecheck-required == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          nx-shas: true

      - name: Run type check (affected on PRs, all on push)
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.typecheck-required == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t typecheck
          else
            pnpm run typecheck
          fi

  # ── Job 3a: Unit Tests — Ubuntu ──────────────────────────────────
  test:
    name: Unit Tests (Node 22.x, ubuntu-latest)
    timeout-minutes: 45
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.unit-tests-required == 'true' ||
        github.event_name == 'pull_request'
      )

    steps:
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      # Internal PR-only filler so "Unit Tests (Node 22.x, ubuntu-latest)"
      # required name always has exactly one conclusion per PR run.
      # Short-circuits with success on no-test PRs (docs-only, pure-Rust);
      # subsequent steps guarded so no heavy work (checkout/setup/OPA/tests).
      # Replaces the prior `test-skip` twin job. CIB-038.
      - name: Skip (filler) when no unit tests required on PR
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.unit-tests-required != 'true'
        run: |
          echo "Skipped — no Node/source changes detected (CIB-038)"
          echo '::notice title=Unit Tests (filler)::Job concluded success without running tests. Single "Unit Tests (Node 22.x, ubuntu-latest)" required conclusion for the ruleset on non-test PRs. (Heavy test steps guarded; see CIB-038.)'

      - name: Checkout repository
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A PR touching a root input (e.g. flags/manifest.json → kernel-types
      # build.rs) makes EVERY nx project affected, so this job compiles the
      # full Rust test surface alongside the Node suites and can exhaust the
      # ubuntu-latest runner disk (3× ENOSPC on PR #3287). Same mitigation the
      # `Test` job (rust-tests.yml) already applies.
      - name: Free disk space
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        uses: ./.github/actions/free-disk-space

      # Run the pin guard before any expensive setup so a stray version
      # reference fails fast without burning ~2-3 minutes on pnpm + OPA install.
      # Invoke via `sh` so this doesn't depend on the executable bit surviving
      # checkout (e.g. on Windows runners / some git configurations).
      - name: Check OPA version pin is not duplicated outside allowlist
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        run: sh scripts/check-opa-version-pin.sh

      - name: Setup workspace
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          nx-shas: true

      - name: Install OPA
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v1.16.1

      - name: Verify OPA version
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        env:
          EXPECTED_OPA_VERSION: '1.16.1'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      # Pre-build the dist-only workspace packages that affected vitest suites
      # import by their published `dist/` entry. `nx affected -t test` declares
      # `^build`, but on a cache hit nx restores the "build succeeded" marker
      # without the `dist/` outputs present, so the import resolves to nothing
      # and the suite collects 0 tests (e.g. `@eddacraft/anvil-flags-catalogue`,
      # consumed by apps/anvil-api after the FLAGCAT migration). Force-building
      # them here every run guarantees the entry exists. Use the nx project name
      # (`flags-catalogue` overrides the package name in its project.json).
      - name: Build test dependencies
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        run: pnpm exec nx run-many -t build --projects=@eddacraft/transactional,flags-catalogue

      # Rust crates are excluded here because the dedicated Rust workflow
      # (.github/workflows/rust.yml) already runs `cargo check` / `cargo test`
      # / `cargo clippy` / `cargo fmt` against the workspace. Once the
      # nxrust landed, all 9 crates became Nx projects
      # with `test` targets, so this job started double-running them — and
      # the runner ran out of disk during Nx's workspace-data SQLite write.
      # CICD-006: coverage moved to nightly assurance (ci-nightly.yml).
      # PR/integration push runs use plain tests — no --coverage flags,
      # no coverage summary, no coverage artefact upload.
      - name: Run unit tests (affected on PRs, all on push)
        if:
          needs.detect-changes.result != 'success' ||
          needs.detect-changes.outputs.unit-tests-required == 'true'
        run: |
          RUST_EXCLUDES=(
            --exclude=eddacraft-anvil-architecture
            --exclude=eddacraft-anvil-kernel-types
            --exclude=eddacraft-anvil-checks
            --exclude=eddacraft-anvil-checks-ast
            --exclude=eddacraft-anvil-checks-napi
            --exclude=eddacraft-anvil-kernel
            --exclude=eddacraft-anvil-policy
            --exclude=eddacraft-anvil
            --exclude=eddacraft-anvil-tui
            --exclude=anvil-bench
            --exclude=anvil-spike
          )
          # The napi binding ships its own .github/workflows/napi.yml that
          # builds the .node artefact then runs `pnpm test`. The standard
          # test workflow can't run it because the .node binary isn't built
          # here — exclude both the cargo-side project (RUST_EXCLUDES above)
          # and the npm-side workspace package.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t test --exclude=@eddacraft/anvil-e2e --exclude=@eddacraft/anvil-checks-native "${RUST_EXCLUDES[@]}"
          else
            pnpm exec nx run-many -t test --exclude=@eddacraft/anvil-e2e --exclude=@eddacraft/anvil-checks-native "${RUST_EXCLUDES[@]}"
          fi

  # NOTE: Cross-platform (macOS/Windows) and Node 22+ tests moved to
  # nightly workflow (ci-nightly.yml) to save CI minutes.
  # macOS = 10x multiplier, Windows = 2x — running on every push was
  # consuming ~40k included minutes/month.

  # ── Job 3b: Release gate — cross-platform ──
  # The gate fires on release-class PRs only. Normal `feat/*` / `fix/*`
  # / `docs/*` / `chore/*` PRs to `main` do not fire the gate; only
  # `release/*` and `hotfix/*` head patterns do.
  #
  # CI-cost 2026-07: pushes to `main` no longer fire the gate. At ~90
  # merges/day the per-merge macOS (10x) + Windows (2x) legs duplicated
  # ci-nightly.yml's `test-cross-platform` job (same matrix, same
  # `pnpm run test:js -- --run` surface) at ~two orders of magnitude
  # higher frequency. Cross-platform Node regressions on `main` now
  # surface via the nightly run; release-class PRs still pay the full
  # matrix before a release ships.
  #
  # The `head.repo.full_name == github.repository` clause makes this
  # gate self-defending: a fork PR cannot trigger the expensive macOS
  # + Windows matrix by naming its head `release/*` / `hotfix/*`. The
  # full-name comparison is preferred over `head.repo.fork == false`
  # because the former works uniformly against both upstream forks and
  # same-org fork repos.
  #
  # CICD-008: additionally gate on `source-changed` so docs-only
  # release PRs and docs-only release-sync pushes do not spin up the
  # macOS (10x) + Windows (2x) matrix when no Node source moved.
  test-release-gate:
    name: Release Gate (Node 22.x, ${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    needs: detect-changes
    # CIB-156: also run on a FAILED classifier (result != 'success') so the
    # fail-fast step below fails this gate closed instead of silently skipping
    # it. The fail-closed clause is deliberately kept INSIDE the
    # release/hotfix-PR trigger context: a release-PR author must not be able
    # to skip the cross-platform gate by tampering with or inducing a failure
    # in the classifier, but an ordinary feature PR that trips the classifier
    # already goes red via the lint/typecheck/unit-tests guards, so we do not
    # spin this heavy macOS+Windows matrix up on every classifier hiccup. On a
    # successful classifier `result != 'success'` is false, so normal
    # `source-changed` gating is unchanged.
    if: |
      always() && (
        github.event_name == 'pull_request' && github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'release/') ||
         startsWith(github.head_ref, 'hotfix/'))
      ) && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.source-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest

    steps:
      # CIB-156: fail closed when change detection failed. Runs as the first
      # step of every matrix leg, short-circuiting before the unguarded
      # checkout/setup below; skipped on a normal successful run.
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v1.16.1

      - name: Verify OPA version
        shell: bash
        env:
          EXPECTED_OPA_VERSION: '1.16.1'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Run unit tests
        run: pnpm run test:js -- --run

  # ── Job 4: Build ─────────────────────────────────────────────────
  build:
    name: Build (Node 22.x)
    timeout-minutes: 30
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-156: also run on a FAILED classifier so the fail-fast step below fails
    # this job closed rather than silently skipping it. The fail-closed clause
    # stays scoped to non-PR events (this job never runs on `pull_request`), so
    # PR gating is unchanged. On a successful classifier `result != 'success'`
    # is false and normal `source-changed` gating is unchanged.
    if: |
      always() && github.event_name != 'pull_request' && (
        needs.detect-changes.result != 'success' ||
        needs.detect-changes.outputs.source-changed == 'true'
      )

    steps:
      # CIB-156: fail closed when change detection failed (short-circuits the
      # unguarded checkout/setup below; skipped on a normal successful run).
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build all packages
        run: pnpm run build

  # ── Job 5: E2E harness ──────────────────────────────────────────
  # Cross-surface TypeScript E2E tests (apps/e2e) — runs when any TS
  # source or the harness itself changes. CLI suites are Rust-only and
  # skip themselves when the anvil binary is absent (see apps/e2e helpers),
  # so the Rust CLI is not required in this job.
  e2e-harness:
    name: E2E Harness (Node 22.x)
    timeout-minutes: 30
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # CIB-137: also run (and fail closed via the fail-fast step) on a FAILED
    # classifier rather than skipping this required context. On a successful
    # classifier the `result != 'success'` clause is false, so the normal
    # PR/push path gating is unchanged.
    if: |
      always() && (
        needs.detect-changes.result != 'success' ||
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.e2e-changed == 'true') ||
        (github.event_name != 'pull_request' && (needs.detect-changes.outputs.source-changed == 'true' || needs.detect-changes.outputs.e2e-changed == 'true'))
      )

    steps:
      # CIB-137: fail closed when change detection failed (short-circuits the
      # unguarded checkout/setup below; skipped on a normal successful run).
      - name: Fail when change detection failed
        if: needs.detect-changes.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run E2E harness
        run: pnpm --filter @eddacraft/anvil-e2e test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          # Matches the outputFile.json target in apps/e2e/vitest.config.ts,
          # which resolves to the repo-root coverage/ directory.
          path: coverage/e2e-results.json
          if-no-files-found: warn

  # NOTE: Playwright E2E (e2e-tests) and TUI E2E (tui-tests) jobs removed
  # pre-beta. Playwright: no tests written yet — re-add when website E2E
  # exists. TUI tests: were cargo test in a Node job — covered by rust.yml.

  # ── Integration Readiness Summary ────────────────────────────────
  # CICD-005: distinct readiness contract for the merged integration SHA.
  # Push to the integration branch (`dev` during migration, `main` after
  # OPMODEL-012) emits a single summary block naming the SHA and the
  # validation jobs that proved it. PR runs do not need this — PR
  # commentary is owned by labeler/security summary, and PR validation
  # already reports per-job status.
  #
  # `if: always() && ...` so the summary is recorded even when one of the
  # gating jobs failed or was skipped (e.g. docs-lint doesn't run for a
  # code-only push). The final step still fails the job if any upstream
  # job failed, so integration push failures remain visible at the
  # commit level.
  integration-readiness:
    name: Integration Readiness
    # CICD-011 council follow-up: this job is push-only; simplifying the
    # runner expression removes the dead `pull_request.head.repo.fork`
    # branch that was inherited from PR-capable jobs.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # CICD-011 council follow-up: bound the aggregator so a stuck upstream
    # job cannot pin the runner near GitHub's 360-minute default. The
    # job itself is pure bash; 20 minutes leaves headroom for upstream
    # `needs` resolution.
    timeout-minutes: 20
    if: always() && github.event_name == 'push'
    needs:
      - detect-changes
      - docs-lint
      - metadata-validation
      - platform-smoke
      - aps-drift
      - lint
      - typecheck
      - test
      - build
      - e2e-harness
    steps:
      - name: Emit integration readiness summary
        env:
          INTEGRATION_SHA: ${{ github.sha }}
          INTEGRATION_REF: ${{ github.ref }}
          INTEGRATION_RUN_ID: ${{ github.run_id }}
          INTEGRATION_SERVER_URL: ${{ github.server_url }}
          INTEGRATION_REPO: ${{ github.repository }}
          DOCS_LINT_RESULT: ${{ needs.docs-lint.result }}
          METADATA_RESULT: ${{ needs.metadata-validation.result }}
          PLATFORM_SMOKE_RESULT: ${{ needs.platform-smoke.result }}
          APS_DRIFT_RESULT: ${{ needs.aps-drift.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e-harness.result }}
        shell: bash
        run: |
          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          summary "## Integration Readiness (Node side)"
          summary ""
          summary "**SHA:** \`${INTEGRATION_SHA}\`"
          summary "**Ref:** \`${INTEGRATION_REF}\`"
          summary "**Run:** [${INTEGRATION_RUN_ID}](${INTEGRATION_SERVER_URL}/${INTEGRATION_REPO}/actions/runs/${INTEGRATION_RUN_ID})"
          summary ""
          summary "Per the CI/CD operating model, push validation proves the"
          summary "merged integration SHA on the **Node / TypeScript** surface."
          summary "Rust validation (\`cargo check/test/clippy/fmt\`, Hakari,"
          summary "cargo-deny, acknowledgements, cross-compile) is owned by"
          summary "\`rust.yml\` and is intentionally not aggregated here —"
          summary "a Rust-only push will show all rows below as \`skipped\`"
          summary "and the authoritative gate lives in the \`Rust\` workflow."
          summary ""
          summary "**Parallel release gate:** \`Release Gate (Node 22.x, macos-latest)\`"
          summary "and \`Release Gate (Node 22.x, windows-latest)\` run in parallel"
          summary "on release-class PRs (cross-platform coverage for \`main\` runs"
          summary "nightly in \`ci-nightly.yml\`). Those are release-gate evidence"
          summary "and are intentionally NOT aggregated by this summary — check"
          summary "their job statuses for cross-platform integration evidence."
          summary ""
          summary "PR-only quick-skip paths inside the primary required jobs"
          summary "(Lint & Format, Type Check, Unit Tests, Docs Lint) and PR"
          summary "commentary (Dependency Audit (PR), Security Summary) are"
          summary "intentionally absent on push."
          summary ""
          summary "| Job | Result |"
          summary "| --- | --- |"
          summary "| Docs Lint | ${DOCS_LINT_RESULT} |"
          summary "| CI Metadata Checks | ${METADATA_RESULT} |"
          summary "| Platform Smoke | ${PLATFORM_SMOKE_RESULT} |"
          summary "| APS Drift Check | ${APS_DRIFT_RESULT} |"
          summary "| Lint & Format | ${LINT_RESULT} |"
          summary "| Type Check | ${TYPECHECK_RESULT} |"
          summary "| Unit Tests (Node 22.x, ubuntu-latest) | ${TEST_RESULT} |"
          summary "| Build (Node 22.x) | ${BUILD_RESULT} |"
          summary "| E2E Harness (Node 22.x) | ${E2E_RESULT} |"

      - name: Fail if any required integration job failed
        env:
          DOCS_LINT_RESULT: ${{ needs.docs-lint.result }}
          METADATA_RESULT: ${{ needs.metadata-validation.result }}
          PLATFORM_SMOKE_RESULT: ${{ needs.platform-smoke.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e-harness.result }}
        shell: bash
        run: |
          # `aps-drift` is intentionally excluded — it is continue-on-error
          # warning-mode evidence per CICD-011, not a blocking gate.
          failed=0
          for label_result in \
            "Docs Lint:${DOCS_LINT_RESULT}" \
            "CI Metadata Checks:${METADATA_RESULT}" \
            "Platform Smoke:${PLATFORM_SMOKE_RESULT}" \
            "Lint & Format:${LINT_RESULT}" \
            "Type Check:${TYPECHECK_RESULT}" \
            "Unit Tests:${TEST_RESULT}" \
            "Build:${BUILD_RESULT}" \
            "E2E Harness:${E2E_RESULT}"; do
            label="${label_result%%:*}"
            result="${label_result##*:}"
            # `skipped` is acceptable (path-gated job did not need to run).
            # `success` is acceptable. `failure` / `cancelled` / any other
            # value fails the contract. GitHub Actions never emits an
            # empty result, so the case statement does not whitelist `''`.
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Integration readiness failed: ${label} reported ${result}"
                failed=1
                ;;
            esac
          done
          exit "$failed"
