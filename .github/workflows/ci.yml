name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  actions: read
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Detect what changed to skip unnecessary jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      code-changed: ${{ steps.filter.outputs.code-changed }}
      e2e-changed: ${{ steps.filter.outputs.e2e-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
          fi

          # Get list of changed files (full clone ensures merge-base is available)
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$CHANGED_FILES" ]; then
            echo "⚠️  git diff failed or empty — falling back to GitHub API"
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              CHANGED_FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null || echo "")
            fi
          fi

          # Check if only docs changed
          DOCS_ONLY=true
          CODE_CHANGED=false
          E2E_CHANGED=false

          while IFS= read -r file; do
            if [[ -n "$file" ]]; then
              # Docs-only patterns
              if [[ "$file" =~ \.(md|txt)$ ]] || \
                 [[ "$file" =~ ^docs/ ]] || \
                 [[ "$file" =~ ^plans/ ]] || \
                 [[ "$file" == "README.md" ]] || \
                 [[ "$file" == "AGENTS.md" ]] || \
                 [[ "$file" == "CLAUDE.md" ]] || \
                 [[ "$file" == "LICENSE" ]]; then
                continue
              else
                DOCS_ONLY=false
                CODE_CHANGED=true
              fi

              # E2E-related patterns
              if [[ "$file" =~ ^e2e/ ]] || \
                 [[ "$file" == "playwright.config.ts" ]]; then
                E2E_CHANGED=true
              fi
            fi
          done <<< "$CHANGED_FILES"

          echo "docs-only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          echo "code-changed=$CODE_CHANGED" >> $GITHUB_OUTPUT
          echo "e2e-changed=$E2E_CHANGED" >> $GITHUB_OUTPUT

          echo "📊 Change Detection Results:"
          echo "  Docs only: $DOCS_ONLY"
          echo "  Code changed: $CODE_CHANGED"
          echo "  E2E changed: $E2E_CHANGED"

  # Docs-only job: just linting
  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run markdown lint
        run: pnpm run lint:md

      - name: Run format check
        run: pnpm run format:check

  # ── Shared setup via reusable anchor ──────────────────────────────
  # The four parallel quality-gate jobs below all share the same
  # checkout → pnpm → node → install preamble.

  # ── Job 1: Lint + Format (Node-version independent) ──────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eslint-plugin-anvil
        run: pnpm -F eslint-plugin-anvil build

      - name: Run lint
        run: pnpm run lint:check

      - name: Run format check
        run: pnpm run format:check

  # ── Job 2: Type Check (Node-version independent) ─────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run typecheck

  # ── Job 3: Unit Tests (matrix: Node 20 + 22) ────────────────────
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test -- --run --coverage

      - name: Upload coverage reports
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/

  # ── Job 4: Build (matrix: Node 20 + 22, uses Nx Cloud cache) ────
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  # ── E2E Tests (runs in parallel, no longer blocked on lint/test) ─
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.code-changed == 'true' &&
      needs.detect-changes.outputs.e2e-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Cross-surface E2E harness (apps/e2e)
  # Disabled: smoke tests need stabilisation (adapter API drift, fixture schema drift).
  # Re-enable once apps/e2e is brought up to date with the current package APIs.
  e2e-harness:
    name: E2E Harness
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-test]
    if: false # needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Run E2E smoke tests
        run: pnpm run test:e2e:smoke

      - name: Run full E2E harness
        run: pnpm run test:e2e:harness
        timeout-minutes: 10

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-harness-results
          path: coverage/e2e-results.json
          retention-days: 30

  # TUI E2E tests using tuistory
  tui-tests:
    name: TUI E2E Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install system dependencies for node-pty
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild node-pty for tuistory
        run: |
          if [ -d "node_modules/tuistory/node_modules/node-pty" ]; then
            cd node_modules/tuistory/node_modules/node-pty && npm rebuild
          else
            echo "node-pty directory not found at node_modules/tuistory/node_modules/node-pty, skipping rebuild."
          fi

      - name: Build CLI
        run: pnpm build

      # continue-on-error: this is a PoC integration of tuistory;
      # failures should not block CI until the tests are stabilised.
      - name: Run TUI E2E tests
        run: |
          pnpm vitest run "apps/anvil-cli/src/__tests__/e2e/**/*.tuistory.e2e.test.ts"
        timeout-minutes: 10
        continue-on-error: true
