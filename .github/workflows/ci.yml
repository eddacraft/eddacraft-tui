name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Detect what changed to skip unnecessary jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      code-changed: ${{ steps.changes.outputs.code-changed }}
      source-changed: ${{ steps.changes.outputs.source-changed }}
      e2e-changed: ${{ steps.changes.outputs.e2e-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  # Docs-only job: just linting
  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run markdown lint
        run: pnpm run lint:md

      - name: Run format check
        run: pnpm run format:check

  # ── Shared setup (duplicated in each job) ────────────────────────

  # ── Job 1: Lint + Format (Node-version independent) ──────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build ESLint plugin (required by lint rules)
        run: pnpm exec nx run eslint-plugin-anvil:build

      - name: Run lint (affected on PRs, all on push)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t lint && pnpm run lint:md
          else
            pnpm run lint:check
          fi

      - name: Run format check
        run: pnpm run format:check

  # ── Job 2: Type Check (Node-version independent) ─────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run type check (affected on PRs, all on push)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t typecheck
          else
            pnpm run typecheck
          fi

  # Placeholder: satisfy required check when unit test matrix is skipped.
  # When a matrix job is skipped, GitHub Actions does not resolve matrix
  # ── Skip jobs for required checks on docs-only PRs ────────────────
  # The branch ruleset requires these check names to report a status.
  # When no code changes are detected, the real jobs are skipped, so these
  # lightweight jobs fill the gap to unblock merges.
  lint-skip:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed != 'true'
    steps:
      - run: echo "Skipped — no code changes detected"

  typecheck-skip:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed != 'true'
    steps:
      - run: echo "Skipped — no code changes detected"

  test-skip:
    name: Unit Tests (Node 22.x, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed != 'true'
    steps:
      - run: echo "Skipped — no code changes detected"

  # ── Job 3a: Unit Tests — Ubuntu (always runs when code changes) ──
  test:
    name: Unit Tests (Node ${{ matrix.node-version }}, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build test dependencies
        run: pnpm exec nx run-many -t build --projects=@eddacraft/transactional

      - name: Run unit tests (affected on PRs, all on push)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t test --exclude=@eddacraft/anvil-e2e -- --run --coverage
          else
            pnpm run test -- --run --coverage
          fi

      - name: Upload coverage reports
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/

  # NOTE: Cross-platform (macOS/Windows) and Node 22+ tests moved to
  # nightly workflow (ci-nightly.yml) to save CI minutes.
  # macOS = 10x multiplier, Windows = 2x — running on every push was
  # consuming ~40k included minutes/month.

  # ── Job 3b: Release gate — cross-platform (only PRs targeting main) ──
  test-release-gate:
    name: Release Gate (Node 22.x, ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Run unit tests
        run: pnpm run test -- --run

  # ── Job 4: Build (matrix: Node 20, uses Azure remote cache) ──
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Build all packages
        run: pnpm run build

  # ── E2E Tests (runs in parallel, no longer blocked on lint/test) ─
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.code-changed == 'true' &&
      needs.detect-changes.outputs.e2e-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Cross-surface E2E harness (apps/e2e)
  # Disabled: smoke tests need stabilisation (adapter API drift, fixture schema drift).
  # Re-enable once apps/e2e is brought up to date with the current package APIs.
  e2e-harness:
    name: E2E Harness
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: false # needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Build all packages
        run: pnpm run build

      - name: Run E2E smoke tests
        run: pnpm run test:e2e:smoke

      - name: Run full E2E harness
        run: pnpm run test:e2e:harness
        timeout-minutes: 10

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-harness-results
          path: coverage/e2e-results.json
          retention-days: 30

  # TUI E2E tests using tuistory
  tui-tests:
    name: TUI E2E Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies for node-pty
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild node-pty for tuistory
        run: |
          if [ -d "node_modules/tuistory/node_modules/node-pty" ]; then
            cd node_modules/tuistory/node_modules/node-pty && npm rebuild
          else
            echo "node-pty directory not found at node_modules/tuistory/node_modules/node-pty, skipping rebuild."
          fi

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        with:
          creds:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Build CLI
        run: pnpm build

      - name: Run Rust tests for TUI and CLI
        run: cargo test -p anvil-tui -p anvil-cli
        timeout-minutes: 10
