name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Detect what changed to skip unnecessary jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      code-changed: ${{ steps.changes.outputs.code-changed }}
      source-changed: ${{ steps.changes.outputs.source-changed }}
      e2e-changed: ${{ steps.changes.outputs.e2e-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  # Docs-only job: just linting
  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run markdown lint
        run: pnpm run lint:md

      - name: Run format check
        run: pnpm run format:check

  # ── Job 1: Lint + Format ─────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    # Azure credentials are passed as a single input to setup-workspace
    # rather than as job-scope env vars, to limit their visibility to the
    # Azure Login step only.

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'
          nx-shas: true

      - name: Build ESLint plugin (required by lint rules)
        run: pnpm exec nx run eslint-plugin-anvil:build

      - name: Run lint (affected on PRs, all on push)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t lint && pnpm run lint:md
          else
            pnpm run lint:check
          fi

      - name: Run format check
        run: pnpm run format:check

  # ── Job 2: Type Check ───────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    # Azure credentials are passed as a single input to setup-workspace
    # rather than as job-scope env vars, to limit their visibility to the
    # Azure Login step only.

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'
          nx-shas: true

      - name: Run type check (affected on PRs, all on push)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t typecheck
          else
            pnpm run typecheck
          fi

  # ── Skip jobs for required checks on docs-only PRs ────────────────
  # The branch ruleset requires these check names to report a status.
  # When no code changes are detected, the real jobs are skipped, so these
  # lightweight jobs fill the gap to unblock merges.
  lint-skip:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed != 'true'
    steps:
      - run: echo "Skipped — no code changes detected"

  typecheck-skip:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed != 'true'
    steps:
      - run: echo "Skipped — no code changes detected"

  test-skip:
    name: Unit Tests (Node 22.x, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed != 'true'
    steps:
      - run: echo "Skipped — no code changes detected"

  # ── Job 3a: Unit Tests — Ubuntu ──────────────────────────────────
  test:
    name: Unit Tests (Node 22.x, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    # Azure credentials are passed as a single input to setup-workspace
    # rather than as job-scope env vars, to limit their visibility to the
    # Azure Login step only.

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'
          nx-shas: true

      - name: Install OPA
        uses: open-policy-agent/setup-opa@950f159a49aa91f9323f36f1de81c7f6b5de9576 # v2.3.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v0.60.0

      - name: Verify OPA version
        env:
          EXPECTED_OPA_VERSION: '0.60.0'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Build test dependencies
        run: pnpm exec nx run-many -t build --projects=@eddacraft/transactional

      - name: Run unit tests (affected on PRs, all on push)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t test --exclude=@eddacraft/anvil-e2e \
              -- --run --coverage --coverage.reporter=json-summary --coverage.reporter=text
          else
            pnpm run test -- --run --coverage --coverage.reporter=json-summary --coverage.reporter=text
          fi

      - name: TypeScript coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### TypeScript Coverage"
            echo
            echo "<details><summary>Per-project line/branch/function/statement coverage</summary>"
            echo
            echo "| Project | Lines | Branches | Functions | Statements |"
            echo "| ------- | -----:| --------:| ---------:| ----------:|"
            found=0
            while IFS= read -r f; do
              found=1
              proj=$(dirname "$(dirname "$f")")
              proj=${proj#./}
              [ -z "$proj" ] && proj=.
              row=$(jq -r '.total | "| \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.statements.pct)% |"' "$f" 2>/dev/null || echo "| — | — | — | — |")
              echo "| \`$proj\` $row"
            done < <(find . -path '*/coverage/coverage-summary.json' \
              -not -path '*/node_modules/*' \
              -not -path '*/.nx/*' \
              -not -path '*/dist/*' | sort)
            if [ "$found" = "0" ]; then
              echo "| _no coverage summaries found_ | — | — | — | — |"
            fi
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-22.x
          path: |
            coverage/
            packages/**/coverage/
            apps/**/coverage/

  # NOTE: Cross-platform (macOS/Windows) and Node 22+ tests moved to
  # nightly workflow (ci-nightly.yml) to save CI minutes.
  # macOS = 10x multiplier, Windows = 2x — running on every push was
  # consuming ~40k included minutes/month.

  # ── Job 3b: Release gate — cross-platform (only PRs targeting main) ──
  test-release-gate:
    name: Release Gate (Node 22.x, ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: detect-changes
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest
    # Azure credentials are passed as a single input to setup-workspace
    # rather than as job-scope env vars, to limit their visibility to the
    # Azure Login step only.

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Install OPA
        uses: open-policy-agent/setup-opa@950f159a49aa91f9323f36f1de81c7f6b5de9576 # v2.3.0
        with:
          # Pinned to DEFAULT_OPA_VERSION in packages/anvil/policy/src/opa-binary-manager.ts
          version: v0.60.0

      - name: Verify OPA version
        shell: bash
        env:
          EXPECTED_OPA_VERSION: '0.60.0'
        run: |
          installed=$(opa version | awk '/^Version:/ {print $2}')
          if [ "$installed" != "$EXPECTED_OPA_VERSION" ]; then
            echo "::error::OPA version mismatch: installed=$installed expected=$EXPECTED_OPA_VERSION"
            exit 1
          fi
          echo "OPA $installed installed"

      - name: Run unit tests
        run: pnpm run test -- --run

  # ── Job 4: Build ─────────────────────────────────────────────────
  build:
    name: Build (Node 22.x)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    # Azure credentials are passed as a single input to setup-workspace
    # rather than as job-scope env vars, to limit their visibility to the
    # Azure Login step only.

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Build all packages
        run: pnpm run build

  # ── Job 5: E2E harness ──────────────────────────────────────────
  # Cross-surface TypeScript E2E tests (apps/e2e) — runs when any TS
  # source or the harness itself changes. CLI suites are Rust-only and
  # skip themselves when the anvil binary is absent (see apps/e2e helpers),
  # so the Rust CLI is not required in this job.
  e2e-harness:
    name: E2E Harness (Node 22.x)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.source-changed == 'true' ||
      needs.detect-changes.outputs.e2e-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          azure-login: true
          azure-credentials:
            '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{
            secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID
            }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Run E2E harness
        run: pnpm --filter @eddacraft/anvil-e2e test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          # Matches the outputFile.json target in apps/e2e/vitest.config.ts,
          # which resolves to the repo-root coverage/ directory.
          path: coverage/e2e-results.json
          if-no-files-found: warn

  # NOTE: Playwright E2E (e2e-tests) and TUI E2E (tui-tests) jobs removed
  # pre-beta. Playwright: no tests written yet — re-add when website E2E
  # exists. TUI tests: were cargo test in a Node job — covered by rust.yml.
