# Sign release artefacts with minisign and upload the detached .minisig
# files back to the GitHub Release. See ADR-045 and DISTRIB-001.
#
# This workflow runs after `release.yml` publishes a release. It is
# intentionally separate so the cargo-dist-generated workflow stays
# auto-managed and unaffected.

name: Release — sign artefacts

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sign (e.g. v0.7.0-beta)'
        required: true
      run_id:
        description: 'Successful tag-triggered Release workflow run ID'
        required: true

permissions:
  contents: write

concurrency:
  group: release-sign-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign installer artefacts
    runs-on: ubuntu-22.04
    if:
      ${{ (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v')) ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event ==
      'push' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
      RELEASE_RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout (for verification helpers)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify required secrets are configured
        env:
          ANVIL_MINISIGN_PRIVATE_KEY: ${{ secrets.ANVIL_MINISIGN_PRIVATE_KEY }}
          ANVIL_MINISIGN_PUBLIC_KEY: ${{ vars.ANVIL_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANVIL_MINISIGN_PRIVATE_KEY:-}" ] || missing+=("secrets.ANVIL_MINISIGN_PRIVATE_KEY")
          [ -n "${ANVIL_MINISIGN_PUBLIC_KEY:-}" ] || missing+=("vars.ANVIL_MINISIGN_PUBLIC_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release signing aborted — missing configuration: ${missing[*]}"
            echo "::error::See ADR-045 for the key-custody runbook."
            exit 1
          fi

      - name: Refuse to sign a build still using the development public key
        env:
          ANVIL_MINISIGN_PUBLIC_KEY: ${{ vars.ANVIL_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          DEV_KEY="RWRbilgipcbv8egsndfKxcAxjJCTusQPh/IsOy6ROFDiqvz8QNCVZRZ5"
          if [ "${ANVIL_MINISIGN_PUBLIC_KEY}" = "${DEV_KEY}" ]; then
            echo "::error::Refusing to sign — ANVIL_MINISIGN_PUBLIC_KEY is still the committed development fallback."
            echo "::error::Generate a real release keypair offline (see ADR-045), set the secret + var, and re-run."
            exit 1
          fi

      - name: Install rsign (minisign in Rust)
        # CIB-120: pin the exact crate version so the signing job cannot be
        # fed a newer, unreviewed rsign2 release at install time. cargo
        # verifies the downloaded crate tarball against the checksum recorded
        # in the sparse registry index, and `--locked` pins its dependency
        # tree to the published lockfile.
        # To update: vet the new release, then bump the `=X.Y.Z` pin.
        run: cargo install rsign2 --version =0.6.6 --locked

      - name: Resolve release target commit
        id: release
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")
          run_name=$(jq -r '.name' <<< "$run_json")
          run_event=$(jq -r '.event' <<< "$run_json")
          run_conclusion=$(jq -r '.conclusion' <<< "$run_json")
          run_tag=$(jq -r '.head_branch' <<< "$run_json")
          commit_sha=$(jq -r '.head_sha' <<< "$run_json")
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')

          [ "$run_name" = "Release" ] || {
            echo "::error::Run ${RELEASE_RUN_ID} is '${run_name}', not the Release workflow."
            exit 1
          }
          [ "$run_event" = "push" ] && [ "$run_conclusion" = "success" ] || {
            echo "::error::Run ${RELEASE_RUN_ID} is not a successful tag-triggered push run."
            exit 1
          }
          [ "$run_tag" = "$TAG" ] || {
            echo "::error::Run ${RELEASE_RUN_ID} built ${run_tag}, not ${TAG}."
            exit 1
          }
          if [[ ! "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Run ${RELEASE_RUN_ID} does not expose a valid source SHA."
            exit 1
          fi
          if [ "$tag_sha" != "$commit_sha" ]; then
            echo "::error::Tag ${TAG} now resolves to ${tag_sha}, but run ${RELEASE_RUN_ID} built ${commit_sha}."
            exit 1
          fi
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${RELEASE_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download release assets
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets public-assets
          # We sign two classes of asset:
          #   * Installer scripts (cargo-dist outputs). These cover the
          #     binary chain of trust because the installer scripts
          #     already SHA256-verify the binary tarballs they download.
          #   * Build provenance manifests (#1217). The manifest binds
          #     public artefacts to the private source commit and tree
          #     they were built from; signing it lets downstream
          #     verifiers trust the binding without trusting the
          #     containing GitHub Release.
          required_assets=(
            "eddacraft-anvil-installer.sh"
            "eddacraft-anvil-installer.ps1"
            "anvil-${TAG}-provenance.json"
          )
          for asset in "${required_assets[@]}"; do
            echo "Fetching private ${asset}"
            gh release download "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" \
              --dir assets
            echo "Fetching public ${asset}"
            gh release download "${TAG}" \
              --repo eddacraft/anvil \
              --pattern "${asset}" \
              --dir public-assets
          done

          bash scripts/release/validate-signing-inputs.sh \
            --tag "${TAG}" \
            --source-sha "${{ steps.release.outputs.commit_sha }}" \
            --run-id "${{ steps.release.outputs.run_id }}" \
            --private-dir assets \
            --public-dir public-assets

      - name: Validate decoded minisign secret-key structure
        env:
          ANVIL_MINISIGN_PRIVATE_KEY: ${{ secrets.ANVIL_MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANVIL_MINISIGN_PRIVATE_KEY}" | base64 -d > "${RUNNER_TEMP}/anvil-release.key"

          first_line=$(sed -n '1p' "${RUNNER_TEMP}/anvil-release.key")
          key_material=$(sed -n '2p' "${RUNNER_TEMP}/anvil-release.key")
          third_line=$(sed -n '3p' "${RUNNER_TEMP}/anvil-release.key")
          if [[ ! "${first_line}" =~ ^untrusted\ comment:.*secret\ key$ ]] || \
            [ -z "${key_material}" ] || [ -n "${third_line}" ]; then
            echo "::error::Decoded secret-key file does not have the expected two-line minisign structure."
            exit 1
          fi

          if ! printf '%s' "${key_material}" | base64 -d > "${RUNNER_TEMP}/anvil-release.key.raw"; then
            echo "::error::Decoded secret-key material is not valid base64."
            exit 1
          fi
          decoded_size=$(stat -c '%s' "${RUNNER_TEMP}/anvil-release.key.raw")
          rm -f "${RUNNER_TEMP}/anvil-release.key.raw"
          if [ "${decoded_size}" -lt 64 ]; then
            echo "::error::Decoded minisign key material is ${decoded_size} bytes — looks truncated."
            exit 1
          fi

      - name: Sign each release artefact
        run: |
          set -euo pipefail
          cd assets
          commit_sha="${{ steps.release.outputs.commit_sha }}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          required_assets=(
            "eddacraft-anvil-installer.sh"
            "eddacraft-anvil-installer.ps1"
            "anvil-${TAG}-provenance.json"
          )
          for f in "${required_assets[@]}"; do
            trusted="tag=${TAG};commit=${commit_sha};built=${built_at}"
            case "$f" in
              *.json) label="provenance manifest" ;;
              *)      label="installer" ;;
            esac
            echo "Signing ${f} → ${f}.minisig (${label})"
            # rsign sign: -W = no encryption prompt; -t = trusted comment;
            # -c = untrusted comment; -x = output path.
            echo "" | rsign sign \
              -s "${RUNNER_TEMP}/anvil-release.key" \
              -t "${trusted}" \
              -c "anvil ${TAG} ${label} signature" \
              -x "${f}.minisig" \
              "${f}"
          done
          ls -la *.minisig

      - name: Self-verify each signature (defence-in-depth)
        env:
          ANVIL_MINISIGN_PUBLIC_KEY: ${{ vars.ANVIL_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cd assets
          # Reconstruct a public-key file rsign can read.
          {
            printf 'untrusted comment: minisign public key\n'
            printf '%s\n' "${ANVIL_MINISIGN_PUBLIC_KEY}"
          } > "${RUNNER_TEMP}/anvil-release.pub"
          required_assets=(
            "eddacraft-anvil-installer.sh"
            "eddacraft-anvil-installer.ps1"
            "anvil-${TAG}-provenance.json"
          )
          for f in "${required_assets[@]}"; do
            echo "Verifying ${f} against ${f}.minisig"
            rsign verify -p "${RUNNER_TEMP}/anvil-release.pub" -x "${f}.minisig" "${f}"
          done

      - name: Upload .minisig files to the release
        run: |
          set -euo pipefail
          cd assets
          required_signatures=(
            "eddacraft-anvil-installer.sh.minisig"
            "eddacraft-anvil-installer.ps1.minisig"
            "anvil-${TAG}-provenance.json.minisig"
          )
          for sig in "${required_signatures[@]}"; do
            [ -f "$sig" ] || {
              echo "::error::Required signature is missing: ${sig}"
              exit 1
            }
            echo "Uploading ${sig}"
            # `--clobber` so re-runs of this workflow can replace the signature.
            gh release upload "${TAG}" "${sig}" --clobber
          done

      - name: Mirror .minisig files to the public release
        env:
          GH_TOKEN: ${{ secrets.ANVIL_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secrets.ANVIL_RELEASES_TOKEN is required to mirror signatures publicly."
            exit 1
          fi
          cd assets
          signatures=(
            "eddacraft-anvil-installer.sh.minisig"
            "eddacraft-anvil-installer.ps1.minisig"
            "anvil-${TAG}-provenance.json.minisig"
          )
          gh release upload "${TAG}" \
            --repo eddacraft/anvil \
            --clobber \
            "${signatures[@]}"

      - name: Erase signing key from runner
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/anvil-release.key" "${RUNNER_TEMP}/anvil-release.pub"
