name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  schedule:
    # Weekly full scan: Monday 06:30 UTC (offset from scorecard at 06:00)
    - cron: '30 6 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ── Change detection (skipped on schedule → all languages run) ───
  detect-changes:
    name: Detect Changes
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name != 'schedule'
    outputs:
      source-changed: ${{ steps.changes.outputs.source-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/detect-changes

  # ── JavaScript / TypeScript ──────────────────────────────────────
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # Run when: schedule (detect-changes skipped) OR TS/JS source changed
    if: |
      always() &&
      (needs.detect-changes.result == 'skipped' ||
       needs.detect-changes.outputs.source-changed == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: '/language:javascript-typescript'

  # ── Rust ─────────────────────────────────────────────────────────
  analyze-rust:
    name: Analyze (rust)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # Run when: schedule (detect-changes skipped) OR Rust source changed
    if: |
      always() &&
      (needs.detect-changes.result == 'skipped' ||
       needs.detect-changes.outputs.rust-changed == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1

      - name: Cache Cargo target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: target
          key: codeql-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: codeql-rust-

      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: rust
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Explicit build instead of autobuild for control and caching
      - name: Build Rust workspace
        run: cargo build --workspace

      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: '/language:rust'

  # ── GitHub Actions (schedule only — low-value per-PR) ────────────
  analyze-actions:
    name: Analyze (actions)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: actions
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: '/language:actions'
