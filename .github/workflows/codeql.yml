name: CodeQL

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  schedule:
    # Weekly full scan: Monday 06:30 UTC (offset from scorecard at 06:00)
    - cron: '30 6 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ── Change detection (skipped on schedule → all languages run) ───
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      source-changed: ${{ steps.changes.outputs.source-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/detect-changes

  # ── JavaScript / TypeScript ──────────────────────────────────────
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run when: schedule (detect-changes skipped) OR TS/JS source changed
    if: |
      always() &&
      (needs.detect-changes.result == 'skipped' ||
       needs.detect-changes.outputs.source-changed == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ── Rust ─────────────────────────────────────────────────────────
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run when: schedule (detect-changes skipped) OR Rust source changed
    if: |
      always() &&
      (needs.detect-changes.result == 'skipped' ||
       needs.detect-changes.outputs.rust-changed == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: +security-and-quality

      # Explicit build instead of autobuild for control and caching
      - name: Build Rust workspace
        run: cargo build --workspace

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:rust'

  # ── GitHub Actions (schedule only — low-value per-PR) ────────────
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:actions'
