name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    # CIB-137 SAFETY: the trusted-classifier checkout below trusts
    # `github.event.pull_request.base.sha` ONLY because this filter restricts the
    # base to the protected `main` branch. Do NOT broaden `branches` without
    # re-reviewing that argument.
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  schedule:
    # Weekly full scan: Monday 06:30 UTC (offset from scorecard at 06:00)
    - cron: '30 6 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ── Change detection (skipped on schedule → all languages run) ───
  detect-changes:
    name: Detect Changes
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name != 'schedule'
    outputs:
      source-changed: ${{ steps.changes.outputs.source-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
    steps:
      # Primary checkout at the PR head: the tree whose diff is classified.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # CIB-137: this workflow shares the "Detect Changes" required-context name
      # with ci.yml, so resolve the classifier from a trusted ref (base SHA on a
      # PR, else the already-trusted head) rather than the PR head. See ci.yml
      # for the full rationale.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.sha }}
          path: trusted-classifier
      - id: changes
        uses: ./trusted-classifier/.github/actions/detect-changes

  # ── JavaScript / TypeScript ──────────────────────────────────────
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # Run when: schedule (detect-changes skipped) OR TS/JS source changed.
    # CIB-137: `result != 'success'` also runs the analysis when the classifier
    # FAILED (fail closed) rather than skipping this required context.
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.source-changed == 'true')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:javascript-typescript'

  # ── Rust ─────────────────────────────────────────────────────────
  analyze-rust:
    name: Analyze (rust)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # Run when: push to main with Rust changes, or schedule (detect-changes
    # skipped). CI-cost 2026-07: `pull_request` no longer runs this job — the
    # `cargo build --workspace` it needs is minutes of runner time per PR, and
    # every merge to `main` re-scans the same code moments later, so PR runs
    # only surfaced findings one merge earlier than the push scan does anyway.
    # "Analyze (rust)" is not a required status check, so PR runs simply skip.
    # CIB-137: `result != 'success'` also runs the analysis when the classifier
    # FAILED (fail closed) rather than skipping this context.
    if: |
      always() && github.event_name != 'pull_request' &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.rust-changed == 'true')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: target
          key: codeql-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: codeql-rust-

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: rust
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Explicit build instead of autobuild for control and caching
      - name: Build Rust workspace
        run: cargo build --workspace

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:rust'

  # ── GitHub Actions (schedule only — low-value per-PR) ────────────
  analyze-actions:
    name: Analyze (actions)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: actions
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:actions'
