name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    # CIB-137 SAFETY: the trusted-classifier checkout below trusts
    # `github.event.pull_request.base.sha` ONLY because this filter restricts the
    # base to the protected `main` branch. Do NOT broaden `branches` without
    # re-reviewing that argument.
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - 'LICENSE'
  schedule:
    # Weekly full scan: Monday 06:30 UTC (offset from scorecard at 06:00)
    - cron: '30 6 * * 1'
  # On-demand full scan, with identical semantics to the weekly cron:
  # change detection is skipped and every language is analysed. Added
  # because `Analyze (actions)` is not run by `push` or `pull_request`,
  # so before this trigger existed a fix to a workflow-security finding
  # could not be re-scanned — the alert stayed open until the next
  # Monday even though the fix was already on `main`. Dispatch this
  # after landing such a fix to close the alert.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ── Change detection (skipped on schedule/dispatch → all languages run) ──
  detect-changes:
    name: Detect Changes
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    outputs:
      source-changed: ${{ steps.changes.outputs.source-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
    steps:
      # Primary checkout at the PR head: the tree whose diff is classified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # CIB-137: this workflow shares the "Detect Changes" required-context name
      # with ci.yml, so resolve the classifier from a trusted ref (base SHA on a
      # PR, else the already-trusted head) rather than the PR head. See ci.yml
      # for the full rationale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.sha }}
          path: trusted-classifier
      - id: changes
        uses: ./trusted-classifier/.github/actions/detect-changes

  # ── JavaScript / TypeScript ──────────────────────────────────────
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # Run when: schedule or manual dispatch (detect-changes skipped in
    # both cases) OR TS/JS source changed.
    # CIB-137: `result != 'success'` also runs the analysis when the classifier
    # FAILED (fail closed) rather than skipping this required context.
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.source-changed == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:javascript-typescript'

  # ── Rust ─────────────────────────────────────────────────────────
  analyze-rust:
    name: Analyze (rust)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    needs: detect-changes
    # Run when: push to main with Rust changes, or schedule / manual
    # dispatch (detect-changes skipped in both cases). A dispatched run
    # therefore pays for a full `cargo build --workspace`, same as the
    # weekly scan.
    # CI-cost 2026-07: `pull_request` no longer runs this job — the
    # `cargo build --workspace` it needs is minutes of runner time per PR, and
    # every merge to `main` re-scans the same code moments later, so PR runs
    # only surfaced findings one merge earlier than the push scan does anyway.
    # "Analyze (rust)" is not a required status check, so PR runs simply skip.
    # CIB-137: `result != 'success'` also runs the analysis when the classifier
    # FAILED (fail closed) rather than skipping this context.
    if: |
      always() && github.event_name != 'pull_request' &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.rust-changed == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The extractor drives cargo (metadata + build scripts + proc macros)
      # through rust-analyzer itself; the toolchain is needed, a build is not.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # No target dir is produced here, so nothing to cache.
          cache: false

      # CI-cost 2026-09: Rust analysis is GA on `build-mode: none` — CodeQL
      # builds its database from source and never consumed the explicit
      # `cargo build --workspace` (63s + a 433 MB `codeql-rust-*` target
      # cache, out of a saturated 10 GB quota) that used to precede
      # `analyze`. The 37 min this job still spends is query evaluation on
      # the standard 2-core runner; the 8-core pool is capped at one machine
      # and gates the required `Test` check, so it is not moved there.
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: rust
          build-mode: none
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:rust'

  # ── GitHub Actions (schedule/dispatch only — low-value per-PR) ───
  analyze-actions:
    name: Analyze (actions)
    runs-on:
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER ||
      'ubuntu-latest' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:actions'
