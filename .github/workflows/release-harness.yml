name: Release Harness

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-harness.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-harness.yml'
  workflow_dispatch:

concurrency:
  group:
    release-harness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Release Command Contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run release command harness
        run: |
          bash scripts/release/_test/contract.test.sh
          bash scripts/release/_test/assess.test.sh
          bash scripts/release/_test/preflight.test.sh
          bash scripts/release/_test/prepare.test.sh
          bash scripts/release/_test/promote.test.sh
          bash scripts/release/_test/tag.test.sh
          bash scripts/release/_test/monitor.test.sh
          bash scripts/release/_test/verify.test.sh
          bash scripts/release/_test/closeout.test.sh
          bash scripts/release/_test/generate-evidence.test.sh
