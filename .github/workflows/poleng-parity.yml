# POLENG-008 parity gate: regorus vs the Go OPA reference (ADR-040 D-1).
#
# Advisory sidecar — intentionally NOT in the required-checks ruleset (so it
# cannot be enforced from this file; the constraint lives in repo settings). A
# red run means regorus measured slower than Go OPA on a representative policy,
# which is an ADR-040 D-5 trigger (revisit the engine choice), not a routine
# merge block. Installs the repo-pinned Go OPA (v1.16.1, same
# `open-policy-agent/setup-opa` action `rust.yml` trusts) and runs
# scripts/bench-vs-go-opa.sh.
name: POLENG parity gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/anvil-policy-engine/**'
      - 'scripts/bench-vs-go-opa.sh'
      - '.github/workflows/poleng-parity.yml'
  pull_request:
    paths:
      - 'crates/anvil-policy-engine/**'
      - 'scripts/bench-vs-go-opa.sh'
      - '.github/workflows/poleng-parity.yml'

concurrency:
  group: poleng-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: regorus vs Go OPA parity
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ci
          save-if: 'false'
      # Repo-pinned Go OPA reference (matches rust.yml; under
      # scripts/check-opa-version-pin.sh discipline).
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.16.1
      - name: Run parity gate
        run: scripts/bench-vs-go-opa.sh 2000
