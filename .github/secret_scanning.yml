# Secret-scanning path exclusions.
#
# ORDERING NOTE: this file lands BEFORE the directory it excludes. GitHub reads
# `secret_scanning.yml` from the default branch only, so the exclusion cannot
# take effect on the very push that introduces the corpus — it has to be on
# `main` first. Between this merge and SDT-002 landing, the path below and the
# `PROVENANCE.md` reference point at files that do not exist yet. That is
# deliberate and short-lived, not rot. An excluded path that matches nothing
# excludes nothing, so there is no window in which this weakens scanning.
#
# SDT-002. The calibration corpus is a deliberate collection of
# credential-shaped strings used to measure anvil's own secret detector. Every
# planted value is full-shape for anvil's regexes and checksum-invalid to the
# provider that issues it, built from a `CANARY` marker plus fixed filler — see
# `crates/anvil-checks/tests/corpus/secret/PROVENANCE.md` (arriving with
# SDT-002), which is the authority on what lives there and why the values must
# never be "fixed" into valid keys.
#
# Without this exclusion, GitHub push protection blocks every push touching the
# corpus (8 detections at the time of writing: Stripe, Stripe Test, Slack,
# Shopify, Mailgun, Postman, and others revealed in waves), because those
# detectors match shape rather than validating the credential. The alternative
# is a per-secret bypass on every push that adds or edits a case, which does not
# survive contact with a corpus designed to grow under SDT-004.
#
# Scope is deliberately one directory. This does NOT exclude the rest of the
# repository, and it does not weaken CI Secret Scan (TruffleHog
# `--only-verified`), which cannot verify a synthetic value in the first place.
# The corpus carries its own trip-wire — `corpus_metadata_stays_clean_under_the_scanner`
# scans the manifest, the provenance doc and the runner and fails if any of them
# grows a credential shape — so the excluded directory is not unpoliced, it is
# policed by the detector it exists to calibrate.
paths-ignore:
  - 'crates/anvil-checks/tests/corpus/secret/**'
