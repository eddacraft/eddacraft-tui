# cargo-deny configuration for eddacraft-tui.
# See https://embarkstudios.github.io/cargo-deny/.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Pin the unmaintained policy so a cargo-deny minor bump doesn't silently
# shift behaviour. "workspace" flags direct deps but not deep transitives.
unmaintained = "workspace"
ignore = []

[bans]
# Duplicate versions in the graph are usually transitive bumps from optional
# features; flag them but don't block — pair with `skip` for known cases.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = [
    # `image` and `ratatui-image` pull both rustix 0.38.* and 1.x. Tracked
    # upstream; remove this skip once both deps are on rustix 1.x.
    { name = "rustix" },
]
skip-tree = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
