# Regal configuration for Anvil policy linting
# https://github.com/open-policy-agent/regal

rules:
  style:
    opa-fmt:
      level: warning
    line-length:
      max-line-length: 120
      level: warning
    todo-comment:
      level: ignore
    # These are style preferences — warn, don't block
    prefer-some-in-iteration:
      level: warning
    comprehension-term-assignment:
      level: warning
    messy-rule:
      level: warning

  idiomatic:
    use-rego-v1:
      level: error
    # Fixture files don't need to mirror package directory structure
    directory-package-mismatch:
      level: ignore
    # Entrypoint annotations are for bundle optimisation, not needed for fixtures
    no-defined-entrypoint:
      level: ignore

  performance:
    # Non-loop expressions are acceptable in simple fixture policies
    non-loop-expression:
      level: warning

  bugs:
    # Redundant existence checks are common in config override patterns
    redundant-existence-check:
      level: warning

project:
  roots:
    - policies
