[workspace]
resolver = "2"
members = [
  "crates/spike",
  "crates/anvil-kernel-types",
  "crates/anvil-graph-cache",
  "crates/anvil-gctx-types",
  "crates/anvil-gctx-egress",
  "crates/anvil-kernel",
  "crates/anvil-grammar-wat",
  "crates/anvil-rayon-init",
  "crates/anvil-tui",
  "crates/anvil-checks",
  "crates/anvil-checks-ast",
  "crates/anvil-checks-napi",
  "crates/anvil-bench",
  "crates/anvil-capsule",
  "crates/anvil-cli",
  "crates/anvil-sarif",
  "crates/anvil-config",
  "crates/anvil-intercept",
  "crates/anvil-intercept-proto",
  "crates/anvil-run",
  "crates/anvil-observability",
  "crates/anvil-intercept-rules",
  "crates/anvil-intercept-macos",
  "crates/anvil-intercept-win32",
  "crates/anvil-policy",
  "crates/anvil-policy-engine",
  "crates/anvil-witness",
  "crates/anvil-rules",
  "crates/anvil-baseline",
  "crates/anvil-hook",
  "crates/anvil-l4",
  "crates/anvil-architecture",
  "crates/anvil-attribution",
  "crates/anvil-dashboard-server",
  "crates/eddacraft-tui",
  "crates/workspace-hack",
]

[workspace.package]
version = "0.9.4-beta"
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/eddacraft/anvil-001"

[workspace.dependencies]
# Local HTTP surfaces
axum = "0.8"
tower = "0.5"

# Parsing
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
# Tail-language wave (LANGTAIL) — each grammar audited for ABI compatibility
# with the tree-sitter 0.26 runtime in LANGTAIL-001 before inclusion.
tree-sitter-dart = "0.2"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# Tail-language wave 2 (LTW2, ADR-093) — audited against the tree-sitter 0.26
# runtime in LTW2-001 (binds + parses cleanly).
tree-sitter-zig = "1.1.2"
# Version-stable grammar binding shim (`LanguageFn`), used to bind the vendored
# WebAssembly-text grammar (LTW2-002) which ships no published crate.
tree-sitter-language = "0.1"
# Compiles the vendored `tree-sitter-wat` `parser.c` (LTW2-002).
cc = "1"

# File watching
notify = "8"

# Graph
petgraph = "0.8"

# Parallelism
rayon = "1.11"
num_cpus = "1"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
# Binary snapshot codec (ADR-069 §1 — sealed-DTO graph-cache snapshots).
# Chosen over bincode for a formally stable, versioned wire format (no v1/v2
# wire-incompatibility footgun); pure-Rust, no native build step.
postcard = { version = "1", features = ["use-std"] }
# Test-only schema validation (SARIF 2.1.0, OpenAPI components, MCP tool
# schemas). Centralised here so a bump lands in one place: four crates carry it
# as a dev-dependency and previously pinned the version independently.
# Note: `regorus` (pinned `=0.11.0`, below) carries its own `jsonschema` as a
# normal dependency, so the graph holds two copies until that pin moves.
jsonschema = "0.49"

# Policy engine (ADR-040 — pinned at a committed minor version)
# default-features off so the sole consumer (anvil-policy-engine) opts into a
# pure-only feature subset for the POLENG-009 determinism fence; see that
# crate's Cargo.toml.
regorus = { version = "=0.11.0", default-features = false }

# TUI
animate = { version = "0.3", features = ["ratatui"] }
eddacraft-tui = { path = "crates/eddacraft-tui" }
ratatui = "0.30"
crossterm = "0.29"

# CLI
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

# Identity (project_uuid for MLP-001 / A7.2)
uuid = { version = "1", features = ["v4", "v7"] }

# Semver parsing (anvil-rules required-version floor, anvil-l4 version-floor evaluation)
semver = "1"

# Hex encoding (opaque GCTX pagination cursors; CLI artefact hashing)
hex = "0.4"

# Filesystem test fixtures
tempfile = "3"

# SQLite reader for the Ember proposal store (.anvil/ember.db, written by the
# edda-stack `ProposalStore`). RCLI3-005. The `bundled` feature is opted into
# per-consumer (anvil-cli) rather than here, so a future crate taking
# `rusqlite = { workspace = true }` does not silently inherit a SQLite C build.
rusqlite = { version = "0.40" }

# Error handling
thiserror = "2"
miette = { version = "7", features = ["derive", "fancy"] }

# Observability (TRACE-001 / ADR-035)
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }

# Async
tokio = { version = "1", features = ["full"] }

# File system
walkdir = "2"
regex = "1"
globset = "0.4"

# Testing
insta = { version = "1", features = ["yaml"] }
criterion = { version = "0.8", features = ["html_reports"] }

# Internal workspace-hack (managed by cargo hakari)
workspace-hack = { version = "0.1.0", path = "crates/workspace-hack" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common pedantic false positives
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# DEVENV-001 (ADR-057): trim dev + test debug info to shrink each worktree's
# `target/` at the base. With no `[profile.dev]`, both inherited cargo's default
# `debug = 2` (full DWARF) — the dominant contributor to ~100 GB targets on the
# shared concurrent-agent box. `line-tables-only` keeps file:line in panics and
# backtraces but drops variable/type DWARF: interactive `gdb`/`lldb` local-
# variable inspection on dev builds is degraded — use
# `RUSTFLAGS=-Cdebuginfo=2 cargo build` for a full-debug build when needed.
# Unwinding / `catch_unwind` (ADR-051) is control-flow and is unaffected.
# `incremental` is left at the default `true` (turning it off would slow
# iterative agent builds); relocation + eviction (DEVENV-002/-004) handle the
# space axis. `split-debuginfo` is intentionally NOT set: it controls debuginfo
# layout, not size, so it adds nothing to the trim, and `[profile.*]` applies to
# every target (Windows-msvc defaults to `packed`, not `unpacked`) — pinning it
# here would silently change non-Linux behaviour for no benefit.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
# panic = "unwind" (ADR-051). `anvil` processes untrusted input (policies, repo
# content) and `anvil policy eval` is a machine-parsed CI gate; a regorus
# internal panic on an adversarial/malformed policy must unwind to a
# `catch_unwind` guard at the policy-engine facade (mapping it to a structured
# error + non-zero exit) instead of aborting with no diagnostics. This was
# `panic = "abort"`; abort is the wrong fit for untrusted-input tooling whose
# output is parsed. `catch_unwind` is a no-op under abort, so unwind is load-
# bearing for that guard.
panic = "unwind"

# Profile for the napi-rs binding crate. Inherits release; `panic = "unwind"`
# is kept explicit (the binding relies on it so a scanner panic returns to the
# napi FFI boundary and maps to a JS exception rather than aborting the host
# Node process — the same boundary discipline ADR-051 generalises to the CLI).
[profile.release-napi]
inherits = "release"
panic = "unwind"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
strip = "symbols"
