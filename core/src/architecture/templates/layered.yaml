# Layered Architecture Template
# Traditional 3-tier architecture: presentation → business → data

name: layered
description: Traditional layered architecture with presentation, business, and data tiers

layers:
  presentation:
    patterns:
      - src/controllers/**
      - src/routes/**
      - src/api/**
    depends_on:
      - business
      - shared
    description: User interface and API endpoints

  business:
    patterns:
      - src/services/**
      - src/use-cases/**
    depends_on:
      - data
      - shared
    description: Business logic and application services

  data:
    patterns:
      - src/repositories/**
      - src/db/**
      - src/data/**
    depends_on:
      - shared
    description: Data access and persistence

  shared:
    patterns:
      - src/utils/**
      - src/lib/**
      - src/common/**
    depends_on: []
    description: Shared utilities and common code
