# Clean Architecture Template
# Uncle Bob's Clean Architecture with inward dependencies

name: clean
description: Uncle Bob's Clean Architecture - strict dependency rules with entities at the core

layers:
  entities:
    patterns:
      - src/entities/**
      - src/domain/entities/**
    depends_on: []
    description: Enterprise business rules

  use_cases:
    patterns:
      - src/use-cases/**
      - src/application/**
    depends_on:
      - entities
    description: Application business rules

  interface_adapters:
    patterns:
      - src/adapters/**
      - src/controllers/**
      - src/presenters/**
    depends_on:
      - use_cases
      - entities
    description: Interface adapters for controllers and presenters

  frameworks:
    patterns:
      - src/frameworks/**
      - src/infrastructure/**
      - src/db/**
    depends_on:
      - interface_adapters
      - use_cases
      - entities
    description: Frameworks and drivers
