# Hexagonal Architecture Template
# Ports and Adapters pattern with core isolation

name: hexagonal
description: Ports and Adapters architecture with isolated domain core

layers:
  core:
    patterns:
      - src/domain/**
      - src/core/**
    depends_on: []
    description: Domain logic - no external dependencies

  ports:
    patterns:
      - src/ports/**
      - src/interfaces/**
    depends_on:
      - core
    description: Port interfaces defining boundaries

  adapters:
    patterns:
      - src/adapters/**
      - src/infrastructure/**
    depends_on:
      - ports
      - core
    description: Adapter implementations for external systems

  application:
    patterns:
      - src/application/**
      - src/services/**
    depends_on:
      - core
      - ports
    description: Application services orchestrating use cases
