# Starter Architecture Template
# Simple and flexible structure for new projects

name: starter
description:
  Simple and flexible structure for new projects, MVPs, and learning - evolves with your needs

layers:
  components:
    patterns:
      - src/components/**
      - src/ui/**
    depends_on:
      - lib
    description: UI components and visual elements

  lib:
    patterns:
      - src/lib/**
      - src/utils/**
      - src/helpers/**
    depends_on: []
    description: Shared utilities and helper functions

  services:
    patterns:
      - src/services/**
      - src/api/**
    depends_on:
      - lib
    description: API calls and external service integrations
