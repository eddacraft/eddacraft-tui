# ATTRIB-006: canonical licence allow-list for this repository.
#
# Two downstream consumers historically duplicated this list:
#
# - `about.toml` — cargo-about's `accepted = [...]` array, used to
#   render `ACKNOWLEDGEMENTS.md`.
# - `deny.toml`  — cargo-deny's `[licenses].allow = [...]` array, used
#   to gate the workspace against unallowed third-party licences.
#
# This file is the single source of truth. The expander
# (`tools/starters/acknowledgements/expand-licences.sh`) rebuilds the
# `accepted` array in `about.toml` and the `allow` array in
# `deny.toml` from this file. CI runs the expander in `--check` mode
# so any drift between this file and either consumer fails the build.
#
# Schema:
#
#   [[licences]]
#   spdx  = "SPDX identifier"  (string, required)
#   about = true|false          (bool, required — include in about.toml)
#   deny  = true|false          (bool, required — include in deny.toml)
#   note  = "free text"         (string, optional — emitted as a
#                                 comment line above the entry in the
#                                 consumer file; preserves the
#                                 historical inline justifications)
#
# Ordering in this file is the ordering downstream consumers receive.
# Keep semantic groupings together — the common-licence block first,
# then the per-consumer additions — so a reviewer can scan the array
# and recognise it.

# --- Common: included in both about.toml.accepted and deny.toml.allow ---

[[licences]]
spdx = "MIT"
about = true
deny = true

[[licences]]
spdx = "MIT-0"
about = true
deny = true

[[licences]]
spdx = "Apache-2.0"
about = true
deny = true

[[licences]]
spdx = "Apache-2.0 WITH LLVM-exception"
about = true
deny = true

[[licences]]
spdx = "BSD-2-Clause"
about = true
deny = true

[[licences]]
spdx = "BSD-3-Clause"
about = true
deny = true

[[licences]]
spdx = "ISC"
about = true
deny = true

[[licences]]
spdx = "Unicode-DFS-2016"
about = true
deny = true

[[licences]]
spdx = "Unicode-3.0"
about = true
deny = true

[[licences]]
spdx = "CC0-1.0"
about = true
deny = true

[[licences]]
spdx = "Zlib"
about = true
deny = true

[[licences]]
spdx = "MPL-2.0"
about = true
deny = true

# --- About-only: cargo-about needs this but cargo-deny does not ---

[[licences]]
spdx = "OpenSSL"
about = true
deny = false
note = "Accepted for the `ring` crate only — activated via the `ring` workaround in about.toml. ring is not currently a runtime dep (rustls defaults to aws-lc-rs in this workspace), but it's in Cargo.lock behind optional feature flags in quinn-proto and rustls-webpki. This is defensive: if we ever flip rustls's crypto backend to ring, cargo-about will attribute it correctly rather than silently dropping it."

# --- Deny-only: cargo-deny needs this but cargo-about filters it via private.ignore ---

[[licences]]
spdx = "LicenseRef-Proprietary"
about = false
deny = true
note = "Anvil's internal crates carry `license = \"LicenseRef-Proprietary\"`; about.toml's private.ignore filters them out of the generated attribution, so this entry never needs to appear in about.toml.accepted."
