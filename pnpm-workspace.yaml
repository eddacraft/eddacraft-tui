  '@opentelemetry/propagator-jaeger@<2.8.0': '2.8.0'
  '@opentelemetry/resources@<2.8.0': '2.8.0'
  '@opentelemetry/sdk-logs@<0.219.0': '0.219.0'
  '@opentelemetry/sdk-metrics@<2.8.0': '2.8.0'
  '@opentelemetry/sdk-trace-base@<2.8.0': '2.8.0'
  '@opentelemetry/sdk-trace-node@<2.8.0': '2.8.0'
  'js-yaml@>=3.0.0 <4.0.0': '4.3.0'
  'js-yaml@>=4.0.0 <4.3.0': '4.3.0'
  # Collapse React type packages to a single version. pnpm 11's resolution
  # leaves multiple @types/react copies (19.2.16 + 19.2.17) in the tree, and
  # tsc cannot portably name a type that crosses copies (TS2883) — e.g. a Next
  # page whose inferred JSX.Element comes from a different @types/react than the
  # consumer declares. Pinning one version removes the skew.
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'

patchedDependencies:
  'gray-matter@4.0.3': 'patches/gray-matter@4.0.3.patch'
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@5.1.9: patches/minimatch@5.1.9.patch

# Single source of truth for dependency build-script approval under pnpm 11.
# `allowBuilds` replaces the pre-11 `onlyBuiltDependencies` (-> true) and
# `ignoredBuiltDependencies` (-> false) lists, which pnpm 11 deprecates. Entries
# for packages not currently in the tree are retained to preserve intent if they
# reappear. Packages with build scripts that are absent here fail by default
# (strictDepBuilds), so add new ones explicitly.
allowBuilds:
  '@devm33/node-pty': false
  '@pulumi/command': true
  '@swc/core': false
  '@vscode/vsce-sign': false
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  keytar: false
  keytar-forked-forked: false
  node-pty: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: false
