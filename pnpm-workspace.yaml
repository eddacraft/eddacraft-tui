packages:
  # Infrastructure
  - infra
  # Apps (v1.1+)
  - apps/*
  # Core domain packages
  - packages/anvil/*
  # Existing packages
  - packages/adapters
  - packages/anvil-driver-client
  - packages/aps
  - packages/docs-meta
  - packages/edda-stack
  - packages/eslint-plugin-anvil
  - packages/kindling-integration
  # Shared infrastructure (ADR-015)
  - packages/shared/*
  # Shared libraries (ADR-015)
  - packages/libs/*
  # Transactional email templates
  - packages/transactional
  # Tooling packages
  - packages/tooling/*
  # Tools
  - tools/*
  # ATTRIB-015 devtools manifest. Excluded from the pnpm-workspace so
  # `npm ci` inside `tools/dev` produces an isolated `license-checker`
  # dependency tree — pnpm workspace hoisting otherwise resolves a `glob`
  # major that's incompatible with `license-checker@25.0.1`'s
  # `read-package-json` transitive (`TypeError: glob is not a function`).
  #
  # The driver itself does NOT install anything or modify PATH. The
  # consumer (the acknowledgements freshness CI job, or a contributor
  # running the generator locally) is responsible for ensuring
  # `license-checker` is on PATH and `tools/dev/node_modules` is
  # populated. The recipe is `(cd tools/dev && npm ci)` then prepend
  # `tools/dev/node_modules/.bin` to `PATH` before invoking
  # `generate-acknowledgements.sh`. See
  # `.github/workflows/rust.yml::acknowledgements-diff` for the CI
  # wire-up.
  - '!tools/dev'
  # Native binding crates that ship as npm packages (Rust source lives in
  # the cargo workspace; pnpm picks them up here for `pnpm --filter` access).
  - crates/anvil-checks-napi

