version = 1
# Grok and OpenCode also discover `.claude/skills` and `.agents/skills`
# (CAP-006). Emitting the same shared skills into `.grok/skills` and
# `.opencode/skills` triples each name in those pickers. Keep Claude and
# Codex as the vend targets; leave the native Grok/OpenCode adapters on
# disk unmanaged until the catalogue emitter skips overlapping roots.
targets = ["claude-code", "codex"]
bundles = []
skills = [
  "eddacraft/agentic-loop",
  "eddacraft/dev-loop",
  "eddacraft/dev-loop-module",
  "eddacraft/planning-workflow",
  "eddacraft/aps-planning",
  "eddacraft/aps-probe",
  "eddacraft/aps-safety-rails",
  "eddacraft/aps-landing",
  "eddacraft/aps-escalation-queue",
  "eddacraft/aps-resume",
  "eddacraft/plan-ready",
  "eddacraft/plan-doctor",
  "eddacraft/grill-design",
  "eddacraft/isolate-workspace",
  "eddacraft/loop-build-tdd",
  "eddacraft/loop-debug",
  "eddacraft/evidence-gate",
  "eddacraft/land-branch",
  "eddacraft/address-reviews",
  "eddacraft/verify-loop",
  "eddacraft/dev-loop-router",
  "eddacraft/dev-loop-adapter-claude",
  "eddacraft/dev-loop-adapter-codex",
  "eddacraft/council",
  "eddacraft/agent-messaging",
  "eddacraft/agent-vault",
  "eddacraft/docs-workflow",
  "eddacraft/openfeature",
  "eddacraft/code-review",
  "eddacraft/commit",
  "eddacraft/security-and-quality",
  "eddacraft/using-anvil",
  "eddacraft/anvil-opportunity-assessment",
  "eddacraft/how",
]
agents = [
  "eddacraft/council-debate",
  "eddacraft/council-judge",
  "eddacraft/council-supervisor",
  "eddacraft/debugger",
  "eddacraft/dev-loop-verifier",
  "eddacraft/security-analyst",
]

[catalogue]
source = "https://github.com/eddacraft/skills.git"
ref = "main"
