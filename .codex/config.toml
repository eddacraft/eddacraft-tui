# Project-local Codex defaults for Anvil.
# Loaded only for trusted checkouts. Network egress plus inherited env can expose secrets; keep machine-local tokens out.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
sandbox_permissions = ["disk-full-read-access"]

[sandbox_workspace_write]
network_access = true
# Add your Worktrunk parent directory in global config if sibling worktree writes are needed.
writable_roots = ["/tmp"]

[shell_environment_policy]
inherit = "all"
