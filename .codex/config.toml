# Project-local Codex defaults for Anvil.
# Loaded only for trusted checkouts; keep secrets and machine-local tokens out.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
sandbox_permissions = ["disk-full-read-access"]

[sandbox_workspace_write]
network_access = true
writable_roots = ["/home/aneki/Projects/src", "/tmp"]

[shell_environment_policy]
inherit = "all"
